<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>圓周長和圓面積 分級練習</title>
<style>
:root{--g:#22b573;--gd:#0c8a50;--o:#ff922b;--bg:#fff9f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);font-family:'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;color:#333;overflow:hidden;user-select:none}
#app{display:grid;grid-template-columns:12rem 1fr;height:100%}
nav{background:#fff;border-right:3px solid #f1e3cf;display:flex;flex-direction:column;gap:.6rem;padding:.8rem .6rem}
.tt{font-size:1.05rem;font-weight:900;color:#999;padding:.2rem .4rem .4rem}.tt b{display:block;font-size:1.45rem;color:var(--g);line-height:1.25}
.lv{border:4px solid #eee;border-radius:18px;padding:.6rem .7rem;cursor:pointer;background:#fff}
.lv .n{font-size:1.6rem;font-weight:900;color:#555}.lv .s{font-size:1.05rem;color:#f59f00;letter-spacing:.1em}
.lv .bar{height:.55rem;border-radius:9px;background:#f1f3f5;margin-top:.4rem;overflow:hidden}.lv .bar i{display:block;height:100%;background:var(--g);width:0;transition:width .3s}
.lv .c{font-size:1rem;color:#888;font-weight:800;margin-top:.2rem}
.lv.on{border-color:var(--g);background:#e6fcf5}
.lv.l1.on{border-color:#22b573}.lv.l2.on{border-color:#339af0;background:#e7f5ff}.lv.l3.on{border-color:#f76707;background:#fff4e6}
.lv.l4{background:linear-gradient(135deg,#fff,#f3f0ff)}.lv.l4 .n{color:#5f3dc4}.lv.l4.on{border-color:#7048e8;background:#e5dbff}
.sp{flex:1}
#fs{border:3px solid #e9ecef;background:#fff;border-radius:14px;font-size:1.05rem;font-weight:900;color:#888;padding:.4rem}
main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:.6rem .8rem .7rem;gap:.6rem}
#top{display:flex;align-items:center;gap:.7rem}
#qno{flex:none;background:var(--g);color:#fff;font-weight:900;font-size:1.4rem;border-radius:14px;padding:.25rem .8rem}
#dots{display:flex;gap:.3rem;margin-left:auto}#dots i{width:1.1rem;height:1.1rem;border-radius:50%;background:#e9ecef}
#dots i.cur{outline:3px solid var(--o);outline-offset:2px}#dots i.ok{background:var(--g)}#dots i.ok2{background:#94d82d}#dots i.no{background:#ffa8a8}
#q{font-size:2rem;font-weight:900;line-height:1.45;background:#fff;border-radius:20px;padding:.5rem 1rem;box-shadow:0 4px 0 #f1e3cf}
#q .num{color:#1c7ed6}
#body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 24rem;gap:.7rem}
.card{background:#fff;border-radius:22px;box-shadow:0 4px 0 #f1e3cf;min-height:0}
#figc{display:flex;flex-direction:column;padding:.5rem;overflow:hidden}
#fig{flex:1;min-height:0;width:100%}
#steps{display:flex;flex-direction:column;gap:.25rem;padding:0 .6rem .3rem}
#steps div{font-size:1.65rem;font-weight:900;animation:fade .3s}
#steps .h{color:#7048e8}#steps .sol{color:#2b8a3e}
#ansc{display:flex;flex-direction:column;gap:.55rem;padding:.8rem}
#ansline{display:flex;align-items:center;gap:.5rem;font-size:1.7rem;font-weight:900;color:#555;justify-content:center;white-space:nowrap}
#unit{flex:none}
#ansline .pre{color:#888}
#box{flex:1;min-width:0;max-width:9em;height:1.8em;border:4px solid var(--o);border-radius:16px;background:#fff8ef;display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:#d9480f;font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif}
#box.ok{border-color:#37b24d;background:#d3f9d8;color:#2b8a3e}
#box.no{border-color:#fa5252;background:#ffe3e3;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
#fb{min-height:2.6rem;font-size:1.45rem;font-weight:900;text-align:center;line-height:1.3}
#fb.good{color:#2b8a3e}#fb.bad{color:#e03131}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;flex:1;min-height:0}
#pad button{border:0;border-radius:14px;background:#f1f3f5;font:900 1.9rem 'Avenir Next','Helvetica Neue',Arial,sans-serif;color:#444;box-shadow:0 4px 0 #dee2e6;min-height:2.6rem}
#pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #dee2e6}
#pad .del{background:#fff0f0;color:#e03131}
#pad .ck{grid-column:span 2;background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd);font-family:inherit;font-size:1.7rem}
#acts{display:flex;gap:.5rem}
#acts button{flex:1;border:4px solid #e9ecef;background:#fff;border-radius:16px;font:900 1.4rem 'PingFang TC','Microsoft JhengHei',sans-serif;color:#666;padding:.35rem}
#acts .hint{border-color:#d0bfff;color:#7048e8}#acts .hint.pulse{animation:pl 1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 .4rem rgba(112,72,232,.25)}}
#acts .next{background:var(--o);border-color:var(--o);color:#fff;box-shadow:0 4px 0 #e8590c}
#acts button:disabled{opacity:.35}
#acts .hide{display:none}
/* 結算 */
#end{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:5}
#end.on{display:flex}
#end .box{background:#fff;border-radius:28px;padding:1.6rem 2.4rem;text-align:center;min-width:26rem;animation:fade .3s}
#end h2{margin:.2rem 0 .6rem;font-size:2.4rem}
#end .big{font-size:4.2rem;font-weight:900;color:var(--g)}
#end .st{font-size:2.6rem;color:#f59f00;letter-spacing:.15em}
#end .sub{font-size:1.4rem;color:#777;font-weight:800;margin:.3rem 0 1rem}
#end button{border:0;border-radius:18px;font:900 1.6rem 'PingFang TC','Microsoft JhengHei',sans-serif;padding:.5rem 1.3rem;margin:.3rem;background:#f1f3f5;color:#555}
#end button.go{background:var(--o);color:#fff;box-shadow:0 4px 0 #e8590c}
svg text{font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:8px;stroke-linejoin:round}
@media (max-width:1100px){#body{grid-template-columns:1fr 20rem}#q{font-size:1.7rem}#steps div{font-size:1.4rem}}
@media (max-width:900px),(orientation:portrait){html,body{overflow:auto}#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100%}
 nav{flex-direction:row;border-right:0;border-bottom:3px solid #f1e3cf;padding:.4rem}.tt,.sp,#fs{display:none}.lv{flex:1;padding:.4rem .5rem}.lv .n{font-size:1.3rem}
 #body{grid-template-columns:1fr;grid-template-rows:minmax(22rem,42vh) auto}#pad{min-height:15rem}}
</style></head><body>
<div id="app">
<nav id="nav"><div class="tt">第4單元<b>圓周長和<br>圓面積</b></div></nav>
<main>
 <div id="top"><span id="qno">第 1 題</span><span id="dots"></span></div>
 <div id="q"></div>
 <div id="body">
  <div class="card" id="figc"><svg id="fig" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet"></svg><div id="steps"></div></div>
  <div class="card" id="ansc">
   <div id="ansline"><span class="pre" id="pre">約</span><span id="box"></span><span id="unit"></span></div>
   <div id="fb"></div>
   <div id="pad"></div>
   <div id="acts"><button class="hint" id="hint">💡 提示</button><button id="show" class="hide">看解答</button><button class="next" id="next" disabled>下一題 ▶</button></div>
  </div>
 </div>
</main>
</div>
<div id="end"><div class="box"><h2 id="endt"></h2><div class="st" id="ends"></div><div class="big" id="endn"></div><div class="sub" id="endsub"></div><div id="endb"></div></div></div>
<script>
const NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s);
function mk(p,t,a={},s){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(s!=null)e.textContent=s;if(p)p.appendChild(e);return e}
function tx(p,x,y,s,o={}){return mk(p,'text',Object.assign({x,y,'text-anchor':'middle','font-size':40,fill:'#333'},o),s)}
const f=x=>String(+(+x).toFixed(4));            // 去掉浮點誤差
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ev=(a,b)=>ri(a/2,b/2)*2;                    // 偶數
const PI='3.14';
const B='#1c7ed6',O='#f76707',R='#e03131',P='#7048e8',FILL='#d0ebff',SH='#ffd8a8';

/* ---------- 圖 ---------- */
const F={
 circle(g,{show,lab,per}){const cx=400,cy=255,r=200;mk(g,'circle',{cx,cy,r,fill:FILL,stroke:per?O:B,'stroke-width':per?10:5});mk(g,'circle',{cx,cy,r:7,fill:'#333'});
  if(show==='r'){mk(g,'line',{x1:cx,y1:cy,x2:cx+r,y2:cy,stroke:R,'stroke-width':7,'stroke-linecap':'round'});tx(g,cx+r/2,cy-20,lab,{fill:R})}
  if(show==='d'){mk(g,'line',{x1:cx-r,y1:cy,x2:cx+r,y2:cy,stroke:P,'stroke-width':7,'stroke-linecap':'round'});tx(g,cx,cy-20,lab,{fill:P})}
  if(show==='rq'){mk(g,'line',{x1:cx,y1:cy,x2:cx+r*.7,y2:cy-r*.7,stroke:'#8d5524','stroke-width':6,'stroke-dasharray':'12 8'});tx(g,cx+r*.42,cy-r*.42-18,'？',{fill:'#8d5524'})}
  if(per)tx(g,cx,cy+r+48>515?510:cy+r+48,per,{fill:O,'font-size':38})},
 ring(g,{R0,r0}){const cx=400,cy=260,K=220/R0,a=K*R0,b=K*r0;mk(g,'circle',{cx,cy,r:a,fill:SH,stroke:'#adb5bd','stroke-width':4});mk(g,'circle',{cx,cy,r:b,fill:'#fff',stroke:'#adb5bd','stroke-width':4});mk(g,'circle',{cx,cy,r:6,fill:'#333'});
  mk(g,'line',{x1:cx,y1:cy,x2:cx+a,y2:cy,stroke:R,'stroke-width':6});tx(g,cx+a+10,cy+14,`${R0} 公分`,{fill:R,'text-anchor':'start','font-size':34});
  const ang=-135*Math.PI/180;mk(g,'line',{x1:cx,y1:cy,x2:cx+b*Math.cos(ang),y2:cy+b*Math.sin(ang),stroke:P,'stroke-width':6});tx(g,cx+b*Math.cos(ang)-8,cy+b*Math.sin(ang)-14,`${r0} 公分`,{fill:P,'text-anchor':'end','font-size':34})},
 sqc(g,{a,circle}){const s=400,x=200,y=36;mk(g,'rect',{x,y,width:s,height:s,fill:circle?'#fff':SH,stroke:'#555','stroke-width':4});mk(g,'circle',{cx:x+s/2,cy:y+s/2,r:s/2,fill:circle?FILL:'#fff',stroke:circle?B:'#555','stroke-width':4});
  mk(g,'line',{x1:x,y1:y+s+24,x2:x+s,y2:y+s+24,stroke:'#555','stroke-width':4});tx(g,x+s/2,y+s+66,`${a} 公分`,{fill:'#333','font-size':36})},
 cirsq(g,{r}){const cx=400,cy=255,R0=215;mk(g,'circle',{cx,cy,r:R0,fill:SH,stroke:'#555','stroke-width':4});mk(g,'path',{d:`M${cx} ${cy-R0}L${cx+R0} ${cy}L${cx} ${cy+R0}L${cx-R0} ${cy}Z`,fill:'#fff',stroke:'#555','stroke-width':4});
  mk(g,'line',{x1:cx-R0,y1:cy,x2:cx+R0,y2:cy,stroke:'#adb5bd','stroke-width':3,'stroke-dasharray':'8 6'});mk(g,'line',{x1:cx,y1:cy-R0,x2:cx,y2:cy+R0,stroke:'#adb5bd','stroke-width':3,'stroke-dasharray':'8 6'});
  mk(g,'line',{x1:cx,y1:cy,x2:cx+R0,y2:cy,stroke:R,'stroke-width':6});mk(g,'circle',{cx,cy,r:6,fill:'#333'});tx(g,cx+R0/2,cy+46,`${r} 公分`,{fill:R,'font-size':34})},
 rect2(g,{r}){const u=170,x=60,y=80,w=4*u,h=2*u;mk(g,'rect',{x,y,width:w,height:h,fill:SH,stroke:'#555','stroke-width':4});
  [x+u,x+3*u].forEach(cx=>{mk(g,'circle',{cx,cy:y+u,r:u,fill:'#fff',stroke:'#555','stroke-width':4})});mk(g,'circle',{cx:x+u,cy:y+u,r:6,fill:'#333'});
  mk(g,'line',{x1:x+u,y1:y+u,x2:x+2*u,y2:y+u,stroke:R,'stroke-width':6});tx(g,x+1.5*u,y+u-16,`${r} 公分`,{fill:R,'font-size':34})},
 two(g,{a,b,la,lb,show}){const k=Math.min(105/a,200/b),A=a*k,Bb=b*k,cy=250;const xa=60+A,xb=xa+A+60+Bb;
  [[xa,A,la],[xb,Bb,lb]].forEach(([cx,r,l],i)=>{mk(g,'circle',{cx,cy,r,fill:i?SH:FILL,stroke:i?O:B,'stroke-width':5});mk(g,'circle',{cx,cy,r:6,fill:'#333'});
    if(show==='d'){mk(g,'line',{x1:cx-r,y1:cy,x2:cx+r,y2:cy,stroke:P,'stroke-width':6})}else mk(g,'line',{x1:cx,y1:cy,x2:cx+r,y2:cy,stroke:R,'stroke-width':6});
    tx(g,cx,cy+r+46,l,{fill:i?O:B,'font-size':34})})},
 insq(g,{S}){const cx=400,cy=255,R0=215;mk(g,'circle',{cx,cy,r:R0,fill:SH,stroke:O,'stroke-width':5});mk(g,'path',{d:`M${cx} ${cy-R0}L${cx+R0} ${cy}L${cx} ${cy+R0}L${cx-R0} ${cy}Z`,fill:FILL,stroke:B,'stroke-width':5});
  tx(g,cx,cy-8,'正方形',{fill:B,'font-size':34});tx(g,cx,cy+40,`面積 ${S}`,{fill:B,'font-size':38})},
 sqin(g,{S}){const s=420,x=190,y=40;mk(g,'rect',{x,y,width:s,height:s,fill:FILL,stroke:B,'stroke-width':5});mk(g,'circle',{cx:x+s/2,cy:y+s/2,r:s/2,fill:SH,stroke:O,'stroke-width':5});
  tx(g,x+s/2,y+s/2+14,'？',{fill:O,'font-size':60});tx(g,x+s/2,y+s+50,`正方形面積 ${S}`,{fill:B,'font-size':36})},
 areaC(g,{A}){const cx=400,cy=250,r=210;mk(g,'circle',{cx,cy,r,fill:FILL,stroke:B,'stroke-width':5});mk(g,'circle',{cx,cy,r:7,fill:'#333'});
  mk(g,'line',{x1:cx,y1:cy,x2:cx+r,y2:cy,stroke:R,'stroke-width':6,'stroke-dasharray':'12 8'});tx(g,cx+r/2,cy-16,'？',{fill:R,'font-size':44});tx(g,cx,cy+90,`面積 ${A}`,{fill:B,'font-size':38})},
 grow(g,{r,k}){const cx=400,cy=255,K=220/(r+k),a=r*K,b=(r+k)*K;mk(g,'circle',{cx,cy,r:b,fill:'none',stroke:O,'stroke-width':6,'stroke-dasharray':'14 8'});mk(g,'circle',{cx,cy,r:a,fill:FILL,stroke:B,'stroke-width':5});mk(g,'circle',{cx,cy,r:6,fill:'#333'});
  mk(g,'line',{x1:cx,y1:cy,x2:cx+a,y2:cy,stroke:R,'stroke-width':6});mk(g,'line',{x1:cx+a,y1:cy,x2:cx+b,y2:cy,stroke:O,'stroke-width':8});
  tx(g,cx+a/2,cy-14,`${r}`,{fill:R,'font-size':34});tx(g,cx+(a+b)/2,cy-14,`+${k}`,{fill:O,'font-size':34})},
 wire(g,{L}){mk(g,'circle',{cx:210,cy:250,r:170,fill:SH,stroke:O,'stroke-width':6});const s=2*Math.PI*170/4;mk(g,'rect',{x:600-s/2,y:250-s/2,width:s,height:s,fill:FILL,stroke:B,'stroke-width':6});
  tx(g,400,60,`鐵絲 ${L} 公分`,{fill:'#555','font-size':38});tx(g,400,262,'或',{fill:'#aaa','font-size':36})},
 lanes(g,{d,w}){const x0=200,x1=480,cy=255,r=120,o=r+46;mk(g,'path',{d:`M${x0} ${cy-o}H${x1}A${o} ${o} 0 0 1 ${x1} ${cy+o}H${x0}A${o} ${o} 0 0 1 ${x0} ${cy-o}Z`,fill:'#ffc9c9',stroke:R,'stroke-width':6});
  mk(g,'path',{d:`M${x0} ${cy-r}H${x1}A${r} ${r} 0 0 1 ${x1} ${cy+r}H${x0}A${r} ${r} 0 0 1 ${x0} ${cy-r}Z`,fill:'#b2f2bb',stroke:B,'stroke-width':6});
  mk(g,'line',{x1:x1,y1:cy-r,x2:x1,y2:cy+r,stroke:P,'stroke-width':5});tx(g,x1-14,cy+12,`${d} 公尺`,{fill:P,'font-size':32,'text-anchor':'end'});
  mk(g,'line',{x1:x1+r,y1:cy,x2:x1+o,y2:cy,stroke:'#333','stroke-width':5});tx(g,x1+o+10,cy+12,`寬 ${w} 公尺`,{fill:'#333','font-size':30,'text-anchor':'start'})},
 rowc(g,{n,d}){const cx=400,cy=250,R0=220,r=R0/n;mk(g,'circle',{cx,cy,r:R0,fill:SH,stroke:O,'stroke-width':5});
  for(let i=0;i<n;i++){mk(g,'circle',{cx:cx-R0+r+2*r*i,cy,r,fill:FILL,stroke:B,'stroke-width':4})}
  mk(g,'line',{x1:cx-R0,y1:cy,x2:cx-R0+2*r,y2:cy,stroke:P,'stroke-width':5});tx(g,cx-R0+r,cy-16,`${d}`,{fill:P,'font-size':32})},
 pizza(g,{D,d}){const K=Math.min(300/D,700/(D+2*d)),A=D/2*K,a=d/2*K;const pz=(cx,cy,r,l)=>{mk(g,'circle',{cx,cy,r,fill:'#ffd43b',stroke:'#e67700','stroke-width':8});for(let i=0;i<5;i++){const t=i*1.3;mk(g,'circle',{cx:cx+r*.5*Math.cos(t),cy:cy+r*.5*Math.sin(t),r:r*.12,fill:'#e03131'})}tx(g,cx,cy+r+44,l,{fill:'#333','font-size':34})};
  const x1=40+A,x2=x1+A+40+a,x3=x2+2*a+18;pz(x1,230,A,`${D} 吋`);pz(x2,230,a,`${d} 吋`);pz(x3,230,a,`${d} 吋`)},
 gears(g,{D,d}){const K=170/(D/2),A=D/2*K,a=d/2*K,x1=230,x2=600,cy=260;mk(g,'path',{d:`M${x1} ${cy-A}L${x2} ${cy-a}M${x1} ${cy+A}L${x2} ${cy+a}`,stroke:'#495057','stroke-width':5});
  [[x1,A,`直徑 ${D} 公分`,O],[x2,a,`直徑 ${d} 公分`,B]].forEach(([x,r,l,c])=>{mk(g,'circle',{cx:x,cy,r,fill:'#f1f3f5',stroke:c,'stroke-width':7});mk(g,'circle',{cx:x,cy,r:8,fill:'#333'});mk(g,'line',{x1:x,y1:cy,x2:x,y2:cy-r+10,stroke:R,'stroke-width':6});tx(g,x,cy+A+50,l,{fill:c,'font-size':32})})},
 wheel(g,{d,n,back}){const cx=230,cy=250,r=150;mk(g,'line',{x1:40,y1:cy+r,x2:780,y2:cy+r,stroke:'#868e96','stroke-width':6});
  mk(g,'circle',{cx,cy,r,fill:'#495057'});mk(g,'circle',{cx,cy,r:r-26,fill:'#dee2e6'});for(let k=0;k<6;k++){const a=k*Math.PI/3;mk(g,'line',{x1:cx,y1:cy,x2:cx+(r-26)*Math.cos(a),y2:cy+(r-26)*Math.sin(a),stroke:'#868e96','stroke-width':6})}
  mk(g,'circle',{cx,cy,r:14,fill:'#495057'});mk(g,'line',{x1:cx-r,y1:cy-r-24,x2:cx+r,y2:cy-r-24,stroke:P,'stroke-width':5});tx(g,cx,cy-r-40,`直徑 ${d} 公分`,{fill:P,'font-size':34});
  mk(g,'path',{d:`M${cx+r+30} ${cy+r-40}H740`,stroke:O,'stroke-width':7,fill:'none'});mk(g,'path',{d:`M740 ${cy+r-40}l-26 -16v32z`,fill:O});
  tx(g,(cx+r+770)/2,cy+r-62,back||`轉 ${n} 圈`,{fill:O,'font-size':36})},
 track(g,{L,d}){const x0=230,x1=570,cy=260,r=150;mk(g,'path',{d:`M${x0} ${cy-r}H${x1}A${r} ${r} 0 0 1 ${x1} ${cy+r}H${x0}A${r} ${r} 0 0 1 ${x0} ${cy-r}Z`,fill:'#b2f2bb',stroke:O,'stroke-width':8});
  mk(g,'line',{x1:x0,y1:cy-r,x2:x0,y2:cy+r,stroke:'#555','stroke-width':3,'stroke-dasharray':'10 8'});mk(g,'line',{x1:x1,y1:cy-r,x2:x1,y2:cy+r,stroke:'#555','stroke-width':3,'stroke-dasharray':'10 8'});
  tx(g,(x0+x1)/2,cy-r-20,`${L} 公尺`,{fill:'#333','font-size':36});mk(g,'line',{x1:x1,y1:cy-r,x2:x1,y2:cy+r,stroke:P,'stroke-width':6});tx(g,x1-16,cy+12,`${d} 公尺`,{fill:P,'font-size':34,'text-anchor':'end'})}
};

/* ---------- 題型 ---------- */

 m_pizza(){const [D,d]=pick([[12,8],[10,6],[14,10],[16,10],[18,12]]),A=D*D/4*3.14,B2=d*d/4*3.14*2,a=Math.abs(A-B2);return {text:`1 個 ${D} 吋大披薩，和 2 個 ${d} 吋小披薩（吋數是直徑）。面積比較大的一邊多幾平方吋？`,fig:['pizza',{D,d}],ans:a,unit:'平方吋',
   hints:['大披薩 ＝ 半徑 × 半徑 × 3.14','小披薩要算 2 個','大的減小的'],sol:[`大 ${D/2} × ${D/2} × ${PI} ＝ ${f(A)}`,`小 ${d/2} × ${d/2} × ${PI} × 2 ＝ ${f(B2)}`,`${A>B2?'大披薩':'2 個小披薩'}比較大，多 ${f(a)}`],traps:[[Math.abs(A-B2/2),'小披薩有 2 個'],[Math.abs(D*D*3.14-d*d*3.14*2),'吋數是直徑，要先 ÷ 2 變半徑']]}},
 m_gears(){const [D,d]=pick([[40,20],[60,20],[60,30],[80,20],[90,30],[80,40]]),a=D/d;return {text:`大輪直徑 ${D} 公分，小輪直徑 ${d} 公分，用皮帶連在一起。大輪轉 1 圈，小輪轉幾圈？`,fig:['gears',{D,d}],ans:a,unit:'圈',pre:'',
   hints:['皮帶走的長度一樣','大輪 1 圈 ＝ 大輪的圓周長','小輪要轉幾個自己的圓周長？'],sol:[`大輪 1 圈 ${D} × ${PI} ＝ ${f(D*3.14)}`,`小輪 1 圈 ${d} × ${PI} ＝ ${f(d*3.14)}`,`${f(D*3.14)} ÷ ${f(d*3.14)} ＝ ${a}`],traps:[[d/D,'小輪比較小，轉的圈數比較多']]}},
};
const LV=[
 {name:'基礎',stars:'⭐',cls:'l1',types:['b_dC','b_rC','b_rA','b_dA','b_Cd']},
 {name:'進階',stars:'⭐⭐',cls:'l2',types:['a_Cr','a_CA','a_double','a_card','a_wheel']},
 {name:'挑戰',stars:'⭐⭐⭐',cls:'l3',types:['c_sqc','c_cirsq','c_rect2','c_ring','c_ratio','c_turns','c_trackP','c_trackA']},
 {name:'魔王',stars:'👑',cls:'l4',types:['m_insq','m_sqin','m_Ar','m_AC','m_grow','m_wire','m_lanes','m_rowc','m_pizza','m_gears']}];
const N=10;

/* ---------- 狀態 ---------- */
let lvl=0,round=null,cur=0,val='',tries=0,solved=false,hintK=0;
let best=[0,0,0,0];try{const b=JSON.parse(localStorage.getItem('pr4_best'));if(b)b.forEach((v,i)=>best[i]=v)}catch(e){}
function newRound(){const ty=LV[lvl].types;let list=[];while(list.length<N){const s=[...ty].sort(()=>Math.random()-.5);list.push(...s)}list=list.slice(0,N).sort(()=>Math.random()-.5);
  /* 避免同題型連續 */
  for(let i=1;i<list.length;i++)if(list[i]===list[i-1]){const j=list.findIndex((t,k)=>k>i&&t!==list[i]&&t!==list[i-1]);if(j>0)[list[i],list[j]]=[list[j],list[i]]}
  round={qs:list.map(t=>T[t]()),res:Array(N).fill(null)};cur=0;show()}

/* ---------- 畫面 ---------- */
const nav=$('#nav');
LV.forEach((L,i)=>{const d=document.createElement('div');d.className='lv '+L.cls;d.dataset.i=i;d.innerHTML=`<div class="n">${L.name}</div><div class="s">${L.stars}</div><div class="bar"><i></i></div><div class="c"></div>`;
  d.addEventListener('pointerdown',e=>{e.preventDefault();lvl=i;newRound()});nav.appendChild(d)});
nav.appendChild(Object.assign(document.createElement('div'),{className:'sp'}));
const fsb=Object.assign(document.createElement('button'),{id:'fs',textContent:'⛶ 全螢幕'});fsb.addEventListener('pointerdown',e=>{e.preventDefault();document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})});nav.appendChild(fsb);
function paintNav(){document.querySelectorAll('.lv').forEach((d,i)=>{d.classList.toggle('on',i===lvl);const done=i===lvl&&round?round.res.filter(x=>x).length:0;
  d.querySelector('.bar i').style.width=(i===lvl&&round?done/N*100:0)+'%';d.querySelector('.c').textContent=(i===lvl&&round?`${done} / ${N}`:'')+(best[i]?`　最佳 ${best[i]}`:'')})}
function paintDots(){const D=$('#dots');D.innerHTML='';round.res.forEach((r,i)=>{const e=document.createElement('i');if(r==='ok')e.className='ok';else if(r==='ok2')e.className='ok2';else if(r==='no')e.className='no';if(i===cur)e.classList.add('cur');D.appendChild(e)})}
const pad=$('#pad');['7','8','9','⌫','4','5','6','C','1','2','3','.','0','檢查'].forEach(k=>{const b=document.createElement('button');b.textContent=k;if(k==='⌫'||k==='C')b.className='del';if(k==='檢查')b.className='ck';
  b.addEventListener('pointerdown',e=>{e.preventDefault();key(k)});pad.appendChild(b)});
function key(k){if(solved)return;if(k==='檢查')return check();if(k==='⌫')val=val.slice(0,-1);else if(k==='C')val='';else if(k==='.'){if(!val.includes('.')&&val.length<9)val+=val?'.':'0.'}else if(val.length<9)val=(val==='0'?'':val)+k;
  $('#box').textContent=val;$('#box').className=''}
document.addEventListener('keydown',e=>{if($('#end').classList.contains('on'))return;if(/^[0-9.]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter'){solved?nextQ():key('檢查')}});
function show(){const q=round.qs[cur];val='';tries=0;solved=false;hintK=0;
  $('#qno').textContent=`第 ${cur+1} 題`;$('#q').innerHTML=q.text.replace(/(\d+(?:\.\d+)?)/g,'<span class="num">$1</span>');
  const svg=$('#fig');svg.innerHTML='';F[q.fig[0]](svg,q.fig[1]);
  $('#steps').innerHTML='';$('#box').textContent='';$('#box').className='';$('#unit').textContent=q.unit;$('#pre').textContent=q.pre!=null?q.pre:'約';
  $('#fb').textContent='';$('#fb').className='';$('#next').disabled=true;$('#hint').disabled=false;$('#hint').classList.remove('pulse');$('#show').classList.add('hide');
  paintDots();paintNav()}
function addStep(s,cls){const d=document.createElement('div');d.className=cls;d.textContent=s;$('#steps').appendChild(d)}
$('#hint').addEventListener('pointerdown',e=>{e.preventDefault();const q=round.qs[cur];if(solved||hintK>=q.hints.length)return;addStep('💡 '+q.hints[hintK++],'h');$('#hint').classList.remove('pulse');if(hintK>=q.hints.length)$('#hint').disabled=true});
$('#show').addEventListener('pointerdown',e=>{e.preventDefault();if(solved)return;const q=round.qs[cur];round.res[cur]='no';finish(q,false)});
$('#next').addEventListener('pointerdown',e=>{e.preventDefault();nextQ()});
function check(){const q=round.qs[cur];if(val===''||val==='.')return;const v=+val,box=$('#box'),fb=$('#fb');
  if(Math.abs(v-q.ans)<1e-6){round.res[cur]=tries===0?'ok':'ok2';box.className='ok';fb.className='good';fb.textContent=tries===0?'答對了！':'答對了！再接再厲';finish(q,true);return}
  tries++;box.className='';void box.offsetWidth;box.className='no';fb.className='bad';
  const tr=q.traps.find(([t])=>t>=0&&Math.abs(v-t)<1e-6);fb.textContent=tr?tr[1]:(tries===1?'再算一次看看':'看看提示吧');
  if(tries>=1)$('#hint').classList.add('pulse');if(tries>=2)$('#show').classList.remove('hide')}
function finish(q,ok){solved=true;$('#hint').disabled=true;$('#hint').classList.remove('pulse');$('#show').classList.add('hide');
  [...$('#steps').querySelectorAll('.h')].forEach(e=>e.remove());q.sol.forEach(s=>addStep(s,'sol'));
  if(!ok){$('#box').textContent=f(q.ans);$('#box').className='ok';$('#fb').className='bad';$('#fb').textContent='正確答案在這裡，看懂算式再下一題'}
  $('#next').disabled=false;$('#next').textContent=cur===N-1?'看結果 ▶':'下一題 ▶';paintDots();paintNav()}
function nextQ(){if(!solved)return;if(cur<N-1){cur++;show()}else end()}
function end(){const r=round.res,first=r.filter(x=>x==='ok').length,all=r.filter(x=>x==='ok'||x==='ok2').length;
  if(first>best[lvl]){best[lvl]=first;try{localStorage.setItem('pr4_best',JSON.stringify(best))}catch(e){}}
  $('#endt').textContent=`${LV[lvl].name}完成！`;$('#ends').textContent=first>=9?'⭐⭐⭐':first>=7?'⭐⭐':first>=5?'⭐':'💪';
  $('#endn').textContent=`${first} / ${N}`;$('#endsub').textContent=`一次就答對 ${first} 題，全部答對 ${all} 題`;
  const B=$('#endb');B.innerHTML='';const mb=(t,f,c)=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.addEventListener('pointerdown',e=>{e.preventDefault();$('#end').classList.remove('on');f()});B.appendChild(b)};
  mb('再練一回',()=>newRound());if(lvl<3)mb(`挑戰${LV[lvl+1].name} ▶`,()=>{lvl++;newRound()},'go');
  $('#end').classList.add('on');paintNav()}
newRound();
</script>
</body></html>
