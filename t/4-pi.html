<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>圓周率的故事 割圓術</title>
<style>
:root{--bg:#FFF8EE;--g:#22b573;--gd:#138a52;--gl:#e3f6ea;--o:#FF9F43;--od:#d9822e;--p:#7048e8;--pl:#f3f0ff;--b:#1c7ed6;--bl:#e7f5ff;--boy:#1c7ed6;--boyl:#d0ebff;--girl:#d6336c;--girll:#ffdeeb;--ink:#333}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:clamp(12px,min(1.25vw,2.15vh),30px)}
body{margin:0;height:100vh;height:100dvh;display:grid;grid-template-columns:6.4rem 1fr;background:var(--bg);color:var(--ink);
  font-family:'PingFang TC','Heiti TC','Microsoft JhengHei',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.kai{font-family:'BiauKai','Kaiti TC','STKaiti','DFKai-SB','標楷體',serif}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bad{animation:shake .4s}
/* 左側目錄 */
aside{background:#fff;border-right:3px solid #f1e4cf;display:flex;flex-direction:column;padding:.4rem .3rem;gap:.12rem;overflow-y:auto}
.unit{text-align:center;padding-bottom:0}
.unit b{display:inline-block;font-size:.9rem;color:#fff;background:var(--g);border-radius:12px;padding:.2rem .5rem}
.grp{font-size:.85rem;font-weight:900;text-align:center;margin-top:.15rem;border-top:3px dotted #e9dcc6;padding-top:.15rem}
.grp.a{color:var(--b)}.grp.b{color:var(--gd)}.grp.c{color:#d9480f}
.nav{display:flex;flex-direction:column;align-items:center;gap:0;border:3px solid transparent;background:transparent;border-radius:14px;padding:.08rem .1rem;font-size:.85rem;line-height:1.1;color:#555;font-weight:800;white-space:nowrap}
.nav .ic{flex:none;width:1.45rem;height:1.45rem;border-radius:50%;background:#f1f3f5;display:grid;place-items:center;font-size:1.1rem}
.nav.on{border-color:var(--g);background:var(--gl);color:#1f3d2b}
.nav.on .ic{background:var(--g)}
.fs{margin-top:auto;flex:none;border:0;background:#f3f3f3;border-radius:12px;font-size:1.1rem;padding:.2rem;color:#666}
/* 主畫面 */
main{display:flex;flex-direction:column;padding:.55rem .9rem .8rem;gap:.55rem;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:.6rem}
.banner{display:flex;align-items:stretch;flex:1;min-width:0}
.banner b{background:var(--g);color:#fff;font-size:1.6rem;font-weight:900;padding:.2rem 1.4rem .2rem .9rem;border-radius:14px 0 0 14px;clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%);white-space:nowrap}
.banner span{flex:1;margin-left:-.6rem;padding:.2rem 1.4rem;font-size:1.5rem;font-weight:900;color:#1f3d2b;background:linear-gradient(90deg,#c9eed6,#eaf8ef 70%,rgba(234,248,239,0));display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.reset{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 0 #eadbc4;font-size:1.6rem;color:#777}
/* 抽籤列 */
.who{flex:none;display:flex;align-items:center;gap:.4rem;border:0;background:#fff;border-radius:999px;padding:.15rem .9rem .15rem .2rem;box-shadow:0 3px 0 #eadbc4;font-size:1.3rem;font-weight:900;color:#555}
.who .wb{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.45rem;background:radial-gradient(circle at 35% 30%,#ffe8a3,#fcc419 60%,#e67700)}
.who .wb.boy{background:radial-gradient(circle at 35% 30%,#a5d8ff,#339af0 60%,#1864ab)}
.who .wb.girl{background:radial-gradient(circle at 35% 30%,#ffc9de,#f06595 60%,#a61e4d)}
.hbtn{flex:none;border:0;border-radius:999px;font-size:1.3rem;font-weight:900;padding:.4rem .9rem;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gd)}
.hbtn.m{background:#e9ecef;color:#666;box-shadow:0 4px 0 #ced4da;padding:.4rem .6rem}
.hbtn.t{background:#fff;color:#c45f00;box-shadow:0 3px 0 #eadbc4}
.hbtn:disabled{opacity:.35;pointer-events:none}
.hbtn:active{transform:translateY(2px)}
.plusfx{position:fixed;z-index:60;font-size:3rem;font-weight:900;color:#f08c00;pointer-events:none;animation:up 1s forwards;text-shadow:0 3px 0 #fff}
@keyframes up{to{transform:translateY(-3rem);opacity:0}}
/* 抽籤動畫 */
#drawov{position:fixed;inset:0;z-index:70;background:rgba(255,248,238,.82);display:grid;place-items:center;transition:opacity .35s}
#drawov.out{opacity:0}
#drawov .bb{width:min(42vh,26rem);height:min(42vh,26rem);border-radius:50%;display:grid;place-items:center;font-size:min(20vh,12rem);font-weight:900;color:#fff;background:radial-gradient(circle at 35% 30%,#ffe8a3,#fcc419 60%,#e67700);box-shadow:inset -18px -24px 0 rgba(0,0,0,.12),0 14px 0 #f0dfc6}
#drawov .bb.boy{background:radial-gradient(circle at 35% 30%,#a5d8ff,#339af0 60%,#1864ab)}
#drawov .bb.girl{background:radial-gradient(circle at 35% 30%,#ffc9de,#f06595 60%,#a61e4d)}
#drawov .bb.roll{animation:wob .12s infinite}
#drawov .bb.land{animation:pop .5s}
@keyframes wob{50%{transform:rotate(8deg) scale(1.04)}}
/* 加分板 */
#board{position:fixed;inset:0;z-index:65;background:rgba(40,30,10,.35);display:flex;align-items:center;justify-content:center}
#board .bd{width:min(94vw,64rem);max-height:94vh;background:#fff;border-radius:28px;padding:1.2rem 1.4rem;display:flex;flex-direction:column;gap:.8rem;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#board .bh{display:flex;align-items:center;gap:.6rem;font-size:1.8rem;font-weight:900;color:var(--gd)}
#board .bh .sp{flex:1}
#board .bh button{border:0;border-radius:12px;font-size:1.15rem;font-weight:900;padding:.35rem .8rem;background:#f1f3f5;color:#555}
#board .bh button.on{background:#ffe3e3;color:#c92a2a}
#board .bh .left{font-size:1.1rem;color:#888}
.btiles{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem}
.bt{border-radius:16px;padding:.35rem 0;display:flex;flex-direction:column;align-items:center;border:4px solid transparent;cursor:pointer}
.bt .n{font-size:2.1rem;font-weight:900;line-height:1.1}
.bt .s{font-size:1.15rem;font-weight:900;min-height:1.5rem}
.bt.b{background:var(--boyl);color:var(--boy)}.bt.g{background:var(--girll);color:var(--girl)}
.bt.used{opacity:.5}.bt.cur{border-color:var(--o);opacity:1}
.bt.off{background:#f1f3f5;color:#adb5bd;opacity:1;text-decoration:line-through}
.bt.top1{box-shadow:0 0 0 3px #fcc419}
.confirm{color:#c92a2a!important;background:#ffe3e3!important}

.page{flex:1;min-height:0;display:flex;flex-direction:column;gap:.7rem}
.card{background:#fff;border-radius:24px;box-shadow:0 4px 0 #f0dfc6,0 8px 24px rgba(160,120,60,.08);min-height:0;min-width:0}
.big-btn{border:0;background:var(--o);color:#fff;border-radius:18px;font-size:1.5rem;font-weight:900;padding:.45rem 1.2rem;box-shadow:0 5px 0 var(--od)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--od)}
.big-btn.g{background:var(--g);box-shadow:0 5px 0 var(--gd)}
.big-btn.p{background:var(--p);box-shadow:0 5px 0 #5235c0}
.big-btn.gray{background:#e9ecef;color:#666;box-shadow:0 5px 0 #ced4da}
.big-btn:disabled{opacity:.35;pointer-events:none}
.qtop{display:flex;align-items:center;gap:.7rem}
.qno{font-size:1.7rem;font-weight:900;color:#5c3a1e}
.qsec{font-size:1.2rem;font-weight:900;background:var(--gl);color:var(--gd);border-radius:999px;padding:.15rem .8rem}
.qtop .sp{flex:1}
.qgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.15fr;gap:.9rem}
.figc{display:flex;align-items:center;justify-content:center;padding:.6rem}
.fig{width:100%;height:100%;max-height:100%}
.qc{display:flex;flex-direction:column;gap:.7rem;padding:1rem 1.3rem;overflow:hidden}
.qc>*{flex-shrink:0}
.qq{font-size:2.7rem;font-weight:700;line-height:1.45;color:#1d3557}
.qarea{display:flex;flex-direction:column;gap:.6rem}
.disp{display:flex;align-items:center;gap:.6rem;border:4px solid #d0bfff;border-radius:18px;background:#f8f7ff;padding:.2rem 1rem;min-height:4.4rem}
.disp .v{flex:1;font-size:3.2rem;font-weight:900;color:#3b2a7a;text-align:right;font-family:Arial,sans-serif;letter-spacing:.02em}
.disp .u{font-size:1.8rem;font-weight:900;color:#888}
.disp.ok{border-color:#37b24d;background:#ebfbee}.disp.no{border-color:#fa5252;background:#fff5f5}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem}
.pk{border:0;border-radius:14px;background:#f1f3f5;font-size:2.2rem;font-weight:900;padding:.25rem 0;color:#333;box-shadow:0 4px 0 #dee2e6;font-family:Arial,sans-serif}
.pk.fn{background:#ffe3e3;color:#c92a2a}.pk.z{grid-column:span 2}
.pk:active{transform:translateY(2px);box-shadow:0 2px 0 #dee2e6}
.qarea.done .pad{display:none}
.opts{display:flex;flex-direction:column;gap:.55rem}
.opt{border:4px solid #e9dcc6;background:#fffaf0;border-radius:18px;font-size:2.3rem;padding:.3rem .8rem;color:#333;box-shadow:0 4px 0 #e9dcc6;text-align:left}
.opt.sel{border-color:var(--o);background:#fff3e3}
.opt.ok{border-color:#37b24d;background:#d3f9d8;color:#2b8a3e}.opt.no{border-color:#fa5252;background:#ffe3e3;color:#c92a2a}
.qbtns{display:flex;gap:.7rem;flex-wrap:wrap}
.res{font-size:2rem;font-weight:900;min-height:0}
.res.ok{color:#2b8a3e;animation:pop .35s}.res.no{color:#c92a2a}.res b{font-size:1.2em}
.qsteps{display:none;flex-direction:column;gap:.4rem;background:#fff9db;border-radius:18px;padding:.6rem 1rem;border:3px dashed #fcc419}
.qsteps.on{display:flex}
.st{font-size:2.6rem;font-weight:700;line-height:1.35;color:#5c3a1e;animation:fade .35s}
.st.eq{white-space:nowrap}

/* 古人 */
.tl{display:grid;grid-template-columns:repeat(6,1fr);gap:.7rem}
.hc{background:#fff;border-radius:22px;box-shadow:0 4px 0 #f0dfc6;padding:.6rem .4rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;cursor:pointer;border:4px solid transparent;text-align:center}
.hc .ic{font-size:2.8rem;line-height:1.1}
.hc .who{font-size:min(1.9rem,1.7vw);font-weight:900;color:#5c3a1e;line-height:1.2;white-space:nowrap}
.hc .when{font-size:min(1.05rem,.95vw);white-space:nowrap;font-weight:800;color:#999}
.hc .val{font-size:2.1rem;font-weight:900;color:transparent;background:#f1f3f5;border-radius:12px;padding:0 .4rem;min-width:70%;line-height:1.35;font-family:Arial,sans-serif;white-space:nowrap}
.hc .how{font-size:min(1.35rem,1.2vw);white-space:nowrap;font-weight:800;color:transparent}
.hc.open{border-color:#8ce99a}.hc.open .val{color:#1c7ed6;background:#e7f5ff;animation:pop .35s}.hc.open .how{color:#2b8a3e}
.hc .val{font-size:min(2.1rem,1.9vw)}
.nl{flex:1;display:flex;flex-direction:column;padding:.6rem 1rem;min-height:0}
.nlbar{display:flex;align-items:center;gap:.8rem}
.nlhint{font-size:1.3rem;font-weight:800;color:#999}
.nlbar .pill{font-size:1.5rem;padding:.3rem 1.1rem;border-color:var(--o);color:#c45f00;background:#fff3e3}
.nlbox{flex:1;min-height:0;display:flex}
.nlsvg{width:100%;height:100%}
.popin{animation:pop .45s;transform-box:fill-box;transform-origin:center}
/* 割圓術 */
.cutg{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.05fr;gap:.9rem}
.cutL{position:relative;display:flex;align-items:center;justify-content:center;padding:.6rem;overflow:hidden}
.cmain{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.csvg{height:100%;max-width:100%}
.popin2{animation:fadeIn .4s}@keyframes fadeIn{from{opacity:.2}to{opacity:1}}
.czoom{position:absolute;right:.6rem;bottom:.6rem;width:34%;aspect-ratio:1/.62;background:#fff;border:4px solid #e03131;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.zlab{position:absolute;left:.3rem;top:.15rem;z-index:1;font-size:1.1rem;font-weight:900;color:#e03131;background:rgba(255,255,255,.85);border-radius:8px;padding:0 .3rem}
.zin,.zsvg{width:100%;height:100%;display:block}
.cutR{display:flex;flex-direction:column;gap:.6rem;padding:.9rem 1.2rem;overflow:hidden}
.cutR>*{flex-shrink:0}
.ctop{display:flex;gap:.5rem;flex-wrap:wrap}
.pill.on{border-color:var(--o);background:#fff3e3;color:#c45f00}
.cbig{display:flex;flex-direction:column;align-items:center;gap:.2rem;background:#f8f9fa;border-radius:20px;padding:.5rem}
.cn{display:flex;align-items:baseline;gap:.4rem;color:#5c3a1e}.cn b{font-size:3.6rem;color:#1864ab;font-family:Arial,sans-serif}.cn .lab{font-size:1.8rem;font-weight:900}
.cv{font-size:3.4rem;font-family:Arial,sans-serif;letter-spacing:.03em}
.cv b,.crow .v b{font-weight:900;color:#adb5bd}.cv b.ok,.crow .v b.ok{color:#2b8a3e}
.cmk{font-size:1.5rem;font-weight:900;color:#fff;background:#e8590c;border-radius:999px;padding:.1rem .9rem;animation:pop .35s}
.ctab{display:flex;flex-direction:column;gap:.25rem}
.crow{display:flex;align-items:center;gap:.8rem;font-size:1.7rem;padding:.1rem .5rem;border-radius:10px}
.crow.cur{background:#fff3bf}
.crow .n{width:6.5em;font-weight:900;color:#5c3a1e;font-size:.85em}
.crow .v{font-family:Arial,sans-serif}
.crow .m{margin-left:auto;font-size:.65em;font-weight:900;color:#e8590c;border:2px solid #ffc078;border-radius:999px;padding:0 .5rem;white-space:nowrap}
.cbtns{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:auto}
.gbig{font-size:2rem!important;padding:.5rem 1.6rem!important}
.qov{position:fixed;inset:0;z-index:70;background:rgba(40,25,10,.55);display:flex;align-items:center;justify-content:center}
.qcard{width:min(90vw,58rem);background:linear-gradient(#fffaf0,#fff3d6);border:.5rem solid #8d5a2b;border-radius:24px;padding:2rem 2.4rem;font-size:3.6rem;line-height:1.6;color:#3b2314;text-align:center;animation:pop .35s}
.qsrc{font-size:1.8rem;color:#8d5a2b;text-align:right;margin-top:.6rem}
.qplain{font-size:2.1rem;color:#2b8a3e;margin-top:1rem;line-height:1.5}
/* 祖沖之 */
.zuw{flex:1;min-height:0;display:flex;flex-direction:column;gap:.8rem}
.zuh{display:flex;align-items:center;gap:1.2rem;padding:.8rem 1.4rem;flex-wrap:wrap}
.zuL{display:flex;align-items:center;gap:.7rem;font-size:1.6rem;font-weight:900;color:#8a6a4a}
.tag{background:#e8590c;color:#fff;border-radius:12px;padding:.1rem .7rem;font-size:1.6rem;font-weight:900}
.zurange{font-size:3rem;font-weight:900;color:#5c3a1e;font-family:Arial,sans-serif}
.zurow{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
.zuc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;padding:.8rem}
.zuc>*{flex-shrink:0}
.zunm{display:flex;align-items:center;gap:.6rem}.zunm .who{font-size:1.5rem;font-weight:900;color:#888}
.frac{display:flex;flex-direction:column;align-items:center;font-family:Arial,sans-serif;font-weight:900;font-size:4.4rem;line-height:1.1;color:#1864ab}
.frac .bar{width:1.8em;height:.09em;background:#1864ab;margin:.12em 0}
.zuout{font-size:2.6rem;font-family:Arial,sans-serif;min-height:3.4rem;color:#ccc;letter-spacing:.02em}
.zuout b{font-weight:900;color:#adb5bd}.zuout b.ok{color:#2b8a3e}
.zucnt{font-size:1.6rem;font-weight:900;color:#2b8a3e;min-height:2.2rem}.zucnt b{font-size:1.4em}
.zupi{display:flex;align-items:center;justify-content:center;gap:1rem;padding:.7rem}
.zupi .lab{font-size:1.6rem;font-weight:900;color:#e03131}.zupi .pv{font-size:2.8rem;font-family:Arial,sans-serif}.zupi .pv b{color:#2b8a3e;font-weight:900}
/* 考考你 */
.qc{flex:1;display:flex;flex-direction:column;gap:.8rem;padding:1rem 1.6rem;overflow:hidden}
.qc>*{flex-shrink:0}
.why{font-size:.8em;color:#5c3a1e;margin-top:.3rem;font-weight:700}

/* 怎麼算 */
.howg{flex:1;min-height:0;display:grid;grid-template-columns:.95fr 1.1fr;gap:.9rem}
.howL{display:flex;align-items:center;justify-content:center;padding:.5rem;overflow:hidden}
.hsvg{width:100%;height:100%}
.howR{display:flex;flex-direction:column;gap:.8rem;padding:1rem 1.4rem;overflow:hidden}
.howR>*{flex-shrink:0}
.hdots{display:flex;gap:.4rem;flex-wrap:wrap}
.hd{width:2.6rem;height:2.6rem;border-radius:50%;border:3px solid #e9dcc6;background:#fff;font-size:1.2rem;font-weight:900;color:#aaa}
.hd.past{background:#d3f9d8;border-color:#8ce99a;color:#2b8a3e}.hd.on{background:var(--o);border-color:var(--o);color:#fff}
.htitle{font-size:3rem;font-weight:900;color:#5c3a1e;line-height:1.3;display:flex;align-items:center;gap:.7rem}
.htitle .no{flex:none;width:1.4em;height:1.4em;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:.7em}
.hbody{display:flex;flex-direction:column;gap:.6rem}
.hl{font-size:2.6rem;font-weight:800;line-height:1.4;color:#333;animation:fade .45s both}
.hl b{font-family:inherit}.hl .g{color:#2b8a3e}.hl .b{color:#e8590c}.hl .r{color:#e03131}
.htab{display:flex;flex-direction:column;gap:.2rem;font-size:2.4rem}
.hr{display:grid;grid-template-columns:.9fr 1.1fr 1.3fr 1.5fr;gap:.4rem;padding:.2rem .5rem;border-radius:10px;font-family:Arial,sans-serif;font-weight:800}
.hr.hh{font-size:.75em;color:#8a6a4a;background:#fff3bf;font-family:inherit}
.hr:not(.hh):nth-child(odd){background:#f8f9fa}
.hr b{color:#adb5bd}.hr b.ok{color:#2b8a3e}
.hnote{font-size:1.5rem;font-weight:800;color:#8a6a4a}
.hnav{display:flex;gap:.8rem;margin-top:auto}
.grow{animation:grow .35s both;transform-box:fill-box;transform-origin:left center}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</head>
<body>
<aside id="nav"></aside>
<main>
  <header>
    <div class="banner"><b id="ptitle">古人的圓周率</b><span id="psub">圓周率的故事</span></div>
    <button class="who" id="who" title="抽籤"><span class="wb" id="wb">🎲</span><span id="wt">抽籤</span></button>
    <button class="hbtn" id="plus">⭕ +1</button>
    <button class="hbtn m" id="minus">−1</button>
    <button class="hbtn t" id="boardBtn">🏆</button>
    <button class="reset" id="reset" title="重來">↺</button>
  </header>
  <div class="page" id="page"></div>
</main>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
function E(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
function tap(e,f){e.addEventListener('pointerdown',ev=>{if(ev.button>0)return;ev.preventDefault();f(ev)})}
function shake(e){e.classList.remove('bad');void e.offsetWidth;e.classList.add('bad')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick1=a=>a[Math.floor(Math.random()*a.length)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const REM=()=>parseFloat(getComputedStyle(document.documentElement).fontSize);
function over(box){const cs=getComputedStyle(box);const kids=[...box.children].filter(k=>getComputedStyle(k).position!=='absolute');
  const h=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)+kids.reduce((t,k)=>t+k.getBoundingClientRect().height,0)+(parseFloat(cs.rowGap)||0)*Math.max(0,kids.length-1);
  return h>box.clientHeight+1||box.scrollHeight>box.clientHeight+1}
function overSelf(el){return el.scrollHeight>el.clientHeight+1}
/* 等比例縮小 els,直到 boxes 都放得下(最小 minRem) */
function fit(els,boxes,minRem,test){els=els.filter(Boolean);if(!els.length)return;els.forEach(e=>e.style.fontSize='');const rem=REM();
  const base=els.map(e=>parseFloat(getComputedStyle(e).fontSize));let k=1;test=test||over;boxes=boxes.filter(Boolean);
  while(boxes.some(test)&&Math.min(...base)*k>minRem*rem){k*=.95;els.forEach((e,i)=>e.style.fontSize=base[i]*k+'px')}}

  [['p','周長 ÷ 直徑'],['a','面積 ÷ (半徑×半徑)']].forEach(([k,t])=>{const b=E('button','pill'+(cutMode===k?' on':''),t,top);b.dataset.m=k;tap(b,()=>{cutMode=k;top.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));paint()})});
  const big=E('div','cbig',null,R);
  const tb=E('div','ctab',null,R);
  const bt=E('div','cbtns',null,R);const cut=E('button','big-btn gbig','✂️ 再割一次',bt);const rs=E('button','big-btn gray','↺ 六邊形',bt);const qb=E('button','big-btn p','📜 劉徽說',bt);
  tap(cut,()=>{if(cutN>=24576)return;cutN*=2;cutRows.push(cutN);paint(true)});

  tap(qb,()=>{const ov=E('div','qov',null,document.body);const c=E('div','qcard kai','割之彌細，所失彌少；<br>割之又割，以至於不可割，<br>則與圓周合體而無所失矣。',ov);
    E('div','qsrc','—— 劉徽《九章算術注》',c);E('div','qplain','切得越細，少掉的就越少；一直切下去，就和圓完全一樣了。',c);tap(ov,()=>ov.remove())});
  function paint(anim){
    /* 大圓 */
    main.innerHTML='';const s=sv('svg',{viewBox:'0 0 500 500',class:'csvg'},main);const cx=250,cy=250,r=220;
    sv('circle',{cx,cy,r,fill:'#ffa94d',stroke:'none'},s);
    sv('path',{d:polyD(cutN,cx,cy,r),fill:'#a5d8ff',stroke:cutN<=96?'#1864ab':'none','stroke-width':cutN<=24?3:1.5},s);
    sv('circle',{cx,cy,r,fill:'none',stroke:'#333','stroke-width':3},s);
    if(cutN<=24){for(let k=0;k<cutN;k++){const a=-Math.PI/2+Math.PI/cutN+k*2*Math.PI/cutN;sv('line',{x1:cx,y1:cy,x2:cx+r*Math.cos(a),y2:cy+r*Math.sin(a),stroke:'#1864ab','stroke-width':1.5,opacity:.5},s)}}
    sv('circle',{cx,cy,r:5,fill:'#222'},s);
    const zw=2*r*Math.sin(Math.PI/cutN)*2.4,zh=zw*.62;zoomBox.style.display=cutN>=24?'':'none';if(cutN>=24)sv('rect',{x:cx-zw/2,y:cy-r-zh*.35,width:zw,height:zh,fill:'none',stroke:'#e03131','stroke-width':Math.max(.8,zw/60)},s);
    /* 放大框 */
    zl.textContent=`🔍 放大 ${Math.round(500/zw).toLocaleString()} 倍`;
    zin.innerHTML='';const z=sv('svg',{viewBox:`${cx-zw/2} ${cy-r-zh*.35} ${zw} ${zh}`,class:'zsvg',preserveAspectRatio:'xMidYMid slice'},zin);
    sv('circle',{cx,cy,r,fill:'#ffa94d'},z);sv('path',{d:polyD(cutN,cx,cy,r),fill:'#a5d8ff',stroke:'#1864ab','stroke-width':zw/120},z);sv('circle',{cx,cy,r,fill:'none',stroke:'#333','stroke-width':zw/100},z);
    /* 數字 */
    const v=ratio(cutN);const str=v.toFixed(8);
    big.innerHTML=`<div class="cn"><span class="lab">正</span><b>${cutN}</b><span class="lab">邊形</span></div><div class="cv">${digits(str)}</div>`+(mk(cutN)?`<div class="cmk">${mk(cutN)}</div>`:'');
    tb.innerHTML='';cutRows.slice(-6).forEach(n=>{const vv=ratio(n).toFixed(8);E('div','crow'+(n===cutN?' cur':''),`<span class="n">${n} 邊</span><span class="v">${digits(vv)}</span>${mk(n)?`<span class="m">${mk(n)}</span>`:''}`,tb)});
    cut.disabled=cutN>=24576;requestAnimationFrame(()=>fit([...R.querySelectorAll('.cv,.crow')],[R],1.2))}
  paint();window.onresize=()=>paint()}

 ['正多邊形的邊數越多，會越像什麼？',['圓','正方形','三角形'],'割之又割，就和圓周合體'],

 ['祖沖之把圓周率算到小數點後第幾位？',['第 7 位','第 2 位','第 4 位'],'3.1415926 ＜ 圓周率 ＜ 3.1415927'],
 ['祖沖之的「密率」是哪一個？',['355／113','22／7','157／50'],'355 ÷ 113 ＝ 3.14159292…，前 6 位小數都對'],
