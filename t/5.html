<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>比和比值 自學</title>
<style>
:root{--bg:#FFF8EE;--g:#22b573;--gd:#138a52;--gl:#e3f6ea;--o:#FF9F43;--C:#e8384f;--D:#1c7ed6;--R:#f08c00;--ink:#333}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:clamp(12px,min(1.12vw,1.9vh),24px)}
body{margin:0;height:100vh;height:100dvh;display:grid;grid-template-columns:13.5rem 1fr;background:var(--bg);color:var(--ink);
  font-family:'PingFang TC','Heiti TC','Microsoft JhengHei',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* ---------- 左側目錄 ---------- */
aside{background:#fff;border-right:3px solid #f1e4cf;display:flex;flex-direction:column;padding:.9rem .7rem;gap:.5rem;min-height:0;overflow:auto}
.unit{font-size:1.05rem;color:#888;line-height:1.2;padding:0 .3rem}
.unit b{display:block;font-size:1.45rem;color:var(--gd)}
.grp{display:flex;flex-direction:column;gap:.25rem}
.grp h4{margin:.35rem 0 .1rem;font-size:.95rem;background:var(--g);color:#fff;border-radius:999px;padding:.3rem .7rem;font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:.25rem;cursor:pointer}
.grp:not(.open) h4{background:#9fd9b9}
.grp h4 .ar{display:inline-block;transition:transform .2s;font-size:.8rem}.grp.open h4 .ar{transform:rotate(90deg)}
.grp h4 .gc{margin-left:auto;font-style:normal;font-size:.9rem;opacity:.9}
.it{display:flex;align-items:center;gap:.5rem;border:3px solid transparent;background:transparent;border-radius:14px;padding:.32rem .45rem;font-size:1.2rem;color:#555;text-align:left;font-weight:700}
.it .bd{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--gl);color:var(--gd);display:grid;place-items:center;font-size:1rem;font-weight:900}
.it .tx{flex:1;white-space:nowrap}
.it .ck{flex:none;width:1.4rem;height:1.4rem;border-radius:50%;border:3px solid #ddd}
.it.on{border-color:var(--g);background:var(--gl);color:#222}
.it.done .ck{border-color:var(--g);background:var(--g);position:relative}
.it.done .ck::after{content:"";position:absolute;left:.32rem;top:.08rem;width:.35rem;height:.7rem;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.prog{margin-top:auto;display:flex;align-items:center;gap:.5rem;font-weight:800;color:var(--gd);font-size:1.1rem;padding:.3rem}
.prog .bar{flex:1;height:.8rem;border-radius:99px;background:#eee;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--g);transition:width .4s}
.fs{border:0;background:#f3f3f3;border-radius:10px;font-size:1rem;padding:.4rem;color:#666}
/* ---------- 主畫面 ---------- */
main{display:flex;flex-direction:column;padding:.8rem 1.1rem .9rem;gap:.55rem;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:1rem}
.banner{display:flex;align-items:stretch;flex:1;min-width:0}
.banner b{background:var(--g);color:#fff;font-size:1.9rem;font-weight:900;padding:.15rem 1.3rem .15rem .9rem;border-radius:14px 0 0 14px;clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%);letter-spacing:.06em}
.banner span{flex:1;margin-left:-.6rem;padding:.2rem 1.4rem;font-size:1.7rem;font-weight:900;color:#1f3d2b;background:linear-gradient(90deg,#c9eed6,#eaf8ef 70%,rgba(234,248,239,0));display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.ptag{flex:none;background:#fff;border:3px solid var(--g);color:var(--gd);font-weight:900;border-radius:999px;padding:.2rem .9rem;font-size:1.25rem}
.q{display:flex;align-items:center;gap:.6rem;font-size:1.75rem;font-weight:800;line-height:1.3}
.q .badge{flex:none;white-space:nowrap;min-width:2.3rem;height:2.3rem;padding:0 .5rem;border-radius:999px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:1.4rem;font-weight:900}
.q .sub{color:var(--g);font-size:1.9rem}
.q .num{color:var(--D)}
#work{flex:1;min-height:0;display:grid;grid-template-columns:1.42fr 1fr;gap:.9rem}
.card{background:#fff;border-radius:22px;box-shadow:0 4px 0 #f0dfc6,0 8px 24px rgba(160,120,60,.08);min-height:0;min-width:0}
#stagecard{position:relative;display:flex;flex-direction:column;padding:.6rem}
#tools{display:flex;gap:.5rem;flex-wrap:wrap;min-height:2.6rem;padding-right:3.4rem}
.tb{border:3px solid #e6e6e6;background:#fafafa;border-radius:999px;font-size:1.25rem;font-weight:800;padding:.25rem 1rem;color:#666}
.tb.on{border-color:var(--o);background:#fff3e3;color:#c45f00}
.tb.big{background:var(--o);border-color:var(--o);color:#fff;box-shadow:0 4px 0 #d9822e}
.tb.big:active{transform:translateY(3px);box-shadow:0 1px 0 #d9822e}
.tb:disabled{opacity:.35}
#reset{position:absolute;top:.6rem;right:.6rem;width:2.7rem;height:2.7rem;border-radius:50%;border:0;background:#f1f1f1;font-size:1.5rem;color:#777}
#stage{flex:1;width:100%;min-height:0;touch-action:none;font-family:'PingFang TC','Heiti TC','Microsoft JhengHei',sans-serif}
#reccard{display:flex;flex-direction:column;padding:.8rem 1rem;gap:.5rem;transition:box-shadow .3s}
#reccard.go{box-shadow:0 0 0 5px rgba(34,181,115,.45),0 8px 24px rgba(0,0,0,.08)}
.rechd{display:flex;align-items:center;gap:.5rem;font-weight:900;color:var(--gd);font-size:1.15rem}
.rechd i{flex:1;border-bottom:3px dotted #bfe6cf}
#rows{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.15rem}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:.3rem .6rem;padding:.45rem .2rem;border-bottom:2px solid #d9eefc}
.row .lb{flex:none;color:var(--gd);font-weight:900;font-size:1.35rem;min-width:1.6rem}
.row .lb.wd{background:var(--gl);border-radius:10px;padding:.05rem .55rem;font-size:1.1rem;flex:0 0 auto;margin-right:100%}
.eq{flex:1;display:flex;align-items:center;flex-wrap:wrap;gap:.3rem .25em;font-size:1.6rem;font-weight:800}
.eq .t{white-space:nowrap}
.eq{min-width:0}
.eq .lead,.eq .eg{display:inline-flex;align-items:center;gap:.3rem .25em;flex-wrap:nowrap;white-space:nowrap}
.eq .eg{max-width:100%}
.eq .t.s{font-size:1.15rem;color:#888;font-weight:700}
.eq .t.c{color:var(--C)}.eq .t.d{color:var(--D)}.eq .t.r{color:var(--R)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:2.7em;height:1.55em;padding:0 .3em;border-radius:10px;background:#f2f7ff;border:3px solid #c5d8ee;border-bottom-width:4px;color:#1d4f91;cursor:pointer;transition:background .2s}
.slot.ch{min-width:3.8em}
.slot.on{border-color:var(--o);background:#fff3e3;box-shadow:0 0 0 3px rgba(255,159,67,.25)}
.slot.ok{background:#d3f9d8;border-color:#37b24d;color:#2b8a3e;cursor:default}
.slot.bad{background:#ffe3e3;border-color:#fa5252;color:#c92a2a;animation:shake .4s}
.slot.fx{background:transparent;border-color:transparent;color:#555;cursor:default;min-width:0}
.slot .cur{display:inline-block;width:2px;height:1em;background:var(--o);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes blink{50%{opacity:0}}
.chk{flex:none;white-space:nowrap;border:0;background:var(--g);color:#fff;border-radius:12px;font-size:1.15rem;font-weight:900;padding:.4rem .7rem;box-shadow:0 3px 0 var(--gd)}
.chk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gd)}
.okmk{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:1.5rem;font-weight:900;animation:pop .35s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
/* 表格 */
.tbl{display:grid;grid-template-columns:auto repeat(3,1fr) auto;border:3px solid var(--g);border-radius:14px;overflow:hidden;margin:.2rem 0 .4rem}
.tbl>div{border-right:2px solid #bfe6cf;border-bottom:2px solid #bfe6cf;display:flex;align-items:center;justify-content:center;padding:.3rem .35rem;font-size:1.5rem;font-weight:800;min-height:2.6rem}
.tbl .th{background:#fff7cf;font-size:1.3rem}
.tbl .rh{background:var(--gl);font-size:1.15rem;white-space:nowrap}
.tbl .cc{border-right:0;padding:.2rem .3rem}
.tbl .chk{font-size:1rem;padding:.35rem .5rem}
/* 數字鍵盤 */
#pad{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;padding-top:.4rem;border-top:3px dotted #f0dfc6}
#pad.off{opacity:.3;pointer-events:none}
#pad button{height:2.9rem;border:0;border-radius:12px;background:#f3f5f8;font-size:1.65rem;font-weight:800;color:#333;box-shadow:0 3px 0 #d9dee6}
#pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #d9dee6}
#pad .k-bs{background:#ffe8e8;color:#d6336c}
#pad .k-nx{background:#e7f1ff;color:var(--D);font-size:1.05rem;white-space:nowrap}
#pad .k-ck{background:var(--g);color:#fff;box-shadow:0 3px 0 var(--gd);font-size:1.15rem;white-space:nowrap}
#pad.chips{grid-template-columns:repeat(3,1fr)}
#pad .chip{font-size:1.4rem;white-space:nowrap;padding:0 .3rem}
#pad .chip.c{color:var(--C)}#pad .chip.d{color:var(--D)}#pad .chip.r{color:var(--R)}
.pn{display:flex;gap:.6rem}
.pn button{flex:1;border:0;border-radius:14px;padding:.55rem;font-size:1.3rem;font-weight:900;background:#f1f1f1;color:#666}
.pn #next{background:#fff3e3;color:#c45f00}
.pn #next.glow{background:var(--o);color:#fff;animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,159,67,.35)}}
.pn button:disabled{opacity:.3}
/* SVG 動畫 */
.pulse{animation:pls 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pls{50%{transform:scale(1.25);opacity:.55}}
.nudge{animation:ndg 1s ease-in-out infinite}
@keyframes ndg{50%{transform:translateX(22px)}}
.popin{animation:pop .4s;transform-box:fill-box;transform-origin:center}
/* 平板橫向：目錄縮成圖示 */
@media (max-width:1200px) and (orientation:landscape){
  body{grid-template-columns:4.4rem 1fr}
  aside{padding:.6rem .35rem;align-items:stretch}
  .unit,.grp h4 .lt,.grp h4 .gc,.grp h4 .ar,.it .tx,.prog .bar{display:none}
  .grp h4{justify-content:center}
  .grp h4{text-align:center;padding:.2rem 0;font-size:1rem}
  .it{flex-direction:column;gap:.15rem;padding:.25rem 0;align-items:center}
  .it .bd{width:2rem;height:2rem;font-size:1.1rem}
  .it .ck{width:1rem;height:1rem;border-width:2px}
  .it.done .ck::after{left:.2rem;top:0;width:.25rem;height:.5rem;border-width:0 2px 2px 0}
  .prog{justify-content:center;font-size:1rem}
  .fs{font-size:0;padding:.5rem}.fs::before{content:"⛶";font-size:1.2rem}
  #work{grid-template-columns:1.55fr 1fr}
}
/* 小螢幕／直向 */
@media (max-width:900px),(orientation:portrait){
  html{font-size:clamp(12px,2.1vw,20px)}
  body{display:block;overflow:auto;height:auto}
  aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:3px solid #f1e4cf;padding:.5rem;position:sticky;top:0;z-index:5}
  .unit,.prog .bar,.fs{display:none}
  #toc{display:flex;gap:.6rem}.grp{flex-direction:row;align-items:center}.grp h4{margin:0 .2rem}.grp h4 .lt{display:none}
  .prog{margin:0}
  #work{grid-template-columns:1fr}
  #stagecard{height:52vh}
}

/* ===== 平板觸控(10 吋左右):放大輸入區 ===== */
@media (any-pointer:coarse) and (orientation:landscape) and (max-width:1400px){
  html{font-size:clamp(12px,min(1.22vw,2vh),20px)}
  #work{grid-template-columns:1fr 1.12fr;gap:.6rem}
  main{padding:.6rem .7rem .7rem;gap:.4rem}
  #reccard{padding:.6rem .7rem;gap:.4rem}
  .row{padding:.35rem .1rem}
  .eq{font-size:1.6rem}
  .slot{height:max(1.95em,46px);min-width:max(2.9em,52px);border-radius:12px}
  .slot.ch{min-width:4em}
  .chk{font-size:1.25rem;padding:.55rem .8rem}
  #pad{gap:.45rem;padding-top:.5rem}
  #pad button{height:max(3.5rem,54px);font-size:2rem;border-radius:14px}
  #pad .k-nx,#pad .k-ck{font-size:1.2rem}
  #pad .chip{font-size:1.6rem}
  .pn button{padding:.75rem;font-size:1.45rem}
  .it .bd{width:2.5rem;height:2.5rem;font-size:1.25rem}
  body{grid-template-columns:4.8rem 1fr}
}
@media (any-pointer:coarse) and (orientation:portrait){
  #stagecard{height:40vh}
  .slot{height:1.95em;min-width:2.9em}
  #pad button{height:max(3.4rem,58px);font-size:2rem}
  .pn button{padding:.75rem;font-size:1.45rem}
}
/* 分數 */
.frac{display:inline-flex;flex-direction:column;align-items:center;gap:3px;vertical-align:middle;margin:0 .1em}
.frac .fl{align-self:stretch;height:3px;background:#333;border-radius:2px}
.frac .slot{height:1.3em;min-width:2.2em;font-size:.9em}
.frac .slot.fx{height:1.1em}
.fq{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.72em;line-height:1.05;margin:0 .1em}
.fq i{font-style:normal}.fq i:first-child{border-bottom:3px solid currentColor;padding:0 .15em}
@media (max-width:900px),(orientation:portrait){#stagecard{height:min(52vh,calc(56vw + 3.5rem))}}
@media (any-pointer:coarse) and (orientation:portrait){#stagecard{height:min(40vh,calc(56vw + 3.5rem))}}
</style>
</head>
<body>
<aside>
  <div class="unit">第5單元<b>比和比值</b></div>
  <div id="toc"></div>
  <div class="prog"><div class="bar"><i id="pbar"></i></div><span id="ptxt"></span></div>
  <button class="fs" id="fsbtn">⛶ 全螢幕</button>
</aside>
<main>
  <header>
    <div class="banner"><b id="secno">5-1</b><span id="sectt">比</span></div>
    <div class="ptag" id="ptag">課本 P72</div>
  </header>
  <div class="q" id="q"></div>
  <section id="work">
    <div class="card" id="stagecard">
      <div id="tools"></div>
      <svg id="stage" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg>
      <button id="reset" title="重來">↺</button>
    </div>
    <div class="card" id="reccard">
      <div class="rechd">✏️ 記錄<i></i></div>
      <div id="rows"></div>
      <div id="pad" class="off"></div>
      <div class="pn"><button id="prev">◀ 上一題</button><button id="next">下一題 ▶</button></div>
    </div>
  </section>
</main>
<script>
(()=>{
'use strict';
const NS='http://www.w3.org/2000/svg';
const C='#e8384f',D='#1c7ed6',R='#f08c00',G='#22b573',O='#FF9F43',TAU=Math.PI*2;
const $=s=>document.querySelector(s);
function mk(p,t,a={},txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;if(p)p.appendChild(e);return e}
let svg=$('#stage'),defs,gen=0,zid=0;
function P(ev){const m=svg.getScreenCTM().inverse();const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const q=p.matrixTransform(m);return{x:q.x,y:q.y}}
/* 拖曳：在整個舞台按下就能拖 */
function onDrag(el,{down,move,up}){
  el.addEventListener('pointerdown',e=>{
    const r=down?down(P(e),e):true; if(r===false)return; e.preventDefault();
    const mv=ev=>{move&&move(P(ev),ev)};
    const u=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',u);window.removeEventListener('pointercancel',u);up&&up(P(ev))};
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',u);window.addEventListener('pointercancel',u);
  });
}
function tap(el,f){el.addEventListener('pointerdown',e=>{e.preventDefault();f(P(e),e)});el.style.cursor='pointer'}
function tween(ms,f,done){const g0=gen,t0=performance.now();(function st(now){if(g0!==gen)return;let t=Math.min(1,(now-t0)/ms);const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;f(e);if(t<1)requestAnimationFrame(st);else done&&done()})(t0)}
function later(ms,f){const g0=gen;setTimeout(()=>{if(g0===gen)f()},ms)}
function arcPath(cx,cy,r,a0,sw){
  if(sw>=TAU-1e-4){return `M${cx+r} ${cy}A${r} ${r} 0 1 1 ${cx-r} ${cy}A${r} ${r} 0 1 1 ${cx+r} ${cy}`}
  const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a0+sw),y1=cy+r*Math.sin(a0+sw);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${sw>Math.PI?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
/* 大括號：標示 x1~x2 這一整段 */
function brace(g,x1,x2,y,col,label,fs=36){const d=36,m=(x1+x2)/2,q=Math.min(30,(x2-x1)/6),h=d/2;
  mk(g,'path',{d:`M${x1} ${y}Q${x1} ${y+h} ${x1+q} ${y+h}L${m-q} ${y+h}Q${m} ${y+h} ${m} ${y+d}Q${m} ${y+h} ${m+q} ${y+h}L${x2-q} ${y+h}Q${x2} ${y+h} ${x2} ${y}`,
    fill:'none',stroke:col,'stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round'});
  if(label){const w=[...label].reduce((t,ch)=>t+(/[\u2e80-\uffff]/.test(ch)?fs:fs*.6),0)+fs*.6;
    mk(g,'rect',{x:m-w/2,y:y+d+8,width:w,height:fs*1.25,rx:fs*.3,fill:'#fff',opacity:.85});
    txt(g,m,y+d+8+fs*.98,label,{fill:col,'font-size':fs})}}
function seed(s){s=s*2654435761>>>0;return()=>{s=s+0x6D2B79F5>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
/* 文字加白色外框，壓在圖上也看得清楚 */
const HALO={stroke:'#fff','stroke-width':7,'stroke-linejoin':'round','paint-order':'stroke'};
function txt(p,x,y,s,o={}){return mk(p,'text',Object.assign({x,y,'text-anchor':'middle','font-size':34,'font-weight':800,fill:'#333'},HALO,o),s)}
function pill(p,x,y,s,col,o={}){const g=mk(p,'g',{class:'popin'});const fs=o.fs||32;const w=[...String(s)].reduce((t,ch)=>t+(/[\u2e80-\uffff]/.test(ch)?fs:fs*.6),0)+fs*.9;
  mk(g,'rect',{x:x-w/2,y:y-fs*.85,width:w,height:fs*1.3,rx:fs*.65,fill:'#fff',stroke:col,'stroke-width':4});
  txt(g,x,y+fs*.1,s,{fill:col,'font-size':fs});return g}
/* ---- 第 5 單元用的工具 ---- */
const PQ='#1c7ed6',HQ='#f08c00';                  // 前項藍、後項橘
function wcol(w){return /前項/.test(w)?PQ:/後項/.test(w)?HQ:''}
function ctext(p,x,y,s,o={}){return txt(p,x,y,s,Object.assign({'text-anchor':'start','font-size':32},o))}
function emo(g,x,y,ch,fs=56,o={}){return mk(g,'text',Object.assign({x,y,'text-anchor':'middle','font-size':fs,'dominant-baseline':'central',style:"font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif"},o),ch)}
/* SVG 分數 */
function frS(g,x,y,n,d,col='#333',fs=40){const w=Math.max(String(n).length,String(d).length)*fs*.62+14;
  txt(g,x,y-fs*.22,n,{fill:col,'font-size':fs});mk(g,'line',{x1:x-w/2,y1:y,x2:x+w/2,y2:y,stroke:col,'stroke-width':4,'stroke-linecap':'round'});txt(g,x,y+fs*.92,d,{fill:col,'font-size':fs});return w}
/* 弧形箭頭:二次曲線,箭頭沿終點切線方向 */
function qArrow(g,x0,y0,cx,cy,x1,y1,col,o={}){const L=o.L||36,W=o.W||19;let ux=x1-cx,uy=y1-cy;const n=Math.hypot(ux,uy);ux/=n;uy/=n;
  const G=mk(g,'g',o.cls?{class:o.cls}:{});const bx=x1-ux*L*.8,by=y1-uy*L*.8;
  mk(G,'path',{d:`M${x0} ${y0}Q${cx} ${cy} ${bx} ${by}`,fill:'none',stroke:col,'stroke-width':o.sw||7,'stroke-linecap':'round'});
  const px=-uy,py=ux,qx=x1-ux*L,qy=y1-uy*L;mk(G,'path',{d:`M${x1} ${y1}L${qx+px*W} ${qy+py*W}L${qx-px*W} ${qy-py*W}Z`,fill:col,'stroke-linejoin':'round'});return G}
/* 文字和分數混排:tokens 為字串或 [分子,分母];y 是文字基線 */
function mathS(g,x,y,tokens,o={}){const fs=o.fs||40,col=o.fill||'#333',ffs=Math.round(fs*.95);const G=mk(g,'g',o.cls?{class:o.cls}:{});const inner=mk(G,'g');let cx=0;
  const est=s=>[...s].reduce((t,ch)=>t+(/[\u2e80-\uffff]/.test(ch)?fs:ch===' '?fs*.28:fs*.6),0);
  tokens.forEach(t=>{if(Array.isArray(t)){const w=Math.max(String(t[0]).length,String(t[1]).length)*ffs*.62+14;frS(inner,cx+w/2+4,y-fs*.33,t[0],t[1],col,ffs);cx+=w+8}
    else{const e=txt(inner,cx,y,t,{fill:col,'font-size':fs,'text-anchor':'start','xml:space':'preserve',style:'white-space:pre'});let w=0;try{w=e.getComputedTextLength()}catch(_){}cx+=w||est(t)}});
  const off=o.anchor==='start'?0:o.anchor==='end'?-cx:-cx/2;inner.setAttribute('transform',`translate(${x+off} 0)`);G.w=cx;return G}
function mathPill(g,x,y,tokens,col,o={}){const fs=o.fs||40;const G=mk(g,'g',{class:'popin'});const r=mk(G,'rect',{fill:'#fff',stroke:col,'stroke-width':4});
  const m=mathS(G,x,y,tokens,{fs,fill:col});const hasF=tokens.some(Array.isArray);const top=hasF?y-fs*.33-fs*.95*.95:y-fs*.85,bot=hasF?y-fs*.33+fs*.95*1.12:y+fs*.3;
  const w=m.w+fs*1.1;r.setAttribute('x',x-w/2);r.setAttribute('y',top-10);r.setAttribute('width',w);r.setAttribute('height',bot-top+20);r.setAttribute('rx',Math.min(30,(bot-top+20)/2));return G}
/* 大大的「a：b」,下面標前項、後項 */
function ratioBig(g,x,y,a,b,o={}){const fs=o.fs||76,gap=o.gap||110;const G=mk(g,'g',{class:'popin'});
  txt(G,x-gap,y,a,{fill:PQ,'font-size':fs});txt(G,x,y-6,'：',{fill:'#555','font-size':fs});txt(G,x+gap,y,b,{fill:HQ,'font-size':fs});
  if(o.lab!==false){const ly=y+fs*.62;
    txt(G,x-gap,ly,'前項',{fill:PQ,'font-size':34});txt(G,x,ly,o.mid||'比的符號',{fill:'#888','font-size':26});txt(G,x+gap,ly,'後項',{fill:HQ,'font-size':34})}
  return G}
/* 長條(n 等分) */
function strip(g,x,y,w,h,n,fill,o={}){const G=mk(g,'g');const u=w/n;for(let i=0;i<n;i++)mk(G,'rect',{x:x+i*u,y,width:u,height:h,fill:o.alt&&i%2?o.alt:fill,stroke:o.stroke||'#fff','stroke-width':o.sw!=null?o.sw:3,rx:o.rx||0});
  if(o.out)mk(G,'rect',{x,y,width:w,height:h,fill:'none',stroke:o.out,'stroke-width':4,rx:6});return G}
/* 點兩下:先點前項、再點後項,點完排出比 */
function pickOrder(c,{items,order,onDone,hintY=40}){let k=0;const hint=txt(svg,500,hintY,'先點「前項」，再點「後項」',{fill:'#888','font-size':32});
  items.forEach((it,i)=>{const ring=mk(svg,'rect',{x:it.x-it.w/2,y:it.y-it.h/2,width:it.w,height:it.h,rx:20,fill:'rgba(255,255,255,0)',stroke:'#ddd','stroke-width':4,'stroke-dasharray':'10 8'});
    tap(ring,()=>{if(k>=2||it.picked)return;if(order[k]!==i){ring.classList.remove('bad');void ring.getBBox();ring.setAttribute('stroke','#fa5252');later(500,()=>ring.setAttribute('stroke','#ddd'));return}
      it.picked=true;ring.setAttribute('stroke',k===0?PQ:HQ);ring.setAttribute('stroke-dasharray','');pill(svg,it.x,it.y-it.h/2-4,k===0?'前項':'後項',k===0?PQ:HQ,{fs:32});k++;
      if(k===2){hint.remove();onDone()}})})}
const fq=(n,d)=>`<span class="fq"><i>${n}</i><i>${d}</i></span>`;   // 題目裡的分數

/* ---- 杯子 ---- */
function cup(g,x,y,col,lab,w=140,h=160){const G=mk(g,'g',{transform:`translate(${x} ${y})`});
  mk(G,'path',{d:`M${-w/2} ${-h/2}L${w/2} ${-h/2}L${w*.38} ${h/2}L${-w*.38} ${h/2}Z`,fill:'#fff',stroke:'#888','stroke-width':3});
  mk(G,'path',{d:`M${-w*.46} ${-h*.3}L${w*.46} ${-h*.3}L${w*.38} ${h/2}L${-w*.38} ${h/2}Z`,fill:col});
  txt(G,0,h/2+48,lab,{'font-size':40,fill:'#555'});return G}

/* ================== 狀態與畫面 ================== */
function isIn(x){return x&&typeof x==='object'&&!x.fx&&!x.fr}
/* 一列裡所有要填的格子(分數拆成分子、分母兩格) */
function inSl(r){return r.parts?r.parts.flatMap(p=>p&&p.fr?p.fr.filter(isIn):(isIn(p)?[p]:[])):[]}
const state=PAGES.map(pg=>({vals:pg.rows.map(r=>inSl(r).map(()=>'')),ok:pg.rows.map(r=>!!(r.fixed||!inSl(r).length)),mode:null}));
let cur=0,act=null; // act={ri,si}
const toc=$('#toc');
const SECT={'5-1':'比','5-2':'比值','5-3':'相等的比','5-4':'比的應用'};
const BDS={'試試看':'試','動動腦':'腦','GO!':'GO'};
let openSec=null;
function buildToc(){toc.innerHTML='';let g=null,last='';
  PAGES.forEach((pg,i)=>{if(pg.sec!==last){last=pg.sec;g=document.createElement('div');g.className='grp';g.dataset.sec=pg.sec;const sec=pg.sec;
      const h=document.createElement('h4');h.innerHTML=`<span class="ar">▸</span>${sec}<span class="lt"> ${SECT[sec].replace('認識','')}</span><em class="gc"></em>`;
      h.addEventListener('pointerdown',e=>{e.preventDefault();openSec=openSec===sec?null:sec;refreshToc()});g.appendChild(h);toc.appendChild(g)}
    const b=document.createElement('button');b.className='it';b.dataset.i=i;
    b.title=pg.toc;b.innerHTML=`<span class="bd">${BDS[pg.bd]||pg.bd}</span><span class="tx">${pg.toc}</span><span class="ck"></span>`;
    b.addEventListener('pointerdown',e=>{e.preventDefault();go(i)});g.appendChild(b)})}
function pageDone(i){return state[i].ok.every(Boolean)}
function refreshToc(){let n=0;toc.querySelectorAll('.it').forEach(b=>{const i=+b.dataset.i;b.classList.toggle('on',i===cur);const d=pageDone(i);b.classList.toggle('done',d);if(d)n++;b.hidden=PAGES[i].sec!==openSec});
  toc.querySelectorAll('.grp').forEach(g=>{const sec=g.dataset.sec,ids=PAGES.map((p,i)=>i).filter(i=>PAGES[i].sec===sec);g.classList.toggle('open',sec===openSec);g.querySelector('.gc').textContent=ids.filter(pageDone).length+'/'+ids.length});
  $('#pbar').style.width=(n/PAGES.length*100)+'%';$('#ptxt').textContent=n+'/'+PAGES.length;
  $('#next').classList.toggle('glow',pageDone(cur)&&cur<PAGES.length-1);$('#prev').disabled=cur===0;$('#next').disabled=cur===PAGES.length-1}

function go(i){cur=i;act=null;const pg=PAGES[i];openSec=pg.sec;
  $('#secno').textContent=pg.sec;$('#sectt').textContent=SECT[pg.sec];$('#ptag').textContent='課本 P'+pg.p;
  buildStage();renderRows();refreshToc();
  const it=toc.querySelector(`.it[data-i="${i}"]`);it&&it.scrollIntoView({block:'nearest'});}
function setQ(){const pg=PAGES[cur],st=state[cur];const bd=`<span class="badge">${pg.bd}</span>`;
  const body=pg.qf?pg.qf(st.mode||pg.tools[0][1]):`${pg.sub?`<span class="sub">${pg.sub}</span>`:''}${pg.q}`;
  $('#q').innerHTML=bd+'<span>'+body.replace(/(\d+(?:\.\d+)?)/g,(m,a,off,s)=>/<[^>]*$/.test(s.slice(0,off))?m:`<span class="num">${m}</span>`)+'</span>'}
function buildStage(){gen++;const pg=PAGES[cur],st=state[cur];
  const n=svg.cloneNode(false);svg.replaceWith(n);svg=n;defs=mk(svg,'defs');
  const tools=$('#tools');tools.innerHTML='';
  const mode=st.mode||(pg.tools?pg.tools[0][1]:null);
  if(pg.tools)pg.tools.forEach(([lab,m])=>{const b=document.createElement('button');b.className='tb'+(m===mode?' on':'');b.textContent=lab;
    b.addEventListener('pointerdown',e=>{e.preventDefault();st.mode=m;buildStage()});tools.appendChild(b)});
  setQ();
  const ctx={done(){const rc=$('#reccard');rc.classList.add('go');later(1600,()=>rc.classList.remove('go'));if(!act)focusNext(-1)},
    tool(lab,f,big){const b=document.createElement('button');b.className='tb'+(big?' big':'');b.textContent=lab;b.addEventListener('pointerdown',e=>{e.preventDefault();if(!b.disabled)f()});tools.appendChild(b);return b}};
  pg.build(ctx,mode||undefined);
}
$('#reset').addEventListener('pointerdown',e=>{e.preventDefault();buildStage()});

/* ---------- 記錄區 ---------- */
const rows=$('#rows');
function renderRows(){const pg=PAGES[cur],st=state[cur];rows.innerHTML='';let tbl=null;
  pg.rows.forEach((row,ri)=>{
    if(row.head){tbl=document.createElement('div');tbl.className='tbl';row.head.forEach((h,k)=>{const d=document.createElement('div');d.className=k?'th':'th rh';d.textContent=k?h:'';tbl.appendChild(d)});tbl.appendChild(Object.assign(document.createElement('div'),{className:'th cc'}));rows.appendChild(tbl);return}
    let si=0;const cells=[];
    row.parts.forEach(p=>{let el;
      const mkSlot=q=>{let e;if(q.fx){e=document.createElement('span');e.className='slot fx';e.textContent=q.fx}
        else{const k=si++;e=document.createElement('span');e.className='slot'+(q.c?' ch':'');e.dataset.ri=ri;e.dataset.si=k;
          e.addEventListener('pointerdown',ev=>{ev.preventDefault();if(st.ok[ri])return;act={ri,si:k};paint()})}return e};
      if(typeof p==='string'){el=document.createElement('span');el.className='t';el.textContent=p}
      else if(p.fr){el=document.createElement('span');el.className='frac';el.appendChild(mkSlot(p.fr[0]));const l=document.createElement('b');l.className='fl';el.appendChild(l);el.appendChild(mkSlot(p.fr[1]))}
      else if(p.fx){el=document.createElement('span');el.className='slot fx';el.textContent=p.fx}
      else{const k=si++;el=document.createElement('span');el.className='slot'+(p.c?' ch':'');el.dataset.ri=ri;el.dataset.si=k;
        el.addEventListener('pointerdown',e=>{e.preventDefault();if(st.ok[ri])return;act={ri,si:k};paint()})}
      cells.push(el)});
    const right=document.createElement('span');right.className='rt';right.dataset.ri=ri;
    if(row.tr){const lab=document.createElement('div');lab.className='rh';lab.textContent=cells[0].textContent;tbl.appendChild(lab);
      cells.slice(1).forEach(c=>{const d=document.createElement('div');d.appendChild(c);tbl.appendChild(d)});
      const d=document.createElement('div');d.className='cc';d.appendChild(right);tbl.appendChild(d);}
    else{const r=document.createElement('div');r.className='row';
      if(row.lb){const l=document.createElement('span');l.className='lb'+(/^[①-⑩]$/.test(row.lb)?'':' wd');l.textContent=row.lb;r.appendChild(l)}
      const eq=document.createElement('span');eq.className='eq';layoutEq(eq,row.parts,cells);
      if(row.note){const n=document.createElement('span');n.className='t s';n.textContent='（'+row.note+'）';eq.appendChild(n)}
      r.appendChild(eq);if(!row.fixed&&inSl(row).length)r.appendChild(right);rows.appendChild(r)}
  });
  paint();
}
/* 算式不從中間斷行：前面的文字可以自己一行，算式整串保持一行，太長就自動縮小字 */
const CJK=/[\u4e00-\u9fff]/;
function layoutEq(eq,parts,cells){const isS=p=>typeof p!=='string';const idx=parts.map((p,k)=>isS(p)?k:-1).filter(k=>k>=0);
  const isEq=idx.length&&parts.slice(idx[0],idx[idx.length-1]+1).every(p=>isS(p)||!CJK.test(p));
  if(!isEq){cells.forEach(c=>eq.appendChild(c));return}
  const lead=document.createElement('span');lead.className='lead';const g=document.createElement('span');g.className='eg';let k=0;
  while(k<idx[0]&&CJK.test(parts[k])){const m=parts[k].match(/^(.*[\u4e00-\u9fff，、？])(\s*[^\u4e00-\u9fff，、？]+)$/);
    if(m){cells[k].textContent=m[1];lead.appendChild(cells[k]);const t=document.createElement('span');t.className='t';t.textContent=m[2].trim();g.appendChild(t);k++;break}
    lead.appendChild(cells[k]);k++}
  for(;k<cells.length;k++)g.appendChild(cells[k]);
  if(lead.childNodes.length)eq.appendChild(lead);eq.appendChild(g)}
function fitEq(){rows.querySelectorAll('.eg').forEach(g=>{g.style.fontSize='';const W=g.parentElement.clientWidth;let k=1;while(g.scrollWidth>W+1&&k>.55){k-=.05;g.style.fontSize=k.toFixed(2)+'em'}})}
window.addEventListener('resize',()=>fitEq());
function paint(){const pg=PAGES[cur],st=state[cur];
  rows.querySelectorAll('.slot:not(.fx)').forEach(el=>{const ri=+el.dataset.ri,si=+el.dataset.si;const v=st.vals[ri][si];
    const on=act&&act.ri===ri&&act.si===si;el.classList.toggle('on',on);el.classList.toggle('ok',st.ok[ri]);
    el.innerHTML='';const tx=document.createElement('span');tx.textContent=v;el.appendChild(tx);
    const slot=slotDef(ri,si);if(slot.c&&v){el.style.color=wcol(v)}else el.style.color='';
    if(st.ok[ri])el.style.color='';
    if(on&&!slot.c){const cu=document.createElement('i');cu.className='cur';el.appendChild(cu)}});
  rows.querySelectorAll('.rt').forEach(el=>{const ri=+el.dataset.ri;
    if(st.ok[ri]){if(!el.querySelector('.okmk'))el.innerHTML='<span class="okmk">✓</span>'}
    else if(!el.querySelector('.chk')){el.innerHTML='';const b=document.createElement('button');b.className='chk';b.textContent='檢查';
      b.addEventListener('pointerdown',e=>{e.preventDefault();check(ri)});el.appendChild(b)}});
  renderPad();refreshToc();fitEq();
}
function slotDef(ri,si){return inSl(PAGES[cur].rows[ri])[si]}
function renderPad(){const pad=$('#pad');pad.innerHTML='';pad.className='';
  const slot=act?slotDef(act.ri,act.si):null;
  if(slot&&slot.c){pad.classList.add('chips');slot.c.forEach(w=>{const b=document.createElement('button');b.className='chip';b.style.color=wcol(w);b.textContent=w;
      b.addEventListener('pointerdown',e=>{e.preventDefault();state[cur].vals[act.ri][act.si]=w;clearBad(act.ri,act.si);const r0=act.ri;if(!advance())paint();})
      ;pad.appendChild(b)});return}
  if(!slot)pad.classList.add('off');
  ['1','2','3','4','5','6','⌫','7','8','9','0','.','下一格','檢查'].forEach(k=>{const b=document.createElement('button');b.textContent=k;
    if(k==='⌫')b.className='k-bs';if(k==='下一格')b.className='k-nx';if(k==='檢查')b.className='k-ck';
    b.addEventListener('pointerdown',e=>{e.preventDefault();key(k)});pad.appendChild(b)});
}
function clearBad(ri,si){const el=rows.querySelector(`.slot[data-ri="${ri}"][data-si="${si}"]`);el&&el.classList.remove('bad')}
function key(k){if(!act)return;const st=state[cur];const v=st.vals[act.ri][act.si];
  if(k==='⌫')st.vals[act.ri][act.si]=v.slice(0,-1);
  else if(k==='下一格'){if(!advance(true))paint();return}
  else if(k==='檢查'){check(act.ri);return}
  else if(k==='.'){if(!v.includes('.')&&v.length<8)st.vals[act.ri][act.si]=(v||'0')+'.'}
  else if(v.length<8)st.vals[act.ri][act.si]=v+k;
  clearBad(act.ri,act.si);paint();
}
/* 下一個空格（同一列優先） */
function advance(wrap){const st=state[cur];const n=st.vals[act.ri].length;
  for(let k=act.si+1;k<n;k++)if(!st.vals[act.ri][k]){act={ri:act.ri,si:k};paint();return true}
  if(wrap){for(let k=0;k<n;k++)if(!st.vals[act.ri][k]&&k!==act.si){act={ri:act.ri,si:k};paint();return true}
    if(act.si+1<n){act={ri:act.ri,si:act.si+1};paint();return true}}
  return false}
function focusNext(fromRi){const st=state[cur];for(let ri=0;ri<st.vals.length;ri++){if(st.ok[ri]||ri===fromRi)continue;const k=st.vals[ri].findIndex(v=>!v);act={ri,si:k<0?0:k};paint();return}act=null;paint()}
function match(v,s){if(v==='')return false;if(s.c)return Array.isArray(s.a)?s.a.includes(v):v===s.a;const x=parseFloat(v);return !isNaN(x)&&Math.abs(x-s.a)<=(s.tol||0)+1e-9}
function check(ri){const pg=PAGES[cur],st=state[cur],row=pg.rows[ri],sl=inSl(row),v=st.vals[ri];
  const ok=sl.map((s,i)=>match(v[i],s));
  (row.perm||[]).forEach(gp=>{const used=new Set();gp.forEach(i=>ok[i]=false);
    gp.forEach(i=>{const j=gp.find(j=>!used.has(j)&&match(v[i],sl[j]));if(j!=null){used.add(j);ok[i]=true}})});
  if(ok.every(Boolean)){st.ok[ri]=true;act=null;paint();
    if(pageDone(cur)){celebrate()}else focusNext(ri)}
  else{paint();ok.forEach((g,i)=>{if(!g){const el=rows.querySelector(`.slot[data-ri="${ri}"][data-si="${i}"]`);if(el){el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad')}}});
    const bi=ok.findIndex(g=>!g);act={ri,si:bi};
    rows.querySelectorAll('.slot.on').forEach(e=>e.classList.remove('on'));const el=rows.querySelector(`.slot[data-ri="${ri}"][data-si="${bi}"]`);el&&el.classList.add('on');renderPad()}
}
function celebrate(){const g=mk(svg,'g',{class:'popin'});const vb=svg.viewBox.baseVal;
  const x=vb.width-60,y=vb.height-60;mk(g,'circle',{cx:x,cy:y,r:46,fill:G});mk(g,'path',{d:`M${x-24} ${y}l16 18l32 -36`,fill:'none',stroke:'#fff','stroke-width':12,'stroke-linecap':'round','stroke-linejoin':'round'})}

document.addEventListener('keydown',e=>{if(!act)return;const k=e.key;
  if(/^[0-9.]$/.test(k))key(k);else if(k==='Backspace'){e.preventDefault();key('⌫')}else if(k==='Enter')key('檢查');else if(k==='Tab'){e.preventDefault();key('下一格')}});
$('#prev').addEventListener('pointerdown',e=>{e.preventDefault();if(cur>0)go(cur-1)});
$('#next').addEventListener('pointerdown',e=>{e.preventDefault();if(cur<PAGES.length-1)go(cur+1)});
$('#fsbtn').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()});
buildToc();go(0);
})();
</script>
</body>
</html>
