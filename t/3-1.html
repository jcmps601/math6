<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小數除法：小數點怎麼放</title>
<style>
:root{--bg:#FFF8EE;--g:#22b573;--gd:#138a52;--gl:#e3f6ea;--o:#FF9F43;--od:#d9822e;--p:#7048e8;--pl:#f3f0ff;--b:#1c7ed6;--bl:#e7f5ff;--boy:#1c7ed6;--boyl:#d0ebff;--girl:#d6336c;--girll:#ffdeeb;--ink:#333}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:clamp(12px,min(1.25vw,2.15vh),30px)}
body{margin:0;height:100vh;height:100dvh;display:grid;grid-template-columns:6.4rem 1fr;background:var(--bg);color:var(--ink);
  font-family:'PingFang TC','Heiti TC','Microsoft JhengHei',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.kai{font-family:'BiauKai','Kaiti TC','STKaiti','DFKai-SB','標楷體',serif}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bad{animation:shake .4s}
/* 左側目錄 */
aside{background:#fff;border-right:3px solid #f1e4cf;display:flex;flex-direction:column;padding:.4rem .3rem;gap:.12rem;overflow-y:auto}
.unit{text-align:center;padding-bottom:0}
.unit b{display:inline-block;font-size:.9rem;color:#fff;background:var(--g);border-radius:12px;padding:.2rem .5rem}
.grp{font-size:.85rem;font-weight:900;text-align:center;margin-top:.15rem;border-top:3px dotted #e9dcc6;padding-top:.15rem}
.grp.a{color:var(--b)}.grp.b{color:var(--gd)}.grp.c{color:#d9480f}
.nav{display:flex;flex-direction:column;align-items:center;gap:0;border:3px solid transparent;background:transparent;border-radius:14px;padding:.08rem .1rem;font-size:.85rem;line-height:1.1;color:#555;font-weight:800;white-space:nowrap}
.nav .ic{flex:none;width:1.45rem;height:1.45rem;border-radius:50%;background:#f1f3f5;display:grid;place-items:center;font-size:1.1rem}
.nav.on{border-color:var(--g);background:var(--gl);color:#1f3d2b}
.nav.on .ic{background:var(--g)}
.fs{margin-top:auto;flex:none;border:0;background:#f3f3f3;border-radius:12px;font-size:1.1rem;padding:.2rem;color:#666}
/* 主畫面 */
main{display:flex;flex-direction:column;padding:.55rem .9rem .8rem;gap:.55rem;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:.6rem}
.banner{display:flex;align-items:stretch;flex:1;min-width:0}
.banner b{background:var(--g);color:#fff;font-size:1.6rem;font-weight:900;padding:.2rem 1.4rem .2rem .9rem;border-radius:14px 0 0 14px;clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%);white-space:nowrap}
.banner span{flex:1;margin-left:-.6rem;padding:.2rem 1.4rem;font-size:1.5rem;font-weight:900;color:#1f3d2b;background:linear-gradient(90deg,#c9eed6,#eaf8ef 70%,rgba(234,248,239,0));display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.reset{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 0 #eadbc4;font-size:1.6rem;color:#777}
/* 抽籤列 */
.who{flex:none;display:flex;align-items:center;gap:.4rem;border:0;background:#fff;border-radius:999px;padding:.15rem .9rem .15rem .2rem;box-shadow:0 3px 0 #eadbc4;font-size:1.3rem;font-weight:900;color:#555}
.who .wb{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.45rem;background:radial-gradient(circle at 35% 30%,#ffe8a3,#fcc419 60%,#e67700)}
.who .wb.boy{background:radial-gradient(circle at 35% 30%,#a5d8ff,#339af0 60%,#1864ab)}
.who .wb.girl{background:radial-gradient(circle at 35% 30%,#ffc9de,#f06595 60%,#a61e4d)}
.hbtn{flex:none;border:0;border-radius:999px;font-size:1.3rem;font-weight:900;padding:.4rem .9rem;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gd)}
.hbtn.m{background:#e9ecef;color:#666;box-shadow:0 4px 0 #ced4da;padding:.4rem .6rem}
.hbtn.t{background:#fff;color:#c45f00;box-shadow:0 3px 0 #eadbc4}
.hbtn:disabled{opacity:.35;pointer-events:none}
.hbtn:active{transform:translateY(2px)}
.plusfx{position:fixed;z-index:60;font-size:3rem;font-weight:900;color:#f08c00;pointer-events:none;animation:up 1s forwards;text-shadow:0 3px 0 #fff}
@keyframes up{to{transform:translateY(-3rem);opacity:0}}
/* 抽籤動畫 */
#drawov{position:fixed;inset:0;z-index:70;background:rgba(255,248,238,.82);display:grid;place-items:center;transition:opacity .35s}
#drawov.out{opacity:0}
#drawov .bb{width:min(42vh,26rem);height:min(42vh,26rem);border-radius:50%;display:grid;place-items:center;font-size:min(20vh,12rem);font-weight:900;color:#fff;background:radial-gradient(circle at 35% 30%,#ffe8a3,#fcc419 60%,#e67700);box-shadow:inset -18px -24px 0 rgba(0,0,0,.12),0 14px 0 #f0dfc6}
#drawov .bb.boy{background:radial-gradient(circle at 35% 30%,#a5d8ff,#339af0 60%,#1864ab)}
#drawov .bb.girl{background:radial-gradient(circle at 35% 30%,#ffc9de,#f06595 60%,#a61e4d)}
#drawov .bb.roll{animation:wob .12s infinite}
#drawov .bb.land{animation:pop .5s}
@keyframes wob{50%{transform:rotate(8deg) scale(1.04)}}
/* 加分板 */
#board{position:fixed;inset:0;z-index:65;background:rgba(40,30,10,.35);display:flex;align-items:center;justify-content:center}
#board .bd{width:min(94vw,64rem);max-height:94vh;background:#fff;border-radius:28px;padding:1.2rem 1.4rem;display:flex;flex-direction:column;gap:.8rem;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#board .bh{display:flex;align-items:center;gap:.6rem;font-size:1.8rem;font-weight:900;color:var(--gd)}
#board .bh .sp{flex:1}
#board .bh button{border:0;border-radius:12px;font-size:1.15rem;font-weight:900;padding:.35rem .8rem;background:#f1f3f5;color:#555}
#board .bh button.on{background:#ffe3e3;color:#c92a2a}
#board .bh .left{font-size:1.1rem;color:#888}
.btiles{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem}
.bt{border-radius:16px;padding:.35rem 0;display:flex;flex-direction:column;align-items:center;border:4px solid transparent;cursor:pointer}
.bt .n{font-size:2.1rem;font-weight:900;line-height:1.1}
.bt .s{font-size:1.15rem;font-weight:900;min-height:1.5rem}
.bt.b{background:var(--boyl);color:var(--boy)}.bt.g{background:var(--girll);color:var(--girl)}
.bt.used{opacity:.5}.bt.cur{border-color:var(--o);opacity:1}
.bt.off{background:#f1f3f5;color:#adb5bd;opacity:1;text-decoration:line-through}
.bt.top1{box-shadow:0 0 0 3px #fcc419}
.confirm{color:#c92a2a!important;background:#ffe3e3!important}
/* 共用 */
.page{flex:1;min-height:0;display:flex;flex-direction:column;gap:.8rem}
.card{background:#fff;border-radius:24px;box-shadow:0 4px 0 #f0dfc6,0 8px 24px rgba(160,120,60,.08);min-height:0;min-width:0}
.pill{border:3px solid #e6e6e6;background:#fafafa;border-radius:999px;font-size:1.25rem;font-weight:800;padding:.25rem 1rem;color:#666}
.pill.on{border-color:var(--o);background:#fff3e3;color:#c45f00}
.pill.ex{color:#e8384f;border-color:#ffc9c9;background:#fff5f5}
.pill.ex.on{border-color:#e8384f;background:#ffe3e3}
.pill.dn{position:relative}.pill.dn::after{content:"✔";position:absolute;right:-.2rem;top:-.55rem;font-size:.95rem;color:var(--g)}
.big-btn{border:0;background:var(--o);color:#fff;border-radius:18px;font-size:1.5rem;font-weight:900;padding:.45rem 1.2rem;box-shadow:0 5px 0 var(--od)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--od)}
.big-btn.g{background:var(--g);box-shadow:0 5px 0 var(--gd)}
.big-btn.p{background:var(--p);box-shadow:0 5px 0 #5235c0}
.big-btn.gray{background:#e9ecef;color:#666;box-shadow:0 5px 0 #ced4da}
.big-btn:disabled{opacity:.35;pointer-events:none}
.show>*,.qzc>*,.mcol>*,.card>*,.right>*{flex-shrink:0}
.pgrid{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr;gap:.9rem}
.strip{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.strip .lab{font-size:1.15rem;font-weight:900;color:var(--gd);margin:0 .2rem 0 .4rem}
.strip .pill{padding:.2rem .75rem}
</style>
<style>


/* 搶答 */
.qzc{flex:1;padding:1.1rem 1.8rem;display:flex;flex-direction:column;gap:.8rem;justify-content:center;overflow:hidden}
.qzt{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.qzn{margin-left:auto;color:#999;font-weight:800;font-size:1.3rem}
.qzg{background:#7048e8;color:#fff;border-radius:999px;font-size:1.6rem;font-weight:900;padding:.2rem 1rem;margin-right:.4rem}
.qzg.fill{background:#1c7ed6}.qzg.q{background:#2b8a3e}.qzg.s{background:#ae3ec9}.qzg.ex{background:#e8384f}
.qzx{font-size:4.6rem;line-height:1.55}
.qzx .blank{display:inline-block;white-space:nowrap;border-bottom:5px solid var(--o);margin:0 .15em;min-width:1em;text-align:center;color:#e8590c}
.qzx .blank.ans{color:#2b8a3e;border-color:#37b24d;animation:pop .35s}
.qza{font-size:4.2rem;font-weight:900;color:#2b8a3e;display:flex;align-items:center;gap:.8rem;line-height:1.4}
.qza.long{font-size:3rem;font-weight:700;background:#ebfbee;border-radius:18px;padding:.5rem 1rem;display:block}
.qza .lab{font-size:1.8rem;background:#d3f9d8;border-radius:12px;padding:.25rem .8rem;color:#2b8a3e;flex:none}
.qzb{display:flex;gap:.7rem;flex-wrap:wrap}
/* 遊戲共用 */
.game{flex:1;position:relative;display:flex;flex-direction:column;overflow:hidden}
.gstart{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:1rem;text-align:center}
.gstart .gt{font-size:4rem;font-weight:900;color:#5c3a1e}
.gstart .gd{font-size:1.6rem;font-weight:800;color:#8a6a4a;line-height:1.5}
.gstart .row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.gstart .best{font-size:1.4rem;font-weight:900;color:#e67700}
.gbig{font-size:2.2rem!important;padding:.6rem 2.4rem!important}
.gend{position:absolute;inset:0;background:rgba(255,248,238,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:5;animation:fade .3s}
.gend .t1{font-size:3.4rem;font-weight:900;color:#5c3a1e}
.gend .t2{font-size:6rem;font-weight:900;color:#e8590c;line-height:1}
.gend .t3{font-size:1.6rem;font-weight:800;color:#8a6a4a}
.gend .stars{font-size:3.6rem;letter-spacing:.2em}
.ghud{display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;font-size:1.6rem;font-weight:900;color:#5c3a1e}
.ghud .gsc{margin-left:auto;background:#fff3bf;border-radius:999px;padding:.1rem 1rem;color:#e67700}
.tbar{height:.8rem;border-radius:99px;background:#f1e4cf;overflow:hidden;margin:0 1rem}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#51cf66,#fcc419,#ff6b6b);transition:width .1s linear}
/* 打地鼠 */
.mole{background:linear-gradient(#c3fae8,#d3f9d8 55%,#8ce99a 56%,#69db7c)}
.clue{flex:none;margin:.2rem 1rem .4rem;background:#fff;border-radius:22px;border:4px solid #8d5a2b;padding:.6rem 1.2rem;display:flex;align-items:center;gap:1rem;min-height:6rem;box-shadow:0 5px 0 #c8915e}
.clue .lab{flex:none;background:#8d5a2b;color:#fff;font-size:1.5rem;font-weight:900;border-radius:12px;padding:.2rem .7rem}
.clue .ct{font-size:3.2rem;font-weight:800;color:#3b2a1a;line-height:1.35}
.clue .ct.reveal{color:#2b8a3e}
.field{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:1rem 2rem;padding:.6rem 2rem 1.2rem;min-height:0}
.hole{position:relative;overflow:hidden;cursor:pointer}
.hole::after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:34%;border-radius:50%;background:radial-gradient(ellipse at center,#3b2314 55%,#6b4226 72%,#8d5a2b 100%);z-index:1}
.mol{position:absolute;left:50%;bottom:-110%;transform:translateX(-50%);transition:bottom .22s ease-out;display:flex;flex-direction:column;align-items:center;z-index:2;pointer-events:none}
.hole.up .mol{bottom:12%}
.mol .face{font-size:min(5rem,10vh);line-height:1}
.mol .sign{background:#fff9db;border:4px solid #c8915e;border-radius:16px;padding:.1rem .7rem;font-size:min(3.4rem,6.8vh);font-weight:900;color:#5c3a1e;white-space:nowrap;box-shadow:0 4px 0 #c8915e;margin-top:-.4rem}
.hole.hit .sign{background:#d3f9d8;border-color:#37b24d;color:#2b8a3e}
.hole.miss .sign{background:#ffe3e3;border-color:#fa5252;color:#c92a2a;animation:shake .35s}
.hole.hit .face::after{content:"💫"}
.bonk{position:absolute;z-index:4;font-size:3rem;font-weight:900;color:#e8590c;pointer-events:none;animation:up .9s forwards}
/* 樹與朋友 */
.fr{background:linear-gradient(#ebfbee,#fff9db)}
.frb{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;padding:.4rem 1.4rem 1.2rem;min-height:0}
.frcol{display:flex;flex-direction:column;gap:.9rem;justify-content:center;min-height:0}
.frcol h4{margin:0;text-align:center;font-size:2rem;font-weight:900;color:#5c3a1e}
.frc{position:relative;border:4px solid #e6e6e6;background:#fff;border-radius:20px;padding:.6rem 3.2rem .6rem 1.1rem;font-size:3rem;font-weight:800;line-height:1.35;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.06)}
.frc.tree{border-color:#b2f2bb}.frc.friend{border-color:#ffd8a8}
.frc.sel{border-color:var(--o);box-shadow:0 0 0 6px rgba(255,159,67,.3)}
.frc.done{cursor:default;box-shadow:none}
.frc .mno{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);width:2.3rem;height:2.3rem;border-radius:50%;color:#fff;display:grid;place-items:center;font:900 1.3rem 'PingFang TC',sans-serif;animation:pop .35s}
.frb.s2{display:flex;flex-direction:column;gap:1rem}
.frpool{display:flex;flex-wrap:wrap;gap:.9rem;justify-content:center;min-height:5rem;align-items:center}
.frchip{font-size:2.8rem;font-weight:800;background:#fff;border:4px solid #e0c98f;border-radius:18px;padding:.25rem 1rem;cursor:pointer;box-shadow:0 4px 0 #e0c98f;animation:fade .3s}
.frchip.sel{border-color:var(--o);box-shadow:0 0 0 6px rgba(255,159,67,.3)}
.frbins{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;min-height:0}
.frbin{border:5px dashed #ccc;border-radius:28px;display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:.8rem;cursor:pointer}
.frbin h3{margin:0;font-size:2.8rem;font-weight:900}
.frbin .in{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.frbin.t{border-color:#8ce99a;background:#f3fcf5}.frbin.t h3{color:var(--gd)}
.frbin.f{border-color:#fcc2d7;background:#fff0f6}.frbin.f h3{color:#c2255c}
.frbin .frchip{cursor:default;box-shadow:none;animation:pop .35s}
.frbin.t .frchip{border-color:#51cf66}.frbin.f .frchip{border-color:#f06595}
/* 首尾呼應 */
.echo{background:linear-gradient(#f3f0ff,#fff)}
.ecb{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;padding:.2rem 1.2rem 1rem;min-height:0}
.ecc{background:#fff;border-radius:22px;border:4px solid #d0bfff;padding:.8rem 1.2rem;display:flex;flex-direction:column;gap:.5rem;min-height:0;overflow:hidden}
.eclab{align-self:flex-start;background:var(--p);color:#fff;font-weight:900;font-size:1.5rem;border-radius:12px;padding:.15rem .8rem}
.ectx{font-size:3.4rem;line-height:1.75}
.ecs{border-radius:8px;padding:.04em 0;transition:background .2s}
.ecc:last-child .ecs{cursor:pointer}
.ecs.now{background:#ffe066;box-shadow:0 .12em 0 #f08c00;animation:glow 1.2s infinite}
@keyframes glow{50%{background:#fff3bf}}
.ecs.no{background:#ffc9c9;animation:shake .4s}
.ecs.ok{animation:none}
.eccmp{flex:none;margin:0 1.2rem 1rem;background:#fff;border-radius:22px;border:4px solid #8ce99a;padding:.7rem 1.2rem;display:flex;flex-direction:column;gap:.4rem;animation:fade .35s}
.echd{font-size:1.5rem;font-weight:900;color:var(--gd)}
.ecrow{font-size:2.3rem;font-weight:800;line-height:1.45}
.ecrow .t{display:inline-block;font:900 1.3rem 'PingFang TC',sans-serif;color:#fff;border-radius:10px;padding:.1rem .6rem;margin-right:.6rem;vertical-align:middle}
.ecrow .t.a{background:var(--b)}.ecrow .t.b{background:var(--o)}
.eccmp .row{display:flex;gap:.8rem;align-items:center;margin-top:.3rem}
.ecstar{font-size:2.4rem;margin-right:auto}
/* 閱讀理解大對決 */
.pk{background:linear-gradient(90deg,#e7f5ff 0,#e7f5ff 50%,#fff0f6 50%,#fff0f6 100%)}
.pkw{flex:1;display:grid;grid-template-columns:.62fr 2fr .62fr;grid-template-rows:minmax(0,1fr);gap:.8rem;padding:.8rem;min-height:0}
.side{display:flex;flex-direction:column;gap:.6rem;align-items:stretch;justify-content:center}
.side .who2{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:1.7rem;font-weight:900}
.side.L .who2{color:var(--boy)}.side.R .who2{color:var(--girl)}
.side .pts{font-size:5rem;font-weight:900;text-align:center;line-height:1}
.side.L .pts{color:var(--boy)}.side.R .pts{color:var(--girl)}
.lets{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.side .opt{border:4px solid #fff;border-radius:20px;font-size:3.2rem;font-weight:900;padding:.4rem 0;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.08);color:#444}
.side.L .opt{border-color:#a5d8ff;color:var(--boy)}.side.R .opt{border-color:#fcc2d7;color:var(--girl)}
.side .opt.ok{background:#d3f9d8;border-color:#37b24d;color:#2b8a3e;animation:pop .35s}
.side .opt.no{background:#ffe3e3;border-color:#fa5252;color:#c92a2a;animation:shake .35s}
.side.lock .opt{opacity:.4;pointer-events:none}
.mid{min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:.7rem;background:#fff;border-radius:24px;padding:.9rem 1.3rem;box-shadow:0 4px 0 #f0dfc6}
.mid>*{flex-shrink:0}
.mid .rd{font-size:1.3rem;font-weight:900;color:#999;text-align:center}
.dq{font-size:3rem;font-weight:800;line-height:1.45;color:#1d3557}
.dol{display:flex;flex-direction:column;gap:.45rem}
.do{display:flex;align-items:flex-start;gap:.7rem;font-size:2.3rem;line-height:1.4;border-radius:14px;padding:.2rem .5rem;font-weight:700;color:#333}
.do b{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:#f1f3f5;display:grid;place-items:center;font:900 .8em 'PingFang TC',sans-serif;margin-top:.05em}
.do.ok{background:#d3f9d8;color:#2b8a3e;animation:pop .35s}.do.ok b{background:#37b24d;color:#fff}
.skipb{align-self:center;border:0;background:#f1f3f5;color:#888;border-radius:999px;font-size:1.1rem;font-weight:900;padding:.25rem .9rem}
.mid .res{font-size:2rem;font-weight:900;color:#2b8a3e;min-height:2.6rem;text-align:center}
.pnum{display:inline-grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;color:#fff;font-size:1.3rem}
/* 生字 */
.zitabs{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.zitab{border:3px solid #e6e6e6;background:#fff;border-radius:999px;font-size:1.5rem;font-weight:900;padding:.3rem 1.1rem;color:#666;display:flex;align-items:center;gap:.5rem}
.zitab .cnt{font-size:1.05rem;background:#f1f3f5;border-radius:999px;padding:0 .5rem;color:#888}
.zitab.on{border-color:var(--o);background:#fff3e3;color:#c45f00}

  const bot=E('div','bot',null,W0);const db=E('button','big-btn','🎲 抽人',bot);tap(db,()=>doDraw());const nav=E('div','nav2',null,bot);const pv=E('button','big-btn gray','◀ 上一步',nav);const dots=E('div','dots',null,nav);const nx=E('button','big-btn g gbig','下一步 ▶',nav);
  tap(pv,()=>{if(li>0){li--;draw()}});tap(nx,()=>{li++;draw()});
  function draw(){exb.forEach((t,i)=>t.classList.toggle('on',i===lx));rb.classList.toggle('on',lx<0);
    const Q=lx>=0?Qmake(0,...EX[lx]):lQ;const L=LD(Q.d,Q.s),KL=LD(Q.bd,Q.bs);const S=stepsOf(Q,L);li=Math.max(0,Math.min(li,S.length-1));
    const st=stOf(S,li);const R=L.rows.length/2;const done=st.calc>=R;const B={bd:Q.bd,bs:Q.bs,bq:Q.bq};
    const FR=ldFrame(KL,L);
    kh.innerHTML=`<b>已知</b>${Q.bd} ÷ ${Q.bs} = ${Q.bq}`;drawLD(ksv,KL,{calc:99,hl:st.hl},FR,B);
    th.innerHTML=`<b>題目</b>${Q.d} ÷ ${Q.s} = <span class="q${done?' show':''}">${done?Q.q:'?'}</span>`;
    drawLD(tsv,L,st,FR,B);
    dots.innerHTML='';S.forEach((_,i)=>E('i',i<=li?'on':'',null,dots));pv.disabled=li===0;nx.disabled=li===S.length-1;
    requestAnimationFrame(()=>{fit([th],[th],1.4,el=>el.scrollWidth>el.clientWidth+1);fit([kh],[kh],1.4,el=>el.scrollWidth>el.clientWidth+1)})}
  draw();window.onresize=draw}

/* ================= 總整理:小數點怎麼跟著動 ================= */
/* 已知 552 ÷ 12 = 46。數字固定在原來的位置,只看小數點往哪裡跳:
   被除數往左 1 格 → 商也往左 1 格(跟著走);除數往左 1 格 → 商往右 1 格(反著走) */
const MV=[
 {k:'d',t:'被除數',c:'#1c7ed6',eq:['55.2','12','4.6'],dir:'左',qdir:'左',rule:'<div>被除數的小數點往左 1 格</div><div>→ 商的小數點<b>也往左</b> 1 格</div>',tag:'跟著走'},
 {k:'s',t:'除數',c:'#e8590c',eq:['552','1.2','460'],dir:'左',qdir:'右',rule:'<div>除數的小數點往左 1 格</div><div>→ 商的小數點<b>反而往右</b> 1 格</div>',tag:'反著走'}];
let smStep=store.get('dv3_sm',0);
function eqSVG(svg,rows,col,step){svg.innerHTML='';
  /* 欄位:被除數 4 格、除數 3 格、商 4 格;兩列的數字上下對齊,只有小數點在動 */
  const cw=60,G=[{x:10,n:4},{x:10+3*cw+80,n:3},{x:10+5*cw+160,n:4}],rh=120,W=10+8*cw+240;svg.setAttribute("viewBox",`0 0 ${W} ${rh*2+50}`);
  const defs=sv('defs',{},svg);const mk=sv('marker',{id:'am'+col.replace('#',''),viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:6,markerHeight:6,orient:'auto'},defs);sv('path',{d:'M0 0 L10 5 L0 10z',fill:col},mk);
  const dx=(g,i)=>G[g].x+i*cw+cw/2;
  rows.forEach((R,ri)=>{if(R.hide)return;const y=72+ri*rh;
    tx(svg,G[1].x-40,y,'÷',{fill:'#adb5bd','font-size':56});tx(svg,G[2].x-40,y,'=',{fill:'#adb5bd','font-size':56});
    R.cells.forEach((C,g)=>{if(!C)return;C.d.forEach((ch,i)=>tx(svg,dx(g,i),y,ch.c,{fill:ch.red?'#f03e3e':(ri===0?'#495057':'#1d3557'),'font-size':64}));
      const px=i=>G[g].x+(i+1)*cw;
      if(C.from!=null&&C.to!=null&&C.from!==C.to){sv('circle',{cx:px(C.from),cy:y+3,r:6,fill:'#ced4da'},svg);sv('circle',{cx:px(C.to),cy:y+3,r:9,fill:col},svg);
        if(C.arrow){const a=px(C.from),b=px(C.to);sv('path',{d:`M${a} ${y+18} Q${(a+b)/2} ${y+56} ${b} ${y+18}`,fill:'none',stroke:col,'stroke-width':5,'marker-end':`url(#am${col.replace('#','')})`},svg);
          tx(svg,(a+b)/2,y+78,C.lab,{fill:col,'font-size':26,'font-family':"'PingFang TC','Microsoft JhengHei',sans-serif"})}}
      else if(C.pt!=null)sv('circle',{cx:px(C.pt),cy:y+3,r:6,fill:'#ced4da'},svg)})})}
function pgSum(){const W0=E('div','smw',null,PG);
  const cards=MV.map(m=>{const c=E('div','card smc',null,W0);c.style.setProperty('--c',m.c);E('div','smh',`<b>${m.t}</b>的小數點往${m.dir}`,c);
    const box=E('div','svgbox',null,c);const g=sv('svg',{preserveAspectRatio:'xMidYMid meet'},box);const rule=E('div','smr',null,c);return {m,c,g,rule}});
  const kj=E('div','card smk',null,W0);
  const bot=E('div','bot smbot',null,W0);const db=E('button','big-btn','🎲 抽人',bot);tap(db,()=>doDraw());
  const nav=E('div','nav2',null,bot);const pv=E('button','big-btn gray','◀ 上一步',nav);const all=E('button','big-btn p','全部顯示',nav);const nx=E('button','big-btn g gbig','下一步 ▶',nav);
  const MAX=7;tap(pv,()=>{if(smStep>0){smStep--;draw()}});tap(nx,()=>{if(smStep<MAX){smStep++;draw()}});tap(all,()=>{smStep=MAX;draw()});
  const D=s=>[...s].map(c=>({c}));
  function draw(){store.set('dv3_sm',smStep);
    cards.forEach(({m,c,g,rule},ci)=>{const b=ci*3;/* 這張卡片從第 b+1 步開始 */const k=smStep-b;
      const base={cells:[{d:D('552'),pt:2},{d:D('12'),pt:1},{d:D('46'),pt:1}]};
      let row2={hide:k<1,cells:[null,null,null]};
      if(m.k==='d'){row2.cells[0]={d:D('552'),from:2,to:1,arrow:true,lab:'往左 1 格'};row2.cells[1]={d:D('12'),pt:1};
        row2.cells[2]=k>=2?{d:D('46'),from:1,to:0,arrow:true,lab:'也往左 1 格'}:null}
      else{row2.cells[0]={d:D('552'),pt:2};row2.cells[1]={d:D('12'),from:1,to:0,arrow:true,lab:'往左 1 格'};
        row2.cells[2]=k>=2?{d:[{c:'4'},{c:'6'},{c:'0',red:true}],from:1,to:2,arrow:true,lab:'反而往右 1 格'}:null}
      eqSVG(g,[base,row2],m.c,k);
      rule.innerHTML=k>=3?`<span class="rt">${m.rule}</span><span class="tg">${m.tag}</span>`:'';c.classList.toggle('now',k>=1&&k<=3);c.classList.toggle('dim',k<1&&smStep>0&&ci>0)});
    kj.innerHTML=smStep>=MAX?'<div class="k1">被除數<span style="color:#1c7ed6">跟著走</span>，除數<span style="color:#e8590c">反著走</span></div><div class="k2">兩個一起往左 1 格 → 互相抵消，商不動：55.2 ÷ 1.2 = 46</div>':'<div class="k0">📌 口訣</div>';
    kj.classList.toggle('show',smStep>=MAX);pv.disabled=smStep===0;nx.disabled=smStep===MAX;
    requestAnimationFrame(()=>{fit([...cards.map(x=>x.rule),...kj.children],[...cards.map(x=>x.c),kj],1.3);const rs=cards.map(x=>x.rule);fit(rs,rs,1.1,e=>e.scrollWidth>e.clientWidth+1)})}
  draw();window.onresize=draw}

/* ================= 2 抽籤考考你 ================= */
let pMode=store.get('dv3_pm',0),pN=0;
function pgPrac(){const W0=E('div','pw',null,PG);const P=E('div','card pl',null,W0);const R=E('div','card pr',null,W0);
  const top=E('div','ptop',null,P);const mb=[['552 ÷ 12 這一組',0],['其他算式',1]].map(([t,k])=>{const b=E('button','pill num'+(k===pMode?' on':''),t,top);tap(b,()=>{pMode=k;store.set('dv3_pm',k);mb.forEach(x=>x.classList.toggle('on',x===b));pN=0;newQ()});return b});
  const pr=E('span','pprog',null,top);
  const gv=E('div','given num',null,P);const bq=E('div','bigq num',null,P);bq.style.whiteSpace='nowrap';const ops=E('div','popts num',null,P);
  const act=E('div','actrow',null,P);const db=E('button','big-btn','🎲 抽人回答',act);tap(db,()=>doDraw());const ck=E('button','big-btn g','✔ 對答案',act);const nb=E('button','big-btn','下一題 ▶',act);
  let Q,O,pk,done;
  function newQ(){let q;do{q=Qrand(pMode?1+Math.floor(Math.random()*(BASE.length-1)):0)}while(Q&&q.d===Q.d&&q.s===Q.s);Q=q;O=Qopts(Q);pk=null;done=false;pN++;draw()}
  function draw(){pr.textContent=`第 ${pN} 題`;gv.innerHTML=`<b>已知</b>${Q.bd} ÷ ${Q.bs} = ${Q.bq}`;bq.innerHTML=`${Q.d} ÷ ${Q.s} = <span class="q${done?' show':''}">${done?Q.q:'?'}</span>`;
    ops.innerHTML='';const LT='ABCD';O.forEach((o,i)=>{const b=E('button','po',`<i>${LT[i]}</i>${o.t}`,ops);if(done){if(o.ok)b.classList.add('ok');else if(o===pk)b.classList.add('no');else b.classList.add('dim')}else if(o===pk)b.classList.add('sel');
      tap(b,()=>{if(done)return;pk=o;draw()})});
    R.innerHTML='';if(!done)E('div','empty','對答案後<br>這裡會出現直式',R);
    else{const L=LD(Q.d,Q.s);const box=E('div','svgbox',null,R);const g=sv('svg',{preserveAspectRatio:'xMidYMin meet'},box);drawLD(g,L,{shift:L.sk>0,qpoint:true,calc:99,hl:-1},null,{bd:Q.bd,bs:Q.bs,bq:Q.bq})}
    ck.disabled=done;requestAnimationFrame(()=>{fit([gv,bq,...ops.children],[P],1.4);fit([bq],[bq],1.6,el=>el.scrollWidth>el.clientWidth+1);})}
  tap(ck,()=>{if(done)return;done=true;draw()});tap(nb,newQ);
  newQ();window.onresize=draw}

/* ================= 3 大對決(PK) ================= */
function endScreen(g,{t1,big,t3,award,again}){const e=E('div','gend',null,g);E('div','t1',t1,e);E('div','t2',big,e);if(t3)E('div','t3',t3,e);
  const row=E('div','row',null,e);row.style.display='flex';row.style.gap='.8rem';
  (award||[]).forEach(([n,pts])=>{if(!n||!pts)return;const b=E('button','big-btn g',`⭐ 給 ${n} 號 +${pts}`,row);tap(b,()=>{addScore(n,pts,b);b.disabled=true;b.textContent=`✔ ${n} 號 已加 ${pts} 分`})});
  const a=E('button','big-btn',again||'再玩一次',row);return a}
function pgDuel(){const g=E('div','card game pk',null,PG);let timers=[];const clearAll=()=>{timers.forEach(clearTimeout);timers=[]};cleanup=clearAll;
  let pl={L:null,R:null};const LET='ABCD';
  function intro(){clearAll();g.innerHTML='';const s=E('div','gstart',null,g);E('div','gt','⚔️ 商怎麼變大對決',s);E('div','gd','藍、粉兩位同學 PK！<br>看已知的算式，搶先按下正確答案，共 10 題',s);
    const row0=E('div','row',null,s);const lab=E('div','gd',null,s);
    const paint=()=>{lab.innerHTML=`<span style="color:var(--boy)">藍方 ${pl.L?pl.L+' 號':'—'}</span>　vs　<span style="color:var(--girl)">粉方 ${pl.R?pl.R+' 號':'—'}</span>`};paint();
    const d=E('button','big-btn','🎲 抽兩位選手',row0);tap(d,()=>{pl.L=takeOne();pl.R=takeOne();save();paintWho();paint()});
    const st=E('button','big-btn g gbig','▶ 開始',row0);tap(st,play)}
  function play(){clearAll();g.innerHTML='';const w=E('div','pkw',null,g);const sides={};
    const mk=k=>{const sd=E('div','side '+k,null,w);E('div','who2',`${k==='L'?'藍方':'粉方'}${pl[k]?`<span class="pnum" style="background:var(--${k==='L'?'boy':'girl'})">${pl[k]}</span>`:''}`,sd);
      const pts=E('div','pts','0',sd);const lets=E('div','lets',null,sd);const opts=[0,1,2,3].map(i=>E('button','opt',LET[i],lets));sides[k]={sd,pts,opts,score:0}};
    mk('L');const mid=E('div','mid',null,w);const rd=E('div','rd',null,mid);const qq=E('div','dq num',null,mid);const ol=E('div','dol',null,mid);const res=E('div','res',null,mid);const skip=E('button','skipb','⏭ 看答案',mid);mk('R');
    tap(skip,()=>{if(done)return;done=true;res.textContent=`答案是 ${LET[ans]}`;reveal();timers.push(setTimeout(nextQ,2600))});
    const qs=[];for(let i=0;i<10;i++){let q;do{q=Qrand(i<4?0:undefined)}while(qs.some(x=>x.d===q.d&&x.s===q.s));qs.push(q)}
    let qi=-1,done=false,ans=0;
    function nextQ(){qi++;if(qi>=qs.length)return end();const Q=qs[qi];done=false;rd.textContent=`第 ${qi+1} / ${qs.length} 題`;
      qq.innerHTML=`<span class="gv">已知 ${Q.bd} ÷ ${Q.bs} = ${Q.bq}</span>${Q.d} ÷ ${Q.s} = ?`;res.textContent='';
      const O=shuffle(Qopts(Q));ans=O.findIndex(o=>o.ok);ol.innerHTML='';O.forEach((o,i)=>E('div','do',`<b>${LET[i]}</b><span>${o.t}</span>`,ol));
      Object.values(sides).forEach(sd=>{sd.sd.classList.remove('lock');sd.opts.forEach(b=>b.className='opt')});
      requestAnimationFrame(()=>fit([qq,...ol.children],[mid],1.3))}
    function reveal(){ol.children[ans].classList.add('ok');Object.values(sides).forEach(x=>x.opts[ans].classList.add('ok'))}
    Object.entries(sides).forEach(([k,sd])=>sd.opts.forEach((b,i)=>tap(b,()=>{if(done||sd.sd.classList.contains('lock'))return;
      if(i===ans){done=true;b.classList.add('ok');sd.score++;sd.pts.textContent=sd.score;res.textContent=`${k==='L'?'藍方':'粉方'}答對！`;reveal();timers.push(setTimeout(nextQ,2200))}
      else{b.classList.add('no');sd.sd.classList.add('lock');
        if(Object.values(sides).every(x=>x.sd.classList.contains('lock'))){done=true;res.textContent=`答案是 ${LET[ans]}`;reveal();timers.push(setTimeout(nextQ,2600))}}})));
    function end(){const a=sides.L.score,b=sides.R.score;const win=a>b?'L':b>a?'R':null;const aw=win?[[pl[win],1]]:[[pl.L,1],[pl.R,1]];
      const btn=endScreen(g,{t1:win?`🏆 ${win==='L'?'藍方':'粉方'}獲勝！`:'🤝 平手！',big:`${a} : ${b}`,t3:'藍方 vs 粉方',award:aw,again:'再來一局'});tap(btn,()=>{pl={L:null,R:null};intro()})}
    nextQ()}
  intro()}

paintWho();
const sp=store.get('dv3_page','learn');go(PAGES[sp]?sp:'learn');
})();
