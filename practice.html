<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>六上數學 第1～4單元 複習練習</title>
<style>
:root{--g:#22b573;--gd:#0c8a50;--o:#ff922b;--bg:#fff9f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);font-family:'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;color:#333;overflow:hidden;user-select:none}
#app{display:grid;grid-template-columns:12.5rem 1fr;height:100%}
nav{background:#fff;border-right:3px solid #f1e3cf;display:flex;flex-direction:column;gap:.5rem;padding:.7rem .6rem}
.tt{font-size:1rem;font-weight:900;color:#999;padding:.1rem .4rem .2rem}.tt b{display:block;font-size:1.4rem;color:var(--g);line-height:1.25}
.lv{border:4px solid #eee;border-radius:18px;padding:.45rem .65rem;cursor:pointer;background:#fff}
.lv .n{font-size:1.45rem;font-weight:900;color:#555}.lv .s{font-size:1rem;color:#888;font-weight:800;line-height:1.25}
.lv .bar{height:.5rem;border-radius:9px;background:#f1f3f5;margin-top:.3rem;overflow:hidden}.lv .bar i{display:block;height:100%;width:0;transition:width .3s;background:var(--c)}
.lv .c{font-size:.95rem;color:#888;font-weight:800;margin-top:.15rem;min-height:1.1em}
.lv.on{border-color:var(--c);background:var(--cb)}.lv.on .n{color:var(--c)}
.lv.u0{--c:#22b573;--cb:#e6fcf5}.lv.u1{--c:#1c7ed6;--cb:#e7f5ff}.lv.u2{--c:#f76707;--cb:#fff4e6}.lv.u3{--c:#d6336c;--cb:#fff0f6}
.lv.u4{--c:#7048e8;--cb:#e5dbff;background:linear-gradient(135deg,#fff,#f3f0ff)}
.sp{flex:1}
#fs{border:3px solid #e9ecef;background:#fff;border-radius:14px;font-size:1rem;font-weight:900;color:#888;padding:.4rem}
main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:.6rem .8rem .7rem;gap:.55rem}
#top{display:flex;align-items:center;gap:.6rem}
#qno{flex:none;background:var(--g);color:#fff;font-weight:900;font-size:1.4rem;border-radius:14px;padding:.25rem .8rem}
#utag{flex:none;font-weight:900;font-size:1.1rem;border-radius:12px;padding:.2rem .6rem;border:3px solid currentColor}
#dots{display:flex;gap:.3rem;margin-left:auto}#dots i{width:1.1rem;height:1.1rem;border-radius:50%;background:#e9ecef}
#dots i.cur{outline:3px solid var(--o);outline-offset:2px}#dots i.ok{background:var(--g)}#dots i.ok2{background:#94d82d}#dots i.no{background:#ffa8a8}
#q{font-size:1.9rem;font-weight:900;line-height:1.5;background:#fff;border-radius:20px;padding:.45rem 1rem;box-shadow:0 4px 0 #f1e3cf}
#q .num{color:#1c7ed6}
#body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 24rem;gap:.7rem}
.card{background:#fff;border-radius:22px;box-shadow:0 4px 0 #f1e3cf;min-height:0}
#figc{display:flex;flex-direction:column;padding:.5rem;overflow:auto}
#fig{flex:1;min-height:0;width:100%}
#bigc{flex:1;min-height:5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem}
#figc.solv #bigc{flex:none;min-height:0;padding:.3rem 0}
#figc.solv .bx{font-size:2.6rem}#figc.solv .bx.s{font-size:1.7rem}
.bx{font-size:4.2rem;font-weight:900;color:#333;text-align:center;line-height:1.35}
.bx.s{font-size:2.3rem;color:#555}.bx:not(.s){white-space:nowrap}
.cq{color:var(--o)}
#steps{display:flex;flex-direction:column;gap:.25rem;padding:0 .6rem .3rem}
#steps>div{font-size:1.55rem;font-weight:900;animation:fade .3s;line-height:1.55}
#steps .fr{font-size:.92em}#steps .h{color:#7048e8}#steps .sol{color:#2b8a3e}
/* 直式分數 */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.1;font-size:.82em}
.fr i{font-style:normal;padding:0 .18em}.fr i:first-child{border-bottom:.09em solid currentColor}
/* 短除法 */
.sd{border-collapse:collapse;margin:.2rem 0 .2rem 1rem;font-size:1.55rem;font-weight:900;color:#333}
.sd td{padding:.05rem .55rem;text-align:center;min-width:2.2em}
.sd td.p{color:#e8590c;text-align:right;min-width:1.4em}
.sd tr:not(:last-child) td.p{border-right:3px solid #333}
.sd tr:not(:last-child) td.n{border-bottom:3px solid #333}
/* 作答 */
#ansc{display:flex;flex-direction:column;gap:.55rem;padding:.8rem;min-height:0}
#ansline{display:flex;align-items:center;gap:.5rem;font-size:1.7rem;font-weight:900;color:#555;justify-content:center;white-space:nowrap}
#unit{flex:none}#ansline .pre{color:#888}
.ib{min-width:0;height:1.8em;border:4px solid #dee2e6;border-radius:16px;background:#fff8ef;display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:#d9480f;font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif}
#box{flex:1;max-width:9em;border-color:var(--o)}
#fbx{display:none;align-items:center;gap:.4rem}
#fbx .ib{width:3.4em;height:1.45em;font-size:2rem;cursor:pointer}
#fbx .stk{display:flex;flex-direction:column;align-items:center;gap:.25rem}
#fbx .stk hr{width:100%;border:0;border-top:5px solid #555;margin:0}
#fbx .ib.act{border-color:var(--o);box-shadow:0 0 0 .25rem rgba(255,146,43,.25)}
#bw{width:2.4em!important}
.frmode #fbx{display:flex}.frmode #box{display:none}
.ib.ok{border-color:#37b24d!important;background:#d3f9d8;color:#2b8a3e}
.ib.no,#fbx.no .ib{border-color:#fa5252;background:#ffe3e3;animation:shake .4s}
#rev{display:none;font-size:2.4rem;font-weight:900;color:#2b8a3e;background:#d3f9d8;border:4px solid #37b24d;border-radius:16px;padding:.1rem .8rem}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
#fb{min-height:2.4rem;font-size:1.4rem;font-weight:900;text-align:center;line-height:1.3}
#fb.good{color:#2b8a3e}#fb.bad{color:#e03131}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;flex:1;min-height:0}
#pad button{border:0;border-radius:14px;background:#f1f3f5;font:900 1.9rem 'Avenir Next','Helvetica Neue',Arial,sans-serif;color:#444;box-shadow:0 4px 0 #dee2e6;min-height:2.6rem}
#pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #dee2e6}
#pad .del{background:#fff0f0;color:#e03131}
#pad .nx{background:#fff4e6;color:#e8590c;font-family:inherit;font-size:1.35rem}
#pad .ck{grid-column:span 2;background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd);font-family:inherit;font-size:1.7rem}
#opts{display:none;flex:1;min-height:0;flex-direction:column;gap:.6rem;justify-content:center}
#opts.row{flex-direction:row}
#opts button{flex:1;max-height:6rem;border:4px solid #e9ecef;background:#fff;border-radius:18px;font:900 2rem 'PingFang TC','Microsoft JhengHei',sans-serif;color:#444;box-shadow:0 4px 0 #dee2e6;padding:.3rem}
#opts.row{align-items:center}#opts.row button{font-size:3rem;max-height:9rem;height:100%;min-height:5rem}
#opts button.no{border-color:#ffa8a8;background:#fff5f5;color:#e03131;opacity:.6}
#opts button.ok{border-color:#37b24d;background:#d3f9d8;color:#2b8a3e}
.chmode #opts{display:flex}.chmode #pad,.chmode #ansline{display:none}
#acts{display:flex;gap:.5rem}
#acts button{flex:1;border:4px solid #e9ecef;background:#fff;border-radius:16px;font:900 1.4rem 'PingFang TC','Microsoft JhengHei',sans-serif;color:#666;padding:.35rem}
#acts .hint{border-color:#d0bfff;color:#7048e8}#acts .hint.pulse{animation:pl 1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 .4rem rgba(112,72,232,.25)}}
#acts .next{background:var(--o);border-color:var(--o);color:#fff;box-shadow:0 4px 0 #e8590c}
#acts button:disabled{opacity:.35}
#acts .hide{display:none}
/* 結算 */
#end{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:5;padding:1rem}
#end.on{display:flex}
#end .box{background:#fff;border-radius:28px;padding:1.4rem 2rem;text-align:center;min-width:min(26rem,100%);animation:fade .3s}
#end h2{margin:.2rem 0 .5rem;font-size:2.3rem}
#end .big{font-size:4rem;font-weight:900;color:var(--g)}
#end .st{font-size:2.6rem;color:#f59f00;letter-spacing:.15em}
#end .sub{font-size:1.35rem;color:#777;font-weight:800;margin:.3rem 0 1rem}
#end button{border:0;border-radius:18px;font:900 1.5rem 'PingFang TC','Microsoft JhengHei',sans-serif;padding:.5rem 1.2rem;margin:.3rem;background:#f1f3f5;color:#555}
#end button.go{background:var(--o);color:#fff;box-shadow:0 4px 0 #e8590c}
svg text{font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:8px;stroke-linejoin:round}
@media (max-width:1100px){#body{grid-template-columns:1fr 20rem}#rev{font-size:2rem}#q{font-size:1.65rem}#steps>div{font-size:1.35rem}.bx{font-size:3.4rem}}
@media (max-width:900px),(orientation:portrait){html,body{overflow:visible;height:auto;min-height:100%}#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100%}
 nav{flex-direction:row;border-right:0;border-bottom:3px solid #f1e3cf;padding:.4rem;gap:.3rem;position:sticky;top:0;z-index:3}.tt,.sp,#fs,.lv .s{display:none}
 .lv{flex:1;padding:.3rem .2rem;text-align:center;border-width:3px;border-radius:14px}.lv .n{font-size:1.1rem}.lv .c{font-size:.75rem}.lv .bar{margin-top:.2rem}
 main{padding:.5rem}#body{grid-template-columns:1fr;grid-template-rows:auto auto}#figc{min-height:0;overflow:visible}#bigc{min-height:7rem;padding:.6rem 0}#fig{height:min(42vh,22rem);flex:none}

 .bx{font-size:2.4rem}.bx.s{font-size:1.5rem}#steps>div{font-size:1.2rem}.sd{font-size:1.25rem}#opts button{font-size:1.5rem}#opts.row button{font-size:2.4rem;min-height:4rem}
 #figc.solv .bx{font-size:2rem}#figc.solv .bx.s{font-size:1.3rem}}

/* 答錯時的例題教學 */
#teach{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:6;padding:.8rem}
#teach.on{display:flex}
#teach .tbox{background:#fff;border-radius:26px;padding:1rem 1.4rem 1.1rem;width:min(56rem,100%);max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:.5rem;animation:fade .3s;border:5px solid #d0bfff}
.ttag{align-self:flex-start;background:#7048e8;color:#fff;font-weight:900;font-size:1.4rem;border-radius:14px;padding:.2rem .9rem}
#tmsg{font-size:1.45rem;font-weight:900;color:#e03131;min-height:0}#tmsg:empty{display:none}
#tq{font-size:1.75rem;font-weight:900;line-height:1.5;background:#f8f9fa;border-radius:16px;padding:.4rem .8rem}#tq .num{color:#7048e8}
#tfig{width:100%;height:min(30vh,15rem)}
#tbig .bx{font-size:3rem}#tbig .bx.s{font-size:1.8rem}#tbig:empty{display:none}
#tsol{display:flex;flex-direction:column;gap:.3rem;min-height:2rem}

#tsol .fr{font-size:.92em}#tsol .ans{color:#7048e8;border-top:3px dashed #d0bfff;padding-top:.3rem}
#tbtn{align-self:flex-end;border:0;border-radius:18px;background:#7048e8;color:#fff;font-size:1.6rem;font-weight:900;padding:.5rem 1.4rem;box-shadow:0 4px 0 #5f3dc4}
#tbtn.go{background:var(--o);box-shadow:0 4px 0 #e8590c}
@media (max-width:900px),(orientation:portrait){#tq{font-size:1.3rem}#tsol>div{font-size:1.25rem}#tbig .bx{font-size:2.2rem}#tbtn{font-size:1.3rem}.ttag{font-size:1.1rem}}
</style></head><body>
<div id="app">
<nav id="nav"><div class="tt">六上數學<b>第1～4單元<br>複習練習</b></div></nav>

 <div id="top"><span id="qno">第 1 題</span><span id="utag"></span><span id="dots"></span></div>

</main>
</div>

  tx(g,x+s/2,y+s/2+14,'？',{fill:O,'font-size':60});tx(g,x+s/2,y+s+50,`正方形面積 ${S}`,{fill:B,'font-size':36})},

      ['bw','bn','bd'].forEach(id=>$('#'+id).classList.add('ok'));right(q);return}
    F2.className='';void F2.offsetWidth;F2.className='no';wrong(trapMsg(q,v));return}
  if(val===''||val==='.')return;const v=+val,box=$('#box');
  if(near(v,q.ans)){box.className='ib ok';right(q);return}
  box.className='ib';void box.offsetWidth;box.className='ib no';wrong(trapMsg(q,v))}
function choose(b,o){if(solved||b.classList.contains('no'))return;const q=round.qs[cur];
  if(o===q.ans){b.classList.add('ok');right(q);return}
  b.classList.add('no');wrong(q.trapsMC&&q.trapsMC[o]);
  const left=[...$('#opts').children].filter(x=>!x.classList.contains('no')).length;if(!solved&&left<=1){round.res[cur]='no';finish(q,false)}}
function finish(q,ok){solved=true;$('#hint').disabled=true;$('#hint').classList.remove('pulse');$('#show').classList.add('hide');paintF();
  $('#figc').classList.add('solv');fitBig();[...$('#steps').querySelectorAll('.h')].forEach(e=>e.remove());q.sol.forEach(s=>addStep(s,'sol'));
  if(!ok){const fb=$('#fb');fb.className='bad';fb.textContent='正確答案在這裡，看懂算式再下一題';
    if(q.type==='mc'){[...$('#opts').children].forEach(b=>{if(b.textContent===q.ans)b.classList.add('ok')})}
    else{$('#box').style.display='';const r=$('#rev');r.innerHTML=q.type==='frac'?mx(q.ans.n,q.ans.d):f(q.ans);r.style.display='inline-block';$('#box').className='ib';$('#box').style.display='none';$('#fbx').style.display='none'}}
  $('#next').disabled=false;$('#next').textContent=cur===N-1?'看結果 ▶':'下一題 ▶';paintDots();paintNav();
  setTimeout(()=>{const s=$('#steps').lastElementChild;if(s&&s.scrollIntoView)s.scrollIntoView({block:'nearest'})},50)}
function nextQ(){if(!solved)return;$('#box').style.display='';$('#fbx').style.display='';if(cur<N-1){cur++;show()}else end()}
function end(){const r=round.res,first=r.filter(x=>x==='ok').length,all=r.filter(x=>x==='ok'||x==='ok2').length;
  if(first>best[lvl]){best[lvl]=first;try{localStorage.setItem('rv14_best',JSON.stringify(best))}catch(e){}}
  $('#endt').textContent=`${UNITS[lvl].mix?'綜合複習':UNITS[lvl].sub}　完成！`;$('#ends').textContent=first>=9?'⭐⭐⭐':first>=7?'⭐⭐':first>=5?'⭐':'💪';
  $('#endn').textContent=`${first} / ${N}`;$('#endsub').textContent=`一次就答對 ${first} 題，全部答對 ${all} 題`;
  const Bx=$('#endb');Bx.innerHTML='';const mb=(t,fn,c)=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.addEventListener('pointerdown',e=>{e.preventDefault();$('#end').classList.remove('on');fn()});Bx.appendChild(b)};
  mb('再練一回',()=>newRound());if(lvl<4)mb(`${UNITS[lvl+1].name.replace('★ ','')} ▶`,()=>{lvl++;newRound()},'go');
  $('#end').classList.add('on');paintNav()}
newRound();
</script>
