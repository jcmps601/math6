<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>601 挑戰樂園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{
  --ink:#24324a; --sky1:#6f7cf5; --sky2:#b07cf0; --card:#fff;
  --easy:#2fb36d; --normal:#2f8cf0; --hard:#f28a1c; --boss:#9b3fe0;
}
*{box-sizing:border-box; margin:0; padding:0}
[hidden]{display:none!important}
html,body{height:100%; overflow:hidden}
body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(160deg,var(--sky1),var(--sky2)); user-select:none; -webkit-user-select:none;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none}
img,canvas{-webkit-user-drag:none}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; touch-action:manipulation}
.screen{position:fixed; inset:0; display:none}
.screen.on{display:flex}

/* 背景小星星 */
.bgstars{position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(2px 2px at 12% 18%,#fff8,transparent),radial-gradient(3px 3px at 78% 12%,#fff9,transparent),
  radial-gradient(2px 2px at 40% 70%,#fff7,transparent),radial-gradient(3px 3px at 88% 64%,#fff8,transparent),
  radial-gradient(2px 2px at 22% 86%,#fff6,transparent),radial-gradient(2px 2px at 60% 30%,#fff7,transparent)}

/* 右上角：音樂開關 */
.corner{position:fixed; top:14px; right:16px; z-index:50; display:flex; gap:10px}
.rbtn{width:56px; height:56px; border-radius:50%; background:#fff; font-size:28px; display:grid; place-items:center;
  box-shadow:0 4px 0 #0002,0 6px 18px #0002}
.rbtn.off{opacity:.55}
.rbtn:active{transform:translateY(2px); box-shadow:0 2px 0 #0002}

/* ── 首頁 ── */
#home{flex-direction:column; align-items:center; justify-content:center; gap:3.4vh; z-index:1}
.logo{font-weight:900; color:#fff; font-size:clamp(32px,min(5.6vw,9vh),70px); letter-spacing:.06em;
  text-shadow:0 5px 0 #0003,0 0 30px #fff6}
.logo b{display:inline-block; background:#ff5c8a; color:#fff; border-radius:.4em; padding:0 .25em; margin-right:.2em;
  box-shadow:0 5px 0 #c2305c}
.cards{display:grid; grid-template-columns:repeat(6,auto); gap:2.2vh 1.4vw; justify-content:center}
.gcard{width:clamp(130px,14.2vw,220px); background:var(--card); border-radius:28px; padding:2vh 1.4vw 1.6vh;
  display:flex; flex-direction:column; align-items:center; gap:1.4vh; box-shadow:0 10px 0 #0002,0 18px 40px #0003;
  transition:transform .15s}
.gcard:hover{transform:translateY(-6px) rotate(-1deg)}
.gcard:active{transform:translateY(3px)}
.gcard .ic{font-size:clamp(46px,min(5.6vw,9vh),90px); line-height:1.1; filter:drop-shadow(0 6px 0 #0001)}
.gcard .nm{font-size:clamp(15px,min(1.7vw,4vh),30px); font-weight:900; white-space:nowrap}
.gcard.t .nm{color:#1c8f83} .gcard.c .nm{color:#c62b3a} .gcard.f .nm{color:#d98a00} .gcard.h .nm{color:#9c6420} .gcard.n .nm{color:#2f6fd6} .gcard.s .nm{color:#7048e8} .gcard.k .nm{color:#e8590c} .gcard.x .nm{color:#d6336c} .gcard.d .nm{color:#d9661a} .gcard.b .nm{color:#5f3dc4} .gcard.m .nm{color:#2b8a3e} .gcard.g .nm{color:#e67700}
.t2048{display:inline-grid; place-items:center; width:1em; height:1em; border-radius:.18em; background:linear-gradient(160deg,#ffa94d,#e8590c); color:#fff; box-shadow:inset 0 -.06em 0 #0003}
.t2048::after{content:'2048'; font-size:.3em; font-weight:900; font-family:'Noto Sans TC',system-ui,sans-serif; letter-spacing:-.02em}
.gcard .bests{display:flex; flex-wrap:wrap; justify-content:center; gap:4px 12px; font-size:clamp(15px,1.5vw,21px); font-weight:700; color:#8a93a6; min-height:1.3em}
.gcard .bests span{display:flex; align-items:center; gap:2px}
.gcard .bests i{font-style:normal; color:#f4b400; letter-spacing:-1px; margin-left:2px}
.mini{position:relative; display:block; width:clamp(56px,min(6.4vw,10.5vh),104px); aspect-ratio:1}
.mini .mc{position:absolute; left:14%; width:72%; height:66%; top:2%; transform:rotate(-12deg)}
.mini .mc::before{content:''; position:absolute; inset:0; background:linear-gradient(90deg,#9e1a22 0%,#d62c35 22%,#ff7b7b 46%,#ef4a4f 58%,#b8202a 100%);
  clip-path:polygon(15% 0,85% 0,100% 100%,0 100%)}
.mini .mc::after{content:''; position:absolute; left:-3%; right:-3%; bottom:0; height:13%; border-radius:4px; background:linear-gradient(90deg,#c4303a,#ffd0d0 45%,#d9464e)}
.mini .ms{position:absolute; left:50%; bottom:2%; width:40%; aspect-ratio:1; transform:translateX(-50%);
  background:linear-gradient(160deg,#fff6c8,#f6c948 50%,#c99212);
  clip-path:polygon(50% 2%,61.8% 35.5%,97.5% 35.5%,68.5% 57%,79.4% 91%,50% 70%,20.6% 91%,31.5% 57%,2.5% 35.5%,38.2% 35.5%)}
.gcard:hover .mini .mc{transform:rotate(-16deg) translateY(-6%)}
.dot{width:12px; height:12px; border-radius:50%; display:inline-block}

/* ── 選難度 ── */
#diff{flex-direction:column; align-items:center; justify-content:center; gap:3.4vh; z-index:1}
.dtitle{display:flex; align-items:center; gap:16px; color:#fff; font-weight:900; font-size:clamp(30px,4.6vw,56px);
  text-shadow:0 4px 0 #0003}
.dtitle .ic{font-size:1.3em}
.dgrid{display:grid; grid-template-columns:repeat(4,clamp(150px,19vw,250px)); gap:2.2vw}
.dbtn{border-radius:28px; padding:3vh 1vw 2.4vh; color:#fff; display:flex; flex-direction:column; align-items:center; gap:1vh;
  box-shadow:0 9px 0 #0003,0 16px 30px #0003; transition:transform .12s}
.dbtn:hover{transform:translateY(-5px)}
.dbtn:active{transform:translateY(4px); box-shadow:0 4px 0 #0003}
.dbtn .ic{font-size:clamp(50px,6.4vw,84px); line-height:1.1}
.dbtn .nm{font-size:clamp(26px,3vw,40px); font-weight:900; text-shadow:0 3px 0 #0002}
.dbtn .st{font-size:clamp(20px,2.2vw,30px); letter-spacing:2px; color:#fff6}
.dbtn .st b{color:#ffe14d; font-weight:400; text-shadow:0 0 8px #ffd00099}
.dbtn .bs{font-size:clamp(13px,1.3vw,17px); font-weight:700; opacity:.9; min-height:1.3em}
.d-easy{background:linear-gradient(180deg,#45cf86,var(--easy))}
.d-normal{background:linear-gradient(180deg,#56a7ff,var(--normal))}
.d-hard{background:linear-gradient(180deg,#ffa940,var(--hard))}
.d-boss{background:linear-gradient(180deg,#c06bff,var(--boss)); position:relative}
.d-boss::after{content:''; position:absolute; inset:-4px; border-radius:32px; border:3px solid #ffe14d; opacity:.7;
  animation:bossglow 1.4s ease-in-out infinite alternate; pointer-events:none}
@keyframes bossglow{to{opacity:.15; inset:-9px}}
.back{position:fixed; top:14px; left:16px; z-index:50; height:56px; padding:0 22px 0 16px; border-radius:999px; background:#fff;
  font-size:24px; font-weight:900; display:flex; align-items:center; gap:6px; box-shadow:0 4px 0 #0002,0 6px 18px #0002}
.back:active{transform:translateY(2px)}

/* ── 遊戲畫面 ── */
#game{flex-direction:column; z-index:1}
.hud{height:84px; flex:none; display:flex; align-items:center; gap:14px; padding:0 90px 0 16px}
.hud .back{position:static}
.chip{height:52px; border-radius:999px; padding:0 20px; display:flex; align-items:center; gap:8px; color:#fff;
  font-size:24px; font-weight:900; box-shadow:0 4px 0 #0002}
.hud .grow{flex:1}
.stat{height:60px; min-width:150px; border-radius:20px; background:#fff; padding:0 18px; display:flex; align-items:center;
  justify-content:center; gap:8px; font-size:34px; font-weight:900; box-shadow:0 4px 0 #0002; font-variant-numeric:tabular-nums}
.stat small{font-size:20px; color:#8a93a6}
.stat.warn{color:#e5383b; animation:warn .5s ease-in-out infinite alternate}
@keyframes warn{to{transform:scale(1.08)}}
.rdots{display:flex; gap:10px; background:#fff; border-radius:20px; height:60px; padding:0 16px; align-items:center; box-shadow:0 4px 0 #0002}
.rdots i{width:34px; height:34px; border-radius:50%; background:#e7eaf2; display:grid; place-items:center; font-style:normal;
  font-size:20px; font-weight:900; color:#fff; transition:background .2s, transform .2s}
.rdots i.cur{box-shadow:0 0 0 4px #ffd34d; transform:scale(1.1)}
.rdots i.ok{background:#2fb36d} .rdots i.no{background:#e5383b}
.rdots i.hs{width:52px; border-radius:999px; font-size:18px}
.rdots i.s3{background:#f2b100} .rdots i.s2{background:#9aa7b8} .rdots i.s1{background:#c77c3a} .rdots i.s0{background:#e5383b}
.stagewrap{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:0 16px 16px}
.stage{position:relative; border-radius:28px; overflow:hidden; container-type:size; box-shadow:0 10px 0 #0002,0 18px 40px #0003}
.pane{position:absolute; inset:0; display:none}
.pane.on{display:block}

/* 疊高塔 */
#tPane{background:linear-gradient(180deg,#8fd0ff 0%,#cdeeff 62%,#eef9ff 100%); touch-action:none; cursor:pointer}
#tCv{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none}
.tapHint{position:absolute; left:50%; bottom:5%; transform:translateX(-50%); font-size:3.2cqw; font-weight:900; color:#fff;
  background:#0005; padding:.3em 1em; border-radius:999px; pointer-events:none; transition:opacity .4s; white-space:nowrap}
.tapHint.off{opacity:0}

/* 小雞跳跳 */
#fPane{background:linear-gradient(180deg,#7fd0ff 0%,#bfe9ff 70%,#e6f7ff 100%); touch-action:none; cursor:pointer}
#fCv{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none}
/* 尋寶 */
#hPane{background:radial-gradient(ellipse at 50% 35%,#ffe9b8 0%,#f3cf86 60%,#e2b56a 100%); --ts:7.4cqw}
.hgrid{position:absolute; left:50%; top:10%; height:86%; aspect-ratio:1; transform:translateX(-50%); display:grid; gap:.6cqw}
.hax{display:grid; place-items:center; font-size:calc(var(--ts)*.36); font-weight:900; color:#8a5a20}
.htile{border-radius:1.1cqw; background:linear-gradient(160deg,#fff3d1 0%,#f0cf8a 55%,#d9ae62 100%);
  box-shadow:inset 0 -.5cqw 0 rgba(140,90,30,.35), 0 .3cqw .5cqw rgba(0,0,0,.12); display:grid; place-items:center; position:relative}
#hPane.play .htile:not(.dug){cursor:pointer}
#hPane.play .htile:not(.dug):hover{filter:brightness(1.06); transform:translateY(-2%)}
.htile.dug{background:radial-gradient(circle at 50% 45%,#6b4423 0%,#8a5a2b 55%,#b98556 100%); box-shadow:inset 0 .6cqw 1cqw rgba(0,0,0,.45);
  animation:hdig .28s ease-out}
.htile b{font-size:calc(var(--ts)*.56); font-weight:900; line-height:1; background:#fff; border-radius:50%; width:calc(var(--ts)*.78); height:calc(var(--ts)*.78);
  display:grid; place-items:center; box-shadow:0 .3cqw .6cqw rgba(0,0,0,.3)}
.htile.gem b{background:none; box-shadow:none; font-size:calc(var(--ts)*.66); animation:hgem .7s ease-in-out infinite alternate}
.htile.gem{background:radial-gradient(circle,#fff6c8 0%,#ffd54f 60%,#e0a800 100%); box-shadow:0 0 0 .5cqw #fff, 0 0 2cqw #ffd54f; z-index:2}
.htile.ghost{opacity:.9; animation:hghost 1s ease-in-out infinite alternate}
@keyframes hdig{0%{transform:scale(1)}40%{transform:scale(.86)}100%{transform:scale(1)}}
@keyframes hgem{from{transform:scale(1) rotate(-6deg)}to{transform:scale(1.15) rotate(6deg)}}
@keyframes hghost{from{box-shadow:0 0 0 .3cqw #fff}to{box-shadow:0 0 0 .7cqw #fff, 0 0 2.4cqw #ffd54f}}
.hshov{position:absolute; left:4%; top:14%; display:flex; flex-direction:column; gap:1.4cqw; font-size:5cqw; line-height:1}
.hshov i{font-style:normal; transition:opacity .3s, filter .3s} .hshov i.used{opacity:.22; filter:grayscale(1)}
.hlad{position:absolute; right:3%; top:14%; display:flex; flex-direction:column; gap:1.2cqw; font-weight:900; font-size:2.6cqw; color:#8a5a20}
.hlad div{padding:.6cqw 1.4cqw; border-radius:999px; background:rgba(255,255,255,.55); white-space:nowrap; text-align:center; transition:all .25s}
.hlad div b{color:#f2a900; text-shadow:0 1px 0 #a66f00}
.hlad div.now{background:#fff; box-shadow:0 0 0 .4cqw #f6c948; transform:scale(1.08)}
.hlad div.gone{opacity:.35; text-decoration:line-through}
.hlamp{position:absolute; left:50%; top:1.4%; transform:translateX(-50%); z-index:5; padding:.3cqw 2cqw; border-radius:999px;
  background:rgba(255,255,255,.92); color:#8a5a20; font-weight:900; font-size:2.6cqw; white-space:nowrap}
.hlamp:empty{display:none}
.hlamp.good{background:#fff3c4; color:#b37a00; box-shadow:0 0 0 3px #f6c948}
/* 數字快手 */
#nPane{background:radial-gradient(ellipse at 50% 40%,#eaf4ff 0%,#cfe3ff 60%,#b4d0f7 100%); --nf:7.5cqw}
.ngrid{position:absolute; left:50%; top:50%; height:92%; aspect-ratio:1; transform:translate(-50%,-50%); display:grid; gap:.8cqw;
  transition:opacity .25s, filter .25s}
.ngrid.hide{opacity:.15; filter:blur(6px); pointer-events:none}
.ncell{background:#fff; border-radius:1.4cqw; display:grid; place-items:center; cursor:pointer; position:relative;
  box-shadow:0 .5cqw 0 #8fb3e3, 0 .8cqw 1.4cqw #2f6fd622; transition:transform .1s, background .2s, opacity .2s}
.ncell:active{transform:translateY(.3cqw); box-shadow:0 .2cqw 0 #8fb3e3}
.ncell b{font-size:var(--nf); font-weight:900; color:#24324a; line-height:1; font-variant-numeric:tabular-nums}
.ncell.wild b{transform:rotate(var(--r,0deg)) scale(var(--s,1)); color:var(--c,#24324a); text-shadow:0 .2cqw 0 #0002}
.ncell.done{background:#d3f9d8; box-shadow:0 .15cqw 0 #8ccf97; transform:scale(.94); cursor:default}
.ncell.done b{color:#2f9e44; opacity:.45}
.ncell.bad{animation:nbad .35s ease}
@keyframes nbad{0%,100%{transform:translateX(0); background:#fff}25%{transform:translateX(-6%); background:#ffe3e3}75%{transform:translateX(6%); background:#ffe3e3}}
.nfloat{position:absolute; transform:translate(-50%,-50%); font-style:normal; font-weight:900; font-size:3cqw; pointer-events:none; z-index:8;
  text-shadow:0 .2cqw 0 #fff; animation:nfl .8s ease-out forwards}
@keyframes nfl{to{transform:translate(-50%,-160%); opacity:0}}
/* 記憶燈光 */
#sPane{background:radial-gradient(ellipse at 50% 45%,#2b2f5e 0%,#1a1c3a 70%,#111228 100%)}
.spads{position:absolute; left:50%; top:54%; transform:translate(-50%,-50%); display:grid; gap:2.2cqw}
.spads.p4{grid-template-columns:repeat(2,17cqw); grid-template-rows:repeat(2,17cqw)}
.spads.p6{grid-template-columns:repeat(3,15cqw); grid-template-rows:repeat(2,15cqw)}
.spad{border-radius:3cqw; background:linear-gradient(160deg,var(--a),var(--b)); opacity:.42; filter:saturate(.75);
  box-shadow:inset 0 -1cqw 0 #0003, 0 1cqw 0 #0005; transition:opacity .12s, transform .12s, filter .12s, box-shadow .12s; cursor:default}
.spads.input .spad{opacity:.62; cursor:pointer}
.spads.input .spad:hover{opacity:.75}
.spad.lit{opacity:1!important; filter:saturate(1.2) brightness(1.25); transform:scale(1.06);
  box-shadow:inset 0 -1cqw 0 #0002, 0 0 4cqw var(--a), 0 0 1.2cqw #fff}
.spad.hint{animation:shint .35s ease-in-out 3 alternate; opacity:1}
@keyframes shint{to{box-shadow:0 0 0 1cqw #fff, 0 0 5cqw var(--a)}}
.rdots i.heart{background:none; width:34px; height:34px}
.rdots i.heart svg{width:100%; height:100%; display:block; overflow:visible}
.rdots i.heart path{fill:#e5383b; stroke:#e5383b; stroke-width:1.6; stroke-linejoin:round}
.rdots i.heart.lost path{fill:none; stroke:#c9ced8; stroke-width:2}
.rdots i.heart.lost{animation:hlost .4s ease}
@keyframes hlost{30%{transform:scale(1.3)}}
/* 顏色陷阱 */
#kPane{background:radial-gradient(ellipse at 50% 35%,#fffdf7 0%,#fff4dc 70%,#ffe8b8 100%)}
.krule{position:absolute; left:50%; top:5%; transform:translateX(-50%); padding:.3em 1.1em; border-radius:999px; font-size:3cqw; font-weight:900;
  background:#fff; color:#5a4400; box-shadow:0 .4cqw 0 #0002; white-space:nowrap; transition:background .2s}
.krule:empty{display:none}
.krule.word{background:#24324a; color:#fff; animation:kflip .3s ease}
@keyframes kflip{from{transform:translateX(-50%) scale(1.25)}}
.kword{position:absolute; left:50%; top:37%; transform:translate(-50%,-50%); font-size:19cqw; font-weight:900; line-height:1;
  text-shadow:0 .5cqw 0 #0001; white-space:nowrap}
.kword.pop{animation:kpop .22s cubic-bezier(.2,1.6,.4,1)}
@keyframes kpop{from{transform:translate(-50%,-50%) scale(.6); opacity:.3}}
.kword.shake{animation:kshk .35s ease}
@keyframes kshk{25%{transform:translate(-56%,-50%)}75%{transform:translate(-44%,-50%)}}
.kbtns{position:absolute; left:50%; bottom:7%; transform:translateX(-50%); display:flex; gap:2.2cqw}
.kbtn{width:15cqw; height:15cqw; border-radius:3cqw; font-size:7.4cqw; font-weight:900; cursor:pointer; transition:transform .08s}
.kbtn:active{transform:scale(.93)}
.kbtn.sw,.kbtn.lb{background:var(--c); color:#fff; box-shadow:inset 0 -1cqw 0 #0003, 0 .8cqw 0 #0002; text-shadow:0 .3cqw 0 #0003}
.kbtn.tr{background:#fff; color:var(--c); box-shadow:inset 0 -1cqw 0 #0001, 0 .8cqw 0 #0002}
.kbtn.bad{animation:kbad .4s ease}
@keyframes kbad{0%,100%{box-shadow:0 0 0 0 #e5383b00}30%{box-shadow:0 0 0 1cqw #e5383b}}
/* 反應王 */
#xPane{background:#3b3f6b; cursor:pointer; touch-action:none}
#xPane.wait{background:#b02a37}
#xPane.wait.decoy{background:var(--dc)}
#xPane.go{background:#2fb36d}
#xPane.foul{background:#e8590c}
#xPane.done{background:#3b3f6b}
#xPane.dark{background:radial-gradient(ellipse at 50% 50%,#2b2f5e,#15172e)}
.xmsg{position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); font-size:11cqw; font-weight:900; color:#fff; white-space:nowrap;
  text-shadow:0 .6cqw 0 #0003; pointer-events:none}
.xmsg small{font-size:.45em; opacity:.85}
#xPane.go .xmsg{font-size:16cqw}
.xsub{position:absolute; left:50%; top:66%; transform:translateX(-50%); font-size:3.4cqw; font-weight:900; color:#fffd; white-space:nowrap; pointer-events:none}
.xsub b.g{color:#69db7c}
.xdot{position:absolute; width:13cqw; aspect-ratio:1; border-radius:50%; transform:translate(-50%,-50%); background:var(--c);
  box-shadow:0 0 0 .8cqw #fff, 0 0 4cqw var(--c); animation:xpop .08s ease-out; cursor:pointer}
.xdot.bad::after{content:'✕'; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-size:7cqw; font-weight:900}
@keyframes xpop{from{transform:translate(-50%,-50%) scale(.6)}}
/* 找不同 */
#dPane{background:radial-gradient(ellipse at 50% 30%,#fff8ec 0%,#ffe9c7 70%,#ffd9a0 100%); touch-action:manipulation}
.dgridx{position:absolute; left:3%; right:3%; top:4%; bottom:4%; display:grid; gap:.8cqw; transition:opacity .25s, filter .25s}
.dgridx.hide{opacity:.15; filter:blur(6px); pointer-events:none}
.fdcell{display:grid; place-items:center; border-radius:1.4cqw; background:rgba(255,255,255,.78); box-shadow:0 .4cqw 0 rgba(160,90,20,.18);
  font-size:var(--fs,40px); line-height:1; cursor:pointer; font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  transition:transform .08s}
.fdcell:active{transform:scale(.94)}
.dgridx.lock .fdcell{cursor:default}
.fdcell.bad{background:#ffb3b3; animation:fdshake .3s}
@keyframes fdshake{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.fdcell.hit{background:#7dff9a; box-shadow:0 0 0 .6cqw #2ecc71; animation:fdpop .3s}
.fdcell.show{background:#fff3a8; box-shadow:0 0 0 .6cqw #f6b21a; animation:fdpop .5s ease-in-out 3}
.fdcell.ch{font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif; font-weight:900; color:#3a2a14; font-size:calc(var(--fs,40px)*1.05)}
.fdcell.cl{background:var(--c); box-shadow:none}
.fdcell.cl.hit{background:var(--c); box-shadow:0 0 0 .7cqw #2ecc71, inset 0 0 0 .5cqw #fff}

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
/* 鎖住右鍵選單、長按選單、選取文字、拖曳：小朋友玩的時候不會跳出瀏覽器選單擋住畫面 */
['contextmenu','selectstart','dragstart'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{capture:true}));
let ac=null;
function tone(freq,dur,type='sine',vol=0.07,delay=0){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const t=ac.currentTime+delay, o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const BGM_SC={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10],mix:[0,2,4,5,7,9,10],hmin:[0,2,3,5,7,8,11]};
function acGet(){
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }catch(e){ return null; }
}
const midiHz=m=>440*Math.pow(2,(m-69)/12);
function rng32(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let bgmNoise=null;
function bgmNoiseBuf(a){
  if(bgmNoise&&bgmNoise.sampleRate===a.sampleRate) return bgmNoise;
  const b=a.createBuffer(1,Math.round(a.sampleRate*0.5),a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return bgmNoise=b;
}
/* 一個音：起音 att 秒到 vol，維持到 hold，再 rel 秒淡掉 */
function bgmOsc(a,out,type,f,t,vol,att,hold,rel,o2){
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(o2&&o2.slide) { o.frequency.setValueAtTime(f*o2.slide,t); o.frequency.exponentialRampToValueAtTime(f,t+0.07); }
  if(o2&&o2.drop) o.frequency.exponentialRampToValueAtTime(o2.drop,t+(o2.dropT||0.12));
  if(o2&&o2.det) o.detune.setValueAtTime(o2.det,t);
  let node=o;
  if(o2&&o2.lp){ const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.setValueAtTime(o2.lp,t); fl.Q.value=o2.q||0.7; o.connect(fl); node=fl; }
  node.connect(g); g.connect(out);
  const h=Math.max(t+att+0.001,t+hold);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+att);
  if(hold>att+0.01) g.gain.setValueAtTime(vol,h);
  g.gain.exponentialRampToValueAtTime(0.0001,h+rel);
  o.start(t); o.stop(h+rel+0.05);
}
function bgmNoiseHit(a,out,t,vol,dur,ftype,freq,q){
  const s=a.createBufferSource(), fl=a.createBiquadFilter(), g=a.createGain();
  s.buffer=bgmNoiseBuf(a); fl.type=ftype; fl.frequency.value=freq; fl.Q.value=q||0.7;
  s.connect(fl); fl.connect(g); g.connect(out);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.003); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.start(t); s.stop(t+dur+0.02);
}
/* 樂器（全部是簡單合成音色） */
function bgmPlay(a,out,e,t,sd){
  const f=e.m?midiHz(e.m):0, v=e.v, d=Math.max(0.06,(e.l||1)*sd);
  t+=e.off||0;
  switch(e.i){
    case 'bell': bgmOsc(a,out,'sine',f,t,v,0.004,0.004,1.1); bgmOsc(a,out,'sine',f*4,t,v*0.16,0.002,0.002,0.22); bgmOsc(a,out,'sine',f*2,t,v*0.22,0.003,0.003,0.5); break;
    case 'mallet': bgmOsc(a,out,'sine',f,t,v,0.003,0.003,0.42); bgmOsc(a,out,'sine',f*4,t,v*0.3,0.002,0.002,0.06); break;
    case 'steel': bgmOsc(a,out,'sine',f,t,v,0.004,0.004,0.5); bgmOsc(a,out,'triangle',f*2,t,v*0.25,0.003,0.003,0.25); bgmOsc(a,out,'sine',f*3.02,t,v*0.12,0.002,0.002,0.12); break;
    case 'pluck': bgmOsc(a,out,'triangle',f,t,v,0.003,0.003,Math.min(0.45,d+0.15)); bgmOsc(a,out,'sine',f*2,t,v*0.25,0.002,0.002,0.12); break;
    case 'keys': bgmOsc(a,out,'triangle',f,t,v,0.004,Math.min(d*0.7,0.25),0.35); bgmOsc(a,out,'sine',f*2,t,v*0.3,0.003,0.003,0.3); break;
    case 'chip': bgmOsc(a,out,'square',f,t,v*0.55,0.003,d*0.8,0.04); break;
    case 'brass': bgmOsc(a,out,'sawtooth',f,t,v*0.7,0.03,d*0.8,0.1,{lp:1600}); bgmOsc(a,out,'sawtooth',f,t,v*0.4,0.03,d*0.8,0.1,{lp:1600,det:9}); break;
    case 'flute': bgmOsc(a,out,'sine',f,t,v,0.06,d*0.85,0.15); bgmOsc(a,out,'triangle',f*2,t,v*0.08,0.06,d*0.85,0.12); break;

    case 'kick': bgmOsc(a,out,'sine',150,t,v,0.003,0.003,0.24,{drop:42,dropT:0.13}); break;

    case 'clap': [0,0.012,0.026].forEach(k=>bgmNoiseHit(a,out,t+k,v,0.09,'bandpass',1300,1.2)); break;

/* 編曲：給和弦進行、節奏型，用固定種子產生旋律（每次播都是同一首），4 小節一句、第二句收在主音 */
function bgmCompile(spec,sepLead){
  const sc=BGM_SC[spec.sc||'maj'], n=sc.length, B=spec.bar||16, spb=spec.spb||4, bars=spec.bars||8;
  const sd=60/spec.bpm/spb, len=B*bars, at=Array.from({length:len},()=>[]), lead=[];
  const rnd=rng32(spec.seed||7);
  const pm=d=>spec.key+12*Math.floor(d/n)+sc[((d%n)+n)%n];
  const rootOf=b=>spec.prog[b%spec.prog.length];
  const pat=(p,b)=>Array.isArray(p)?p[b%p.length]:p;
  const off=i=>(spec.swing&&i%4===2)?spec.swing*sd*2:0;        // 搖擺：反拍的八分音符往後拖一點
  const push=(s,e)=>{ e.off=off(s%B); at[s].push(e); };
  const ons=p=>[...p].map((ch,i)=>ch!=='.'&&ch!=='-'?i:-1).filter(i=>i>=0);
  const lenTo=(list,k,max)=>Math.min(max,(k+1<list.length?list[k+1]:B)-list[k]);
  if(spec.lead){
    const L=spec.lead, lo=L.lo??-2, hi=L.hi??9, avoid=spec.penta?[3,6]:[];
    const okd=x=>!avoid.includes(((x%n)+n)%n);
    let d=L.start??4, dir=1; const mel=[];
    const gen=(b,end)=>{
      const o=ons(pat(L.pat,b)), r=rootOf(b), ch=[r,r+2,r+4], out=[];
      o.forEach((i,k)=>{
        const strong=i===0||i===B/2||(B===12&&i===6);
        if(end&&k===o.length-1){ d=[0,7,-7].reduce((x,c)=>Math.abs(c-d)<Math.abs(x-d)?c:x,7); }
        else if(strong||k===0){
          let best=d, bd=99;
          for(const c0 of ch) for(const sh of [-n,0,n]){ const c=c0+sh; if(c<lo||c>hi||!okd(c)) continue;
            const dist=Math.abs(c-d)+(c===d?1.5:0)+rnd()*0.8; if(dist<bd){ bd=dist; best=c; } }
          d=best;
        }else{
          const steps=[1,1,2,1,-1,2,1,-1]; let s=steps[Math.floor(rnd()*steps.length)]*dir;
          if(rnd()<0.22) dir=-dir;
          let x=d+s; if(x>hi){ x=d-Math.abs(s); dir=-1; } if(x<lo){ x=d+Math.abs(s); dir=1; }
          while(!okd(x)) x+=dir>0?1:-1;
          d=Math.max(lo,Math.min(hi,x));
        }
        out.push({i,d,l:lenTo(o,k,L.max||4)});
      });
      return out;
    };
    for(let b=0;b<bars;b++){
      const last=b===bars-1;
      if(!spec.noRepeat&&b>=4&&!last&&mel[b-4]&&pat(L.pat,b)===pat(L.pat,b-4)) mel.push(mel[b-4].map(x=>({...x})));
      else mel.push(gen(b,last||(!spec.noRepeat&&b===3&&bars<=4)));
    }
    mel.forEach((bar,b)=>bar.forEach(x=>{
      const e={i:L.inst,m:pm(x.d)+(L.oct||0),l:x.l*(L.gate||0.9),v:L.v||0.06,d:x.d};
      if(sepLead) lead.push({s:b*B+x.i,...e,off:off(x.i)}); else push(b*B+x.i,e);
    }));
  }
  for(let b=0;b<bars;b++){
    const r=rootOf(b), base=b*B;
    if(spec.bass){ const Q=spec.bass, p=pat(Q.pat,b), o=ons(p);
      o.forEach((i,k)=>{ const ch=p[i], dd=ch==='f'?r+4:ch==='t'?r+2:ch==='o'?r+7:ch==='s'?r+5:r;
        push(base+i,{i:Q.inst||'bass',m:pm(dd)+(Q.oct??-24),l:lenTo(o,k,Q.max||4)*0.9,v:Q.v||0.08}); }); }
    if(spec.arp){ const A=spec.arp, p=pat(A.pat,b), seq=A.seq||[0,2,4,7]; let k=0;
      ons(p).forEach(i=>{ const ch=p[i]; const dd=r+(ch==='x'?seq[(k++)%seq.length]:({1:0,3:2,5:4,8:7}[ch]??0));
        push(base+i,{i:A.inst,m:pm(dd)+(A.oct||0),l:A.l||1,v:A.v||0.035}); }); }
    if(spec.pad){ const P=spec.pad; [0,2,4].forEach(x=>push(base,{i:P.inst||'pad',m:pm(r+x)+(P.oct??-12),l:B,v:P.v||0.012})); }
    if(spec.dr) for(const [k,p0] of Object.entries(spec.dr)){ const p=pat(p0,b);
      const inst={k:'kick',s:'snare',c:'clap',h:'hat',sh:'shaker',w:'wood',t:'tick',tm:'tom'}[k];
      const vv={kick:0.13,snare:0.06,clap:0.05,hat:0.022,shaker:0.022,wood:0.05,tick:0.035,tom:0.09}[inst]*((spec.drv&&spec.drv[k])||1);
      [...p].forEach((ch,i)=>{ if(ch==='x'||ch==='X') push(base+i,{i:inst,v:ch==='X'?vv*1.4:vv}); }); }
  }
  return {sd,len,at,lead,B,bars};
}

const TEMPO={easy:0.92,normal:1,hard:1.08,boss:1.16};          // 難度越高，音樂越快
const BGM_VOL=0.5, BGM_KEY='cg601_bgmOff';
let bgmOffV=false; try{ bgmOffV=localStorage.getItem(BGM_KEY)==='1'; }catch(e){}
const bgmCache={};
const bgm={on:false,name:null,song:null,gain:null,t0:0,next:0,timer:0,vol:1};
function bgmStart(name,tempo=1){
  bgmStop(true); bgm.want=[name,tempo];
  if(bgmOffV) return;
  const a=acGet(); if(!a) return;
  const key=name+'@'+tempo, spec={...SONGS[name],bpm:Math.round(SONGS[name].bpm*tempo)};
  const song=bgmCache[key]||(bgmCache[key]=bgmCompile(spec));
  const g=a.createGain(); g.connect(a.destination);
  bgm.vol=BGM_VOL*(spec.gain||1);
  g.gain.setValueAtTime(0.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(bgm.vol,a.currentTime+0.4);
  Object.assign(bgm,{on:true,name,song,gain:g,t0:a.currentTime+0.06,next:0});
  bgm.timer=setInterval(bgmPump,40); bgmPump();
}
function bgmPump(){
  if(!bgm.on) return;
  const a=ac, s=bgm.song, horizon=a.currentTime+0.3;
  while(bgm.t0+bgm.next*s.sd<horizon){
    const i=bgm.next++, t=bgm.t0+i*s.sd;
    if(t<a.currentTime-0.05) continue;
    for(const e of s.at[i%s.len]) bgmPlay(a,bgm.gain,e,t,s.sd);
  }
}
function bgmStop(fast){
  bgm.want=null;
  if(!bgm.on) return; bgm.on=false; clearInterval(bgm.timer); bgm.timer=0;
  const g=bgm.gain; bgm.gain=null;
  try{ const t=ac.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(0.0001,g.gain.value),t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(fast?0.06:0.6));
    setTimeout(()=>{ try{ g.disconnect(); }catch(e){} },fast?150:800); }catch(e){}
}
function bgmDuck(k){                                    // 暫時把音樂壓小（k＝原音量的幾倍）
  if(!bgm.on||!bgm.gain) return;
  try{ const t=ac.currentTime, g=bgm.gain.gain; g.cancelScheduledValues(t); g.setValueAtTime(Math.max(0.0001,g.value),t);
    g.exponentialRampToValueAtTime(Math.max(0.0001,bgm.vol*k),t+0.25); }catch(e){}
}
function bgmBtnSync(){ const b=$('#bgmBtn'); b.textContent=bgmOffV?'🔇':'🎵'; b.classList.toggle('off',bgmOffV); }
$('#bgmBtn').onclick=()=>{
  const want=bgm.on?[bgm.name,bgm.tempo]:bgm.want;
  bgmOffV=!bgmOffV; try{ localStorage.setItem(BGM_KEY,bgmOffV?'1':'0'); }catch(e){}
  bgmBtnSync();
  if(bgmOffV){ const w=want; bgmStop(); bgm.want=w; }
  else if(want) { bgmStart(want[0],want[1]); bgm.tempo=want[1]; }
};

/* ═════════════ 🧱 疊高塔 ═════════════
   積木左右滑，點畫面任何地方（或按空白鍵）放下；沒對齊的部分會被切掉，積木越來越窄。
   幾乎完全對齊＝「完美」：不會變窄，連續 2 次以上還會變寬一點。疊得越高滑得越快。 */
const TW_BH=0.05, TW_L=0.03;
const tw={phase:'idle',cfg:TW_CFG.normal,blocks:[],cur:null,falls:[],fx:[],floats:[],t0:0,tick:0,
  floors:0,perf:0,side:0,raf:0,last:0,cam:0,zoom:1,zoomT:1,lock:0,ctx:null,W:0,Hp:0,HU:0.56,dpr:1};
const twGround=()=>tw.HU-0.04;
const twY=i=>twGround()-(i+1)*TW_BH;
const twColor=i=>`hsl(${(195+i*23)%360} 72% 60%)`;
function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function twCanvas(){
  const cv=$('#tCv'); const w=cv.clientWidth, h=cv.clientHeight; if(!w||!h) return false;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(w!==tw.W||h!==tw.Hp||dpr!==tw.dpr||!tw.ctx){ tw.W=w; tw.Hp=h; tw.dpr=dpr; cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); tw.ctx=cv.getContext('2d'); }
  tw.HU=h/w; return true;
}
function twSpeed(){ const C=tw.cfg, p=Math.min(1,(performance.now()-tw.t0)/(C.secs*1000));
  return Math.min(C.vmax,C.v0+C.vf*tw.floors+C.vp*p); }
function twSpawn(){
  const top=tw.blocks[tw.blocks.length-1], w=top.w, fromL=tw.side===0; tw.side^=1;
  tw.cur={x:fromL?TW_L:1-TW_L-w, w, dir:fromL?1:-1, i:tw.blocks.length};
}
function twFloat(x,y,t,c,now){ tw.floats.push({x,y,t,c,t0:now}); }
function twDrop(){
  if(tw.phase!=='play'||!tw.cur) return;
  const now=performance.now(); if(now<tw.lock) return;
  const C=tw.cfg, c=tw.cur, top=tw.blocks[tw.blocks.length-1];
  const ov0=Math.max(c.x,top.x), ov1=Math.min(c.x+c.w,top.x+top.w);
  $('#tHint').classList.add('off');
  if(ov1-ov0<C.minw&&Math.abs(c.x-top.x)>=C.perf){   // 沒疊到：整塊掉下去，再來一塊
    tw.falls.push({x:c.x,w:c.w,y:twY(c.i),vx:c.dir*0.15,vy:0,rot:0,spin:c.dir*2,col:twColor(c.i),life:2});
    tw.perf=0; tw.cur=null; tw.lock=now+320; tone(150,0.2,'sawtooth',0.05); tone(110,0.25,'sine',0.06,0.05);
    twFloat(c.x+c.w/2,twY(c.i),'差一點！','#ff5b5b',now);
    later(()=>{ if(tw.phase==='play') twSpawn(); },320);
    return;
  }
  let nx,nw;
  if(Math.abs(c.x-top.x)<C.perf){                   // 完美：對齊上一塊、不變窄
    tw.perf++; nx=top.x; nw=top.w;
    if(tw.perf>=2&&nw<C.basew){ const g=Math.min(0.025,C.basew-nw); nw+=g; nx=Math.max(TW_L,Math.min(1-TW_L-nw,nx-g/2)); }
    tw.fx.push({type:'perf',i:c.i,x:nx,w:nw,t0:now});
    twFloat(nx+nw/2,twY(c.i),tw.perf>=3?`完美 ×${tw.perf}`:(tw.perf>=2?'完美！變寬':'完美！'),'#fff',now);
    [880,1175].forEach((f,k)=>tone(f+Math.min(tw.perf,8)*40,0.1,'triangle',0.06,k*0.06));
  }else{                                             // 沒對齊：多出來的部分切掉、掉下去
    tw.perf=0; nx=ov0; nw=ov1-ov0;
    const cutL=c.x<top.x, px=cutL?c.x:ov1, pw=cutL?(top.x-c.x):(c.x+c.w-ov1);
    if(pw>0.002) tw.falls.push({x:px,w:pw,y:twY(c.i),vx:(cutL?-1:1)*0.12,vy:0,rot:0,spin:(cutL?-1:1)*2.5,col:twColor(c.i),life:2});
    tone(420+Math.min(tw.floors,25)*18,0.08,'triangle',0.06); tone(140,0.06,'sine',0.06);
  }
  tw.blocks.push({x:nx,w:nw,i:c.i}); tw.fx.push({type:'flash',i:c.i,x:nx,w:nw,t0:now});
  tw.floors++; tw.cur=null; twHud();
  const th=tw.cfg.stars; if(th.includes(tw.floors)){ const k=th.indexOf(tw.floors); later(()=>sfx.star(k),90); twFloat(nx+nw/2,twY(c.i)-0.1,'★'.repeat(k+1),'#ffd34d',now); }
  twSpawn();
}
function twHud(){ $('#gScore').innerHTML=`${tw.floors}<small>層</small>`; }
function setTime(n,play){ const e=$('#gTime'); e.innerHTML=`⏱️ ${n}`; e.classList.toggle('warn',n<=5&&n>0&&play); }
const twTime=n=>setTime(n,tw.phase==='play');
function twStep(now){
  const dt=Math.min(0.033,(now-tw.last)/1000||1/60); tw.last=now;
  if(tw.phase==='play'&&tw.cur){ const c=tw.cur, R=1-TW_L-c.w;
    c.x+=c.dir*twSpeed()*dt; if(c.x<=TW_L){ c.x=TW_L; c.dir=1; } if(c.x>=R){ c.x=R; c.dir=-1; } }
  for(const f of tw.falls){ f.life-=dt; f.vy+=2.4*dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.rot+=f.spin*dt; }
  tw.falls=tw.falls.filter(f=>f.life>0);
  tw.fx=tw.fx.filter(f=>now-f.t0<450);
  tw.floats=tw.floats.filter(f=>now-f.t0<850);
  const camT=tw.phase==='end'?0:Math.max(0,tw.HU*0.36-twY(tw.blocks.length));
  const k=Math.min(1,dt*6); tw.cam+=(camT-tw.cam)*k; tw.zoom+=(tw.zoomT-tw.zoom)*Math.min(1,dt*4);
}
function twBlock(c,x,y,w,col){
  const h=TW_BH;
  rr(c,x,y,w,h,0.006); c.fillStyle=col; c.fill();
  c.fillStyle='rgba(255,255,255,.32)'; c.fillRect(x+0.003,y+0.003,Math.max(0,w-0.006),h*0.22);
  c.fillStyle='rgba(0,0,0,.14)'; c.fillRect(x,y+h*0.8,w,h*0.2);
}
function twDraw(now){
  const c=tw.ctx; if(!c) return;
  const W=tw.W, HU=tw.HU, z=tw.zoom, d=tw.dpr;
  c.setTransform(d,0,0,d,0,0); c.clearRect(0,0,W,tw.Hp);
  c.setTransform(d*W,0,0,d*W,0,0);                     // 雲：往上疊時慢慢往下飄
  c.fillStyle='rgba(255,255,255,.75)';
  [[0.16,0.2,0.07],[0.72,0.1,0.09],[0.5,0.42,0.06],[0.88,0.5,0.05]].forEach(([x,y,r])=>{
    const span=HU+0.25, yy=((y+tw.cam*0.35)%span+span)%span-0.1;
    c.beginPath(); c.ellipse(x,yy,r*1.6,r*0.55,0,0,6.283); c.fill();
    c.beginPath(); c.ellipse(x-r*0.5,yy-r*0.25,r*0.7,r*0.45,0,0,6.283); c.fill();
    c.beginPath(); c.ellipse(x+r*0.45,yy-r*0.3,r*0.8,r*0.5,0,0,6.283); c.fill(); });
  c.setTransform(d*W*z,0,0,d*W*z,d*W*(0.5-0.5*z),d*W*(HU-HU*z)); c.translate(0,tw.cam);
  const gy=twGround();
  c.fillStyle='#6cc24a'; c.fillRect(-2,gy,5,3); c.fillStyle='#57a83a'; c.fillRect(-2,gy,5,0.012);
  // 每 5 層一條刻度線，看得出高度
  const marks=[];
  for(let k=5;k<=Math.max(5,tw.blocks.length+5);k+=5){ const y=twY(k); c.strokeStyle='rgba(30,80,130,.22)'; c.lineWidth=0.002;
    c.setLineDash([0.01,0.008]); c.beginPath(); c.moveTo(0,y); c.lineTo(1,y); c.stroke(); c.setLineDash([]); marks.push([k,y]); }
  tw.blocks.forEach((b,n)=>{ if(n===0){ rr(c,b.x,twY(0),b.w,TW_BH,0.006); c.fillStyle='#8b6b4a'; c.fill();
      c.fillStyle='rgba(255,255,255,.18)'; c.fillRect(b.x+0.003,twY(0)+0.003,b.w-0.006,TW_BH*0.22); }
    else twBlock(c,b.x,twY(b.i),b.w,twColor(b.i)); });
  for(const f of tw.fx){ const k=(now-f.t0)/450, y=twY(f.i);
    if(f.type==='flash'){ c.globalAlpha=Math.max(0,0.7*(1-k)); c.fillStyle='#fff'; c.fillRect(f.x,y,f.w,TW_BH); c.globalAlpha=1; }
    else { const e=0.006+k*0.03; c.globalAlpha=Math.max(0,1-k); c.strokeStyle='#fff'; c.lineWidth=0.006;
      rr(c,f.x-e,y-e,f.w+2*e,TW_BH+2*e,0.01); c.stroke(); c.globalAlpha=1; } }
  if(tw.cur) twBlock(c,tw.cur.x,twY(tw.cur.i),tw.cur.w,twColor(tw.cur.i));
  for(const f of tw.falls){ c.save(); c.translate(f.x+f.w/2,f.y+TW_BH/2); c.rotate(f.rot);
    c.globalAlpha=Math.min(1,f.life); twBlock(c,-f.w/2,-TW_BH/2,f.w,f.col); c.restore(); }
  c.setTransform(d,0,0,d,0,0);
  c.textAlign='left'; c.textBaseline='bottom'; c.font=`900 ${Math.max(12,Math.round(W*0.02))}px "Noto Sans TC",system-ui,sans-serif`;
  c.fillStyle='rgba(30,80,130,.6)';
  for(const [k,y] of marks) c.fillText(k+' 層',W*(z*0.01+0.5-0.5*z),W*(z*(y+tw.cam)+HU-HU*z)-3);
  c.textAlign='center'; c.textBaseline='alphabetic'; c.font=`900 ${Math.max(16,Math.round(W*0.036))}px "Noto Sans TC",system-ui,sans-serif`;
  for(const f of tw.floats){ const k=(now-f.t0)/850;
    const sx=W*(z*f.x+0.5-0.5*z), sy=W*(z*(f.y+tw.cam-0.012-k*0.05)+HU-HU*z);
    c.globalAlpha=Math.max(0,1-k*k); c.lineWidth=4; c.strokeStyle='rgba(0,0,0,.45)';
    c.strokeText(f.t,sx,sy); c.fillStyle=f.c; c.fillText(f.t,sx,sy); c.globalAlpha=1; }
}
function twLoop(){
  tw.raf=0;
  if(!$('#tPane').classList.contains('on')||!$('#game').classList.contains('on')) return;
  if(twCanvas()){ const now=performance.now(); twStep(now); twDraw(now); }
  tw.raf=requestAnimationFrame(twLoop);
}
function twStart(){
  const C=tw.cfg=TW_CFG[curDiff];
  Object.assign(tw,{phase:'ready',blocks:[{x:0.5-C.basew/2,w:C.basew,i:0}],falls:[],fx:[],floats:[],
    floors:0,perf:0,side:0,cam:0,zoom:1,zoomT:1,lock:0,last:performance.now()});
  tw.cur={x:TW_L,w:C.basew,dir:1,i:1};
  twHud(); twTime(C.secs); $('#tHint').classList.remove('off');
  if(!tw.raf) tw.raf=requestAnimationFrame(twLoop);
  countdown(()=>{
    tw.phase='play'; tw.t0=performance.now(); tw.side=0; twSpawn();
    playSong('tower',TEMPO[curDiff]);
    let shown=C.secs;
    tw.tick=setInterval(()=>{
      const left=Math.max(0,Math.ceil((tw.t0+C.secs*1000-performance.now())/1000));
      if(left!==shown){ shown=left; twTime(left); if(left<=5&&left>0) sfx.tick(); }
      if(left<=0) twEnd();
    },100);
  });
}
function twEnd(){
  if(tw.phase!=='play') return;
  tw.phase='end'; clearInterval(tw.tick); tw.tick=0; twTime(0);
  tw.cur=null; bgmStop(); sfx.whistle();
  tw.zoomT=Math.min(1,0.84*tw.HU/(0.04+tw.blocks.length*TW_BH));      // 鏡頭拉遠看整座塔
  bigMsg('時間到！',1500);
  later(()=>showResult('tower',tw.floors),2300);
}
$('#tPane').addEventListener('pointerdown',e=>{ if(tw.phase!=='play') return; e.preventDefault(); twDrop(); });
document.addEventListener('keydown',e=>{
  if(!$('#game').classList.contains('on')||curGame!=='tower'||tw.phase!=='play') return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); const a=document.activeElement; if(a&&a.tagName==='BUTTON') a.blur(); if(!e.repeat) twDrop(); }
});

/* ═════════════ 🥤 三杯追星 ═════════════
   先看星星藏在哪一杯，杯子交換（越換越快，有三杯一起轉、假動作、連環換），再選一杯。一場 5 局，一局比一局快。 */
const cu={phase:'idle',cfg:CU_CFG.normal,n:3,slots:[20,50,80],slot:[],star:0,round:0,hits:0,res:[]};
const cuCups=()=>$$('#cPane .cup');
function cuBuild(){
  const p=$('#cPane'); p.querySelectorAll('.cup,.cstar,.spark').forEach(e=>e.remove());
  cu.n=cu.cfg.n; cu.slots=cu.n===4?[14,38,62,86]:[20,50,80];
  p.style.setProperty('--cw',cu.n===4?'15%':'18%');
  const st=document.createElement('div'); st.className='cstar'; st.id='cStar'; p.appendChild(st);
  for(let k=0;k<cu.n;k++){ const c=document.createElement('div'); c.className='cup';
    c.innerHTML='<div class="cshadow"></div><div class="cupb"><s></s></div>';
    c.addEventListener('pointerdown',e=>{ if(cu.phase!=='pick') return; e.preventDefault(); cuPick(k); });
    p.appendChild(c); }
}
function cuPlace(){
  cuCups().forEach((el,k)=>{ el.getAnimations().forEach(a=>a.cancel()); el.style.left=cu.slots[cu.slot[k]]+'%'; el.classList.remove('up','front'); });
  $('#cStar').style.left=cu.slots[cu.slot[cu.star]]+'%';
}
function cuLamp(t,cls){ const e=$('#cLamp'); e.textContent=t||''; e.className='lamp'+(cls?' '+cls:''); }
function cuDots(){
  $('#gDots').innerHTML=[...Array(CU_ROUNDS)].map((_,i)=>{ const r=cu.res[i];
    return `<i class="${r===true?'ok':r===false?'no':(i===cu.round&&cu.phase!=='done'?'cur':'')}">${r===true?'✓':r===false?'✕':''}</i>`; }).join('');
  $('#gScore').innerHTML=`⭐ ${cu.hits}`;
}
function cuRotate(dir,dur){                            // 全部杯子一起轉一格；從一端跑到另一端的那杯從後面繞過去
  const n=cu.n, opt={duration:dur,easing:'ease-in-out'};
  cuCups().forEach((el,k)=>{
    const from=cu.slot[k], to=(from+dir+n)%n, xa=cu.slots[from], xb=cu.slots[to];
    const wrap=Math.abs(to-from)===n-1;
    cu.slot[k]=to; el.style.left=xb+'%'; el.classList.toggle('front',!wrap);
    el.animate([{left:xa+'%',transform:'translateX(-50%) translateY(0) scale(1)'},
      {left:(xa+xb)/2+'%',transform:`translateX(-50%) translateY(${wrap?-26:6}%) scale(${wrap?0.88:1.04})`,offset:0.5},
      {left:xb+'%',transform:'translateX(-50%) translateY(0) scale(1)'}],opt);
  });
  sfx.whoosh(dur); tone(260,0.05,'triangle',0.03);
}
function cuFake(a,b,dur){                              // 假動作：兩杯靠近後又退回原位
  const ea=cuCups()[a], eb=cuCups()[b], xa=cu.slots[cu.slot[a]], xb=cu.slots[cu.slot[b]];
  const ma=xa+(xb-xa)*0.38, mb=xb+(xa-xb)*0.38, opt={duration:dur,easing:'ease-in-out'};
  ea.animate([{left:xa+'%'},{left:ma+'%',offset:0.5},{left:xa+'%'}],opt);
  eb.animate([{left:xb+'%'},{left:mb+'%',offset:0.5},{left:xb+'%'}],opt);
  tone(340,0.04,'triangle',0.025);
}
function cuSwap(a,b,dur){                              // 交換兩杯：一個從上面弧線過去、一個從前面過去
  const ea=cuCups()[a], eb=cuCups()[b], xa=cu.slots[cu.slot[a]], xb=cu.slots[cu.slot[b]];
  [cu.slot[a],cu.slot[b]]=[cu.slot[b],cu.slot[a]];
  ea.style.left=xb+'%'; eb.style.left=xa+'%';
  ea.classList.remove('front'); eb.classList.add('front');
  const opt={duration:dur,easing:'ease-in-out'};
  ea.animate([{left:xa+'%',transform:'translateX(-50%) translateY(0) scale(1)'},
    {left:(xa+xb)/2+'%',transform:'translateX(-50%) translateY(-14%) scale(.96)',offset:0.5},
    {left:xb+'%',transform:'translateX(-50%) translateY(0) scale(1)'}],opt);
  eb.animate([{left:xb+'%',transform:'translateX(-50%) translateY(0) scale(1)'},
    {left:(xa+xb)/2+'%',transform:'translateX(-50%) translateY(6%) scale(1.04)',offset:0.5},
    {left:xa+'%',transform:'translateX(-50%) translateY(0) scale(1)'}],opt);
  sfx.whoosh(dur); tone(300+Math.random()*80,0.04,'triangle',0.03);
}
function cuStart(){
  cu.cfg=CU_CFG[curDiff]; cu.round=0; cu.hits=0; cu.res=[]; cu.phase='ready';
  cuBuild(); cu.slot=[...Array(cu.n).keys()]; cu.star=Math.floor(cu.n/2); cuPlace(); cuLamp(''); cuDots();
  playSong('cups',TEMPO[curDiff]);
  later(cuRound,400);
}
function cuRound(){
  const C=cu.cfg, r=cu.round, n=cu.n, cups=cuCups(), st=$('#cStar');
  cu.phase='show'; cu.slot=[...Array(n).keys()]; cu.star=Math.floor(Math.random()*n); cuPlace(); st.className='cstar';
  cuDots(); bgmDuck(1); cuLamp(''); bigMsg(`第 ${r+1} 局`,900); sfx.count();
  let t=1000;
  later(()=>{ cups[cu.star].classList.add('up'); st.classList.add('on'); tone(988,0.12,'triangle',0.05); cuLamp('記住星星！'); },t);
  t+=C.show;
  later(()=>{ cups[cu.star].classList.remove('up'); },t);
  t+=450;
  later(()=>{ st.classList.remove('on'); cu.phase='shuffle'; cuLamp(''); },t);
  t+=200;
  const moves=C.moves+r, f=1-0.05*r;                  // 一局比一局多換幾下、也更快
  const chain=(a,b,k,d)=>{ cuSwap(a,b,d); if(k>1) later(()=>chain(a,b,k-1,d),d+8); };
  const has=x=>C.kinds.includes(x);
  for(let k=0;k<moves;k++){
    const dur=Math.round((C.d0-(C.d0-C.d1)*k/Math.max(1,moves-1))*f);
    const q=Math.random();
    let kind='swap';
    if(k>=2){ if(has('rot')&&q<0.2) kind='rot'; else if(has('fake')&&q>=0.2&&q<0.33) kind='fake'; else if(has('chain')&&q>=0.33&&q<0.45) kind='chain'; }
    const m=kind==='chain'?(Math.random()<0.7?2:3):1, d=kind==='chain'?Math.max(130,Math.round(dur*0.85)):dur;
    later(()=>{
      if(kind==='rot'){ cuRotate(Math.random()<0.5?1:-1,dur); return; }
      let a,b;
      if(Math.random()<0.65){ a=cu.star; const o=[...Array(n).keys()].filter(x=>x!==a); b=o[Math.floor(Math.random()*o.length)]; }
      else { a=Math.floor(Math.random()*n); do{ b=Math.floor(Math.random()*n); }while(b===a); }
      if(kind==='fake') cuFake(a,b,dur); else chain(a,b,m,d);
    },t);
    t+=kind==='chain'?m*(d+8)+15:dur+(kind==='rot'?40:15);
  }
  later(()=>{
    cu.phase='pick'; $('#cPane').classList.add('pick'); st.style.left=cu.slots[cu.slot[cu.star]]+'%';
    cuLamp('星星在哪一杯？'); tone(784,0.1,'triangle',0.05); bgmDuck(0.55);
  },t+100);
}
function cuSpark(k){
  const p=$('#cPane'), x=cu.slots[cu.slot[k]];
  for(let i=0;i<12;i++){ const s=document.createElement('i'); s.className='spark';
    const a=i/12*6.283; s.style.left=x+'%'; s.style.top='58%';
    s.style.setProperty('--dx',Math.cos(a)*(8+Math.random()*6)+'cqw'); s.style.setProperty('--dy',Math.sin(a)*(8+Math.random()*6)+'cqw');
    p.appendChild(s); setTimeout(()=>s.remove(),1000); }
}
function cuPick(k){
  if(cu.phase!=='pick') return;
  cu.phase='reveal'; $('#cPane').classList.remove('pick');
  const cups=cuCups(), st=$('#cStar'), hit=k===cu.star;
  cups[k].classList.add('up'); bgmDuck(1);
  let t=380;
  if(hit){
    cu.hits++; cu.res[cu.round]=true;
    later(()=>{ st.classList.add('on','win'); cuLamp('找到了！','good'); sfx.win(); cuSpark(k); cuDots(); },t);
    t+=1400;
  }else{
    cu.res[cu.round]=false;
    later(()=>{ sfx.lose(); cuLamp('沒有……','bad'); cuDots(); },t);
    t+=550;
    later(()=>{ cups[cu.star].classList.add('up'); st.classList.add('on'); cuLamp('在這裡！','bad'); },t);
    t+=1300;
  }
  later(()=>{
    cuLamp(''); cuCups().forEach(el=>el.classList.remove('up')); st.className='cstar';
    cu.round++;
    if(cu.round<CU_ROUNDS) later(cuRound,450);
    else { cu.phase='done'; cuDots(); bgmStop(); later(()=>showResult('cups',cu.hits),600); }
  },t);
}

/* ═════════════ 🐤 小雞跳跳 ═════════════
   點一下（或空白鍵）小雞就往上飛，穿過水管的縫隙。第一下點下去才開始計時。
   撞到水管／地面不會結束：小雞暈一下、閃爍 1 秒（這段時間穿過的那關不算），損失的是時間。 */
const FP_X=0.24, FP_R=0.026, FP_PW=0.09;
const fp={phase:'idle',cfg:FP_CFG.normal,tick:0,raf:0,last:0,ctx:null,W:0,Hp:0,HU:0.56,dpr:1,k:1,
  y:0.3,vy:0,started:false,pipes:[],pass:0,inv:0,parts:[],floats:[],flapT:0,scroll:0,t0:0};
const fpGround=()=>fp.HU-0.045;
const fpProg=()=>fp.started?Math.min(1,(performance.now()-fp.t0)/(fp.cfg.secs*1000)):0;
function fpCanvas(){
  const cv=$('#fCv'); const w=cv.clientWidth, h=cv.clientHeight; if(!w||!h) return false;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(w!==fp.W||h!==fp.Hp||dpr!==fp.dpr||!fp.ctx){ fp.W=w; fp.Hp=h; fp.dpr=dpr; cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); fp.ctx=cv.getContext('2d'); }
  fp.HU=h/w; fp.k=fp.HU/0.7; return true;
}
function fpLimits(gap){ const HU=fp.HU; return [HU*0.08+gap/2, fpGround()-0.04-gap/2]; }
function fpSpawn(x){
  const C=fp.cfg, p=fpProg(), HU=fp.HU, gap=HU*(C.gap0-(C.gap0-C.gap1)*p);
  const [lo,hi]=fpLimits(gap);
  const prev=fp.pipes.length?fp.pipes[fp.pipes.length-1].gy0:(lo+hi)/2;
  let gy=lo+Math.random()*(hi-lo);
  gy=Math.max(prev-HU*0.3,Math.min(prev+HU*0.3,gy));                   // 相鄰兩關高低差不要太誇張
  fp.pipes.push({x,gy0:gy,gy,gap,ph:Math.random()*6.283,passed:false,hit:false});
}
function fpHud(){ $('#gScore').innerHTML=`${fp.pass}<small>關</small>`; }
function fpFlap(){
  if(fp.phase!=='play') return;
  const now=performance.now();
  if(!fp.started){                                      // 第一下：開始計時
    fp.started=true; fp.t0=now; $('#fHint').classList.add('off');
    const secs=fp.cfg.secs; let shown=secs;
    fp.tick=setInterval(()=>{
      const left=Math.max(0,Math.ceil((fp.t0+secs*1000-performance.now())/1000));
      if(left!==shown){ shown=left; setTime(left,fp.phase==='play'); if(left<=5&&left>0) sfx.tick(); }
      if(left<=0) fpEnd();
    },100);
  }
  fp.vy=fp.cfg.flap*fp.k; fp.flapT=now;
  tone(620,0.05,'triangle',0.04); tone(930,0.04,'sine',0.02,0.02);
}
function fpCrash(now,pipe){
  if(now<fp.inv) return;
  fp.inv=now+1100; if(pipe) pipe.hit=true;
  for(let i=0;i<10;i++){ const a=Math.random()*6.283, v=0.1+Math.random()*0.3;
    fp.parts.push({x:FP_X,y:fp.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-0.15,life:0.6,c:i%2?'#ffe066':'#fff'}); }
  fp.floats.push({x:FP_X,y:fp.y-0.06,t:'💫',c:'#fff',t0:now});
  const target=pipe?pipe.gy:fp.HU*0.42;
  fp.y=Math.min(fpGround()-FP_R-0.01,Math.max(FP_R+0.01,target)); fp.vy=-0.25*fp.k;
  tone(160,0.18,'sawtooth',0.05); tone(110,0.22,'square',0.03,0.04);
}
function fpStep(now){
  const dt=Math.min(0.033,(now-fp.last)/1000||1/60); fp.last=now;
  const C=fp.cfg, HU=fp.HU, G=fpGround(), p=fpProg();
  if(C.move) for(const q of fp.pipes){ const [lo,hi]=fpLimits(q.gap);  // 魔王：水管縫隙上下移動
    q.gy=Math.max(lo,Math.min(hi,q.gy0+C.move*HU*Math.sin(q.ph+now*0.0021))); }
  if(fp.phase==='play'&&fp.started){
    const v=C.v0+(C.v1-C.v0)*p; fp.scroll+=v*dt;
    fp.pipes.forEach(q=>q.x-=v*dt);
    fp.pipes=fp.pipes.filter(q=>q.x>-FP_PW-0.05);
    const lastX=fp.pipes.length?fp.pipes[fp.pipes.length-1].x:0;
    if(!fp.pipes.length||lastX<1+0.06-C.space) fpSpawn(Math.max(1.06,lastX+C.space));
    fp.vy=Math.min(1.2*fp.k,fp.vy+C.grav*fp.k*dt); fp.y+=fp.vy*dt;
    if(fp.y<FP_R){ fp.y=FP_R; fp.vy=0; }
    if(fp.y>G-FP_R){ fp.y=G-FP_R; fpCrash(now,null); }
    for(const q of fp.pipes){
      const inX=FP_X+FP_R*0.85>q.x&&FP_X-FP_R*0.85<q.x+FP_PW;
      if(inX&&(fp.y-FP_R*0.85<q.gy-q.gap/2||fp.y+FP_R*0.85>q.gy+q.gap/2)) fpCrash(now,q);
    }
    for(const q of fp.pipes){
      if(!q.passed&&q.x+FP_PW<FP_X-FP_R){ q.passed=true;
        if(!q.hit&&now>=fp.inv){ fp.pass++; fpHud();
          fp.floats.push({x:FP_X,y:fp.y-0.07,t:'+1',c:'#fff',t0:now});
          tone(760+Math.min(fp.pass,20)*20,0.08,'triangle',0.06);
          const th=C.stars; if(th.includes(fp.pass)){ const k=th.indexOf(fp.pass); later(()=>sfx.star(k),90);
            fp.floats.push({x:FP_X+0.06,y:fp.y-0.1,t:'★'.repeat(k+1),c:'#ffd34d',t0:now}); } } }
    }
  }
  if(!fp.started){ fp.y=HU*0.4+Math.sin(now/260)*0.012; fp.vy=0; }
  for(const q of fp.parts){ q.life-=dt; q.vy+=1.2*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; }
  fp.parts=fp.parts.filter(q=>q.life>0);
  fp.floats=fp.floats.filter(f=>now-f.t0<800);
}
function fpBird(c,x,y,r,now,ang){
  c.save(); c.translate(x,y); c.rotate(ang);
  c.fillStyle='#ffd23f'; c.beginPath(); c.arc(0,0,r,0,6.283); c.fill();
  c.lineWidth=r*0.08; c.strokeStyle='rgba(150,100,0,.35)'; c.stroke();
  c.fillStyle='#fff3b0'; c.beginPath(); c.ellipse(-r*0.1,r*0.35,r*0.55,r*0.4,0,0,6.283); c.fill();
  const wing=Math.sin((now-fp.flapT)/45)*(now-fp.flapT<300?0.9:0.25);
  c.save(); c.translate(-r*0.25,r*0.05); c.rotate(-0.3-wing);
  c.fillStyle='#ffb300'; c.beginPath(); c.ellipse(-r*0.25,0,r*0.5,r*0.28,0,0,6.283); c.fill(); c.restore();
  c.fillStyle='#fff'; c.beginPath(); c.arc(r*0.38,-r*0.3,r*0.3,0,6.283); c.fill();
  c.fillStyle='#1a1a1a'; c.beginPath(); c.arc(r*0.46,-r*0.3,r*0.14,0,6.283); c.fill();
  c.fillStyle='#ff8a1f'; c.beginPath(); c.moveTo(r*0.75,-r*0.05); c.lineTo(r*1.3,r*0.12); c.lineTo(r*0.75,r*0.3); c.closePath(); c.fill();
  c.fillStyle='rgba(255,120,140,.5)'; c.beginPath(); c.arc(r*0.2,r*0.12,r*0.14,0,6.283); c.fill();
  c.restore();
}
function fpDraw(now){
  const c=fp.ctx; if(!c) return;
  const W=fp.W, HU=fp.HU, G=fpGround();
  c.setTransform(fp.dpr,0,0,fp.dpr,0,0); c.clearRect(0,0,W,fp.Hp);
  c.setTransform(fp.dpr*W,0,0,fp.dpr*W,0,0);
  c.fillStyle='rgba(255,255,255,.8)';
  [[0.15,0.12,0.06],[0.55,0.2,0.08],[0.85,0.09,0.05],[1.2,0.25,0.07]].forEach(([x,y,r])=>{
    const xx=((x-fp.scroll*0.25)%1.4+1.4)%1.4-0.2, yy=y*HU;
    c.beginPath(); c.ellipse(xx,yy,r*1.5,r*0.5,0,0,6.283); c.fill();
    c.beginPath(); c.ellipse(xx-r*0.4,yy-r*0.2,r*0.7,r*0.45,0,0,6.283); c.fill(); });
  for(const q of fp.pipes){
    const top=q.gy-q.gap/2, bot=q.gy+q.gap/2;
    const g=c.createLinearGradient(q.x,0,q.x+FP_PW,0); g.addColorStop(0,'#3aa84a'); g.addColorStop(0.35,'#7de07f'); g.addColorStop(1,'#2a8a3a');
    c.fillStyle=g; c.fillRect(q.x,-0.1,FP_PW,top+0.1); c.fillRect(q.x,bot,FP_PW,G-bot);
    c.fillRect(q.x-0.012,top-0.035,FP_PW+0.024,0.035); c.fillRect(q.x-0.012,bot,FP_PW+0.024,0.035);
    c.strokeStyle='rgba(0,60,0,.35)'; c.lineWidth=0.004;
    c.strokeRect(q.x-0.012,top-0.035,FP_PW+0.024,0.035); c.strokeRect(q.x-0.012,bot,FP_PW+0.024,0.035);
  }
  c.fillStyle='#d9b26a'; c.fillRect(0,G,1,HU-G);
  c.fillStyle='#7cc657'; c.fillRect(0,G,1,0.014);
  c.fillStyle='rgba(0,0,0,.08)';
  for(let x=-((fp.scroll)%0.06);x<1;x+=0.06){ c.fillRect(x,G+0.02,0.03,HU-G-0.02); }
  for(const q of fp.parts){ c.globalAlpha=Math.min(1,q.life*2); c.fillStyle=q.c; c.fillRect(q.x-0.005,q.y-0.005,0.01,0.01); c.globalAlpha=1; }
  const blink=now<fp.inv&&Math.floor(now/90)%2===0;
  if(!blink){ const ang=fp.started&&fp.phase==='play'?Math.max(-0.5,Math.min(1.1,fp.vy/fp.k*1.2)):0; fpBird(c,FP_X,fp.y,FP_R,now,ang); }
  c.setTransform(fp.dpr,0,0,fp.dpr,0,0);
  c.textAlign='center'; c.font=`900 ${Math.max(16,Math.round(W*0.036))}px "Noto Sans TC",system-ui,sans-serif`;
  for(const f of fp.floats){ const k=(now-f.t0)/800, y=(f.y-k*0.05)*W;
    c.globalAlpha=Math.max(0,1-k*k); c.lineWidth=4; c.strokeStyle='rgba(0,0,0,.4)';
    c.strokeText(f.t,f.x*W,y); c.fillStyle=f.c; c.fillText(f.t,f.x*W,y); c.globalAlpha=1; }
}
function fpLoop(){

/* ═════════════ 🗺️ 尋寶 ═════════════
   沙地藏一顆寶石。沒挖到會顯示「離寶藏幾步」（只能上下左右走，數格子），靠數字推理位置。一場 3 局。 */
const ht={phase:'idle',cfg:HT_CFG.normal,n:6,digs:4,round:0,treasure:-1,dug:[],found:0,res:[],total:0};
const htRC=i=>[Math.floor(i/ht.n),i%ht.n];
const htDist=(a,b)=>{ const [r1,c1]=htRC(a),[r2,c2]=htRC(b); return Math.abs(r1-r2)+Math.abs(c1-c2); };
const HT_COL=d=>['#e53935','#e53935','#f57c00','#e0a800','#43a047','#1e88e5','#1e88e5','#7e57c2'][Math.min(d,7)];
const htTiles=()=>$$('#hGrid .htile');
const htStarsFor=k=>k<=ht.digs-2?3:(k===ht.digs-1?2:1);   // 第 k 鏟挖到拿幾顆星
const CIRC='①②③④⑤⑥';
function htBuild(){
  const n=ht.n=ht.cfg.n; ht.digs=ht.cfg.digs;
  const g=$('#hGrid'), cols='ABCDEFGH';
  g.style.gridTemplateColumns=`.55fr repeat(${n},1fr)`; g.style.gridTemplateRows=`.55fr repeat(${n},1fr)`;
  $('#hPane').style.setProperty('--ts',(48/(n+0.55)).toFixed(2)+'cqw');
  let h='<span class="hax"></span>'+[...cols.slice(0,n)].map(c=>`<span class="hax">${c}</span>`).join('');
  for(let r=0;r<n;r++){ h+=`<span class="hax">${r+1}</span>`;
    for(let c=0;c<n;c++) h+=`<div class="htile" data-i="${r*n+c}"></div>`; }
  g.innerHTML=h;
  htTiles().forEach(t=>t.addEventListener('pointerdown',e=>{ if(ht.phase!=='dig') return; e.preventDefault(); htDig(+t.dataset.i); }));
  const D=ht.digs, a=[...CIRC.slice(0,D-2)].join('');
  $('#hLad').innerHTML=`<div data-k="${[...Array(D-2).keys()].map(x=>x+1).join(',')}">${a} <b>★★★</b></div>`+
    `<div data-k="${D-1}">${CIRC[D-2]} <b>★★</b></div><div data-k="${D}">${CIRC[D-1]} <b>★</b></div>`;
}
function htLamp(t,good){ const e=$('#hLamp'); e.textContent=t||''; e.classList.toggle('good',!!good); }
function htUI(){
  const used=ht.dug.length;
  $('#hShov').innerHTML=[...Array(ht.digs)].map((_,k)=>`<i class="${k<used?'used':''}">⛏️</i>`).join('');
  const next=ht.found?ht.found:used+1;
  $$('#hLad [data-k]').forEach(r=>{ const ks=r.dataset.k.split(',').map(Number);
    r.classList.toggle('now',ks.includes(next)&&(ht.phase==='dig'||ht.found>0));
    r.classList.toggle('gone',Math.max(...ks)<next&&!ht.found); });
  $('#gDots').innerHTML=[...Array(HT_ROUNDS)].map((_,i)=>{ const r=ht.res[i];
    return r==null?`<i class="hs ${i===ht.round&&ht.phase!=='done'?'cur':''}"></i>`:`<i class="hs s${r}">${r?r+'★':'✕'}</i>`; }).join('');
  $('#gScore').innerHTML=`⭐ ${ht.total}`;
}
function htStart(){
  ht.cfg=HT_CFG[curDiff]; ht.round=0; ht.res=[]; ht.total=0; ht.phase='ready';

  playSong('hunt',TEMPO[curDiff]);
  later(htRound,300);
}
function htRound(){
  ht.treasure=Math.floor(Math.random()*ht.n*ht.n); ht.dug=[]; ht.found=0;
  htTiles().forEach(t=>{ t.className='htile'; t.innerHTML=''; });
  ht.phase='dig'; $('#hPane').classList.add('play');

function htDig(i){
  if(ht.phase!=='dig'||ht.dug.includes(i)) return;
  ht.dug.push(i);
  const k=ht.dug.length, t=htTiles()[i];
  if(i===ht.treasure){
    ht.found=k; t.className='htile dug gem'; t.innerHTML='<b>💎</b>';
    [784,988,1319,1568].forEach((f,n)=>tone(f,0.13,'triangle',0.06,n*0.07));
    const st=htStarsFor(k); ht.res[ht.round]=st; ht.total+=st;

    htLamp(`第 ${k} 鏟就挖到！ ${'★'.repeat(st)}`,true); htUI();

  }
  const d=htDist(i,ht.treasure);
  t.className='htile dug'; t.innerHTML=`<b style="color:${HT_COL(d)}">${d}</b>`;
  tone(220-Math.min(d,12)*12,0.09,'triangle',0.05); tone(160,0.05,'square',0.02);

    ht.phase='reveal'; $('#hPane').classList.remove('play'); ht.res[ht.round]=0; htUI();
    later(()=>{ const g=htTiles()[ht.treasure]; g.className='htile gem ghost'; g.innerHTML='<b>💎</b>';
      htLamp('寶藏在這裡！'); sfx.lose(); },500);
    later(htNext,2400);
  }
}
function htNext(){
  htLamp(''); ht.round++;
  if(ht.round<HT_ROUNDS) later(htRound,300);
  else { ht.phase='done'; htUI(); bgmStop(); later(()=>showResult('hunt',ht.total),500); }
}

const br={phase:'idle',cfg:BR_CFG.normal,raf:0,last:0,ctx:null,W:0,Hp:0,HU:0.56,dpr:1,

}

}

  br.phase='fall'; br.t=0; tone(330,0.06,'triangle',0.05);
}
function brLand(){                                       // 棍子倒下後判斷
  const C=br.cfg, end=br.cur.x+br.cur.w+br.stick, n=br.nxt;
  br.ok=end>=n.x&&end<=n.x+n.w;
  br.perfect=br.ok&&Math.abs(end-(n.x+n.w/2))<=C.perf;
  tone(120,0.12,'sine',0.08);
  br.walkTo=br.ok?n.x+n.w-0.02:end+0.012;

function brFloat(x,y,t,c){ br.floats.push({x,y,t,c,t0:performance.now()}); }
function brStep(now){

  const C=br.cfg, GY=brGY();

    br.nxt.x=br.nxt.base+C.sway*Math.sin(now*0.0024+br.nxt.ph); }

    if(br.hx>=br.walkTo){
      if(br.ok){
        const pts=br.perfect?2:1; br.score+=pts; brHud();
        brFloat(br.hx,GY-0.07,br.perfect?'完美！+2':'+1',br.perfect?'#ffd34d':'#fff');
        if(br.perfect) [988,1319,1568].forEach((f,i)=>tone(f,0.12,'triangle',0.06,i*0.06));
        else [784,988].forEach((f,i)=>tone(f,0.1,'triangle',0.055,i*0.06));
        const th=C.stars; th.forEach((x,i)=>{ if(br.score-pts<x&&br.score>=x) later(()=>sfx.star(i),250); });

    }
  }
  br.floats=br.floats.filter(f=>now-f.t0<900);
}

function melMerge(a,b,now){
  const L=a.L;
  a.dead=b.dead=true;
  const x=(a.x*a.r*a.r+b.x*b.r*b.r)/(a.r*a.r+b.r*b.r), y=(a.y*a.r*a.r+b.y*b.r*b.r)/(a.r*a.r+b.r*b.r);

  mel.floats.push({x,y:y-MF[NL].r,t:mel.combo>1?`連鎖×${mel.combo} +${pts}`:`+${pts}`,c:mel.combo>1?'#ffd43b':'#fff',t0:now});

function melPhys(dt,now){
  const F=mel.fr, Wc=mel.Wc, SUB=4, h=dt/SUB;
  for(let s=0;s<SUB;s++){
    for(const f of F){ if(f.dead) continue; f.vy+=MF_G*h; f.x+=f.vx*h; f.y+=f.vy*h; f.vx*=0.9995; f.vy*=0.9995; }
    for(let it=0;it<2;it++){
      for(let i=0;i<F.length;i++){ const a=F[i]; if(a.dead) continue;
        for(let j=i+1;j<F.length;j++){ const b=F[j]; if(b.dead) continue;
          const dx=b.x-a.x, dy=b.y-a.y, rr=a.r+b.r; if(Math.abs(dx)>rr||Math.abs(dy)>rr) continue;
          const d2=dx*dx+dy*dy; if(d2>=rr*rr||d2===0) continue;
          if(a.L===b.L&&a.L>=0&&s===0&&it===0){ melMerge(a,b,now); break; }
          const d=Math.sqrt(d2), nx=dx/d, ny=dy/d, ov=rr-d, ma=a.r*a.r, mb=b.r*b.r, ta=mb/(ma+mb), tb=ma/(ma+mb);
          a.x-=nx*ov*ta; a.y-=ny*ov*ta; b.x+=nx*ov*tb; b.y+=ny*ov*tb;
          const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
          if(rv<0){ const jn=-(1.15)*rv; a.vx-=nx*jn*ta; a.vy-=ny*jn*ta; b.vx+=nx*jn*tb; b.vy+=ny*jn*tb;
            const tx=-ny, ty=nx, rt=(b.vx-a.vx)*tx+(b.vy-a.vy)*ty, jt=rt*0.08; a.vx+=tx*jt*ta; a.vy+=ty*jt*ta; b.vx-=tx*jt*tb; b.vy-=ty*jt*tb;
            a.va-=rt*0.3/a.r*ta; b.va+=rt*0.3/b.r*tb; }
        }
      }
      for(const f of F){ if(f.dead) continue;
        if(f.x<f.r){ f.x=f.r; if(f.vx<0) f.vx=-f.vx*0.2; } if(f.x>Wc-f.r){ f.x=Wc-f.r; if(f.vx>0) f.vx=-f.vx*0.2; }
        if(f.y>1-f.r){ f.y=1-f.r; if(f.vy>0) f.vy=-f.vy*0.15; f.vx*=0.985; f.va=f.vx/f.r; } }
    }
    mel.fr=F.filter(f=>!f.dead);
  }

}
function melStep(now){
  const dt=Math.min(0.033,(now-mel.last)/1000||1/60); mel.last=now;

  if(mel.phase==='play'){
    mel.cd=Math.max(0,mel.cd-dt);
    mel.comboT-=dt; if(mel.comboT<=0) mel.combo=0;

    mel.overT=over?mel.overT+dt:Math.max(0,mel.overT-dt*2);

  for(const q of mel.parts){ q.life-=dt; q.vy+=1.5*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; }
  mel.parts=mel.parts.filter(q=>q.life>0); mel.rings=mel.rings.filter(r=>now-r.t0<450); mel.floats=mel.floats.filter(f=>now-f.t0<1000);

function melFruit(c,L,x,y,r,a,sc){                         // 畫一顆水果寶寶

}

  c.fillStyle='rgba(255,255,255,.75)'; c.beginPath(); c.roundRect(rx-s*0.07,y0-s*0.02,s*0.14,step*MF.length+s*0.04,s*0.03); c.fill();
  for(let L=0;L<MF.length;L++){ const yy=ry+L*step, got=L<=mel.maxL;
    c.save(); c.globalAlpha=got?1:0.35; c.translate(rx,yy+step*0.35); c.scale(s,s); melFruit(c,L,0,0,0.032,0,1); c.restore(); }
}
function melLoop(){
  mel.raf=0;
  if(!$('#mPane').classList.contains('on')||!$('#game').classList.contains('on')) return;
  if(melCanvas()){ const now=performance.now(); melStep(now); melDraw(now); }
  mel.raf=requestAnimationFrame(melLoop);
}
(function(){
  const cv=$('#mCv'); let down=false;
  $('#mEnd').addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault(); melEnd('quit'); });
  const setX=e=>{ const r=cv.getBoundingClientRect(); mel.aimX=(e.clientX-r.left-mel.cx0)/mel.s; };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} down=true; setX(e); });
  cv.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse'||down) setX(e); });
  cv.addEventListener('pointerup',e=>{ if(!down) return; down=false; setX(e); melDrop(); });
  cv.addEventListener('pointercancel',()=>{ down=false; });
  document.addEventListener('keydown',e=>{ if(!$('#game').classList.contains('on')||curGame!=='melon') return;
    if(e.key==='ArrowLeft'){ e.preventDefault(); mel.aimX-=0.03; } if(e.key==='ArrowRight'){ e.preventDefault(); mel.aimX+=0.03; }
    if((e.key===' '||e.key==='Enter'||e.key==='ArrowDown')&&!e.repeat){ e.preventDefault(); const a=document.activeElement; if(a&&a.tagName==='BUTTON') a.blur(); melDrop(); } });
})();

/* ═════════════ 🔢 2048 ═════════════
   上下左右滑（或方向鍵），一樣的數字撞在一起會合併成兩倍。每滑一次會冒出一個新的 2（或 4）。
   沒地方可以動就結束；也可以按「結束」先結算。分數＝每次合併出來的數字加總（跟原版一樣）。
   魔王：盤面上有一顆搬不動的石頭，會把那一排切成兩段。 */
const G2_COL={2:['#fff3bf','#7a5a00'],4:['#ffe066','#7a5a00'],8:['#ffa94d','#fff'],16:['#ff8787','#fff'],32:['#f783ac','#fff'],64:['#da77f2','#fff'],
  128:['#9775fa','#fff'],256:['#748ffc','#fff'],512:['#4dabf7','#fff'],1024:['#38d9a9','#fff'],2048:['#40c057','#fff'],4096:['#fab005','#fff'],8192:['#f76707','#fff']};
const g2={phase:'idle',cfg:G2_CFG.normal,n:4,tiles:[],stone:null,score:0,best:0,lock:0,id:0,won:false,sw:null};
function g2Hud(){ $('#gScore').innerHTML=`⭐ ${g2.score}`; $('#gTime').innerHTML=`🏆 ${g2.best}`; }
function g2Pos(el,r,c){ const n=g2.n, p=100/n; el.style.left=(c*p)+'%'; el.style.top=(r*p)+'%'; el.style.width=p+'%'; el.style.height=p+'%'; }
function g2Paint(t){
  const el=t.el, v=t.v, col=G2_COL[v]||['#2b2b2b','#fff'];
  el.firstChild.style.background=col[0]; el.firstChild.style.color=col[1];
  el.firstChild.textContent=v; el.firstChild.style.fontSize=`calc(var(--g2c) * ${v<100?0.46:v<1000?0.38:v<10000?0.3:0.24})`;
  el.classList.toggle('glow',v>=2048);
}
function g2Add(){
  const n=g2.n, free=[];
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){ if(g2.stone&&g2.stone[0]===r&&g2.stone[1]===c) continue; if(!g2.tiles.some(t=>t.r===r&&t.c===c)) free.push([r,c]); }
  if(!free.length) return;
  const [r,c]=free[Math.floor(Math.random()*free.length)], v=Math.random()<g2.cfg.p4?4:2;
  const el=document.createElement('div'); el.className='g2t new'; el.innerHTML='<b></b>';
  const t={id:++g2.id,v,r,c,el}; g2Pos(el,r,c); g2Paint(t); $('#g2Tiles').appendChild(el); g2.tiles.push(t);
  setTimeout(()=>el.classList.remove('new'),200);
}
function g2Build(){
  const n=g2.n=g2.cfg.n, bg=$('#g2Bg'); $('#g2Tiles').innerHTML=''; g2.tiles=[];
  $('#g2Board').style.setProperty('--n',n);
  bg.innerHTML=''; bg.style.gridTemplateColumns=`repeat(${n},1fr)`; bg.style.gridTemplateRows=`repeat(${n},1fr)`;
  g2.stone=g2.cfg.stone?[1+Math.floor(Math.random()*(n-2)),1+Math.floor(Math.random()*(n-2))]:null;
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){ const d=document.createElement('i'); if(g2.stone&&g2.stone[0]===r&&g2.stone[1]===c){ d.className='stone'; d.textContent='🪨'; } bg.appendChild(d); }
}
function g2Fit(){ const b=$('#g2Board'); if(!b.clientWidth) return; b.style.setProperty('--g2c',(b.clientWidth/g2.n)+'px'); }
window.addEventListener('resize',()=>{ if(curGame==='g2048') g2Fit(); });
function g2Start(){
  g2.cfg=G2_CFG[curDiff]; Object.assign(g2,{phase:'play',score:0,best:0,lock:0,won:false});
  g2Build(); g2Fit(); g2Add(); g2Add(); g2.best=Math.max(...g2.tiles.map(t=>t.v)); g2Hud();
  $('#g2End').hidden=false; $('#g2Hint').classList.remove('off');
  playSong('g2048',TEMPO[curDiff]);
}
function g2Lines(dir){                                  // 依方向列出每一條線（從「靠過去的那一邊」開始）
  const n=g2.n, L=[];
  for(let k=0;k<n;k++){ const line=[];
    for(let m=0;m<n;m++){ const i=(dir==='left'||dir==='up')?m:n-1-m; line.push(dir==='left'||dir==='right'?[k,i]:[i,k]); }
    L.push(line); }
  return L;
}
function g2Move(dir){
  if(g2.phase!=='play') return false;
  const now=performance.now(); if(now<g2.lock) return false;
  const at=(r,c)=>g2.tiles.find(t=>t.r===r&&t.c===c&&!t.gone);
  let moved=false, gain=0; const merges=[];
  for(const line of g2Lines(dir)){
    const segs=[[]];                                      // 石頭把一條線切成好幾段
    for(const [r,c] of line){ if(g2.stone&&g2.stone[0]===r&&g2.stone[1]===c) segs.push([]); else segs[segs.length-1].push([r,c]); }
    for(const seg of segs){
      const ts=seg.map(([r,c])=>at(r,c)).filter(Boolean); let k=0, last=null;
      for(const t of ts){
        if(last&&last.v===t.v&&!last.mg){ const [r,c]=seg[k-1]; if(t.r!==r||t.c!==c) moved=true; t.r=r; t.c=c; t.gone=true; last.mg=true; last.nv=last.v*2; merges.push(last); gain+=last.nv; }
        else{ const [r,c]=seg[k]; if(t.r!==r||t.c!==c) moved=true; t.r=r; t.c=c; last=t; k++; }
      }
    }
  }
  if(!moved) return false;
  g2.lock=now+130;
  g2.tiles.forEach(t=>g2Pos(t.el,t.r,t.c));
  const a=acGet(); if(a) bgmNoiseHit(a,a.destination,a.currentTime,0.03,0.08,'bandpass',900,0.8);
  setTimeout(()=>{
    g2.tiles.filter(t=>t.gone).forEach(t=>t.el.remove());
    g2.tiles=g2.tiles.filter(t=>!t.gone);
    for(const t of merges){ t.v=t.nv; t.mg=false; g2Paint(t); t.el.classList.remove('pop'); void t.el.offsetWidth; t.el.classList.add('pop'); }
    if(merges.length){ const top=Math.max(...merges.map(t=>t.v)), f=220*Math.pow(2,Math.log2(top)/4);
      tone(f,0.1,'triangle',0.06); if(merges.length>1) tone(f*1.25,0.1,'triangle',0.05,0.05); }
    g2.score+=gain; const b=Math.max(...g2.tiles.map(t=>t.v));
    if(b>g2.best){ g2.best=b; if(b>=256){ bigMsg(`${b}！`,900); sfx.win(); } if(b===2048&&!g2.won){ g2.won=true; sfx.fanfare(); confetti(80); bigMsg('2048！太強了！',1600); } }
    const th=g2.cfg.stars; th.forEach((x,i)=>{ if(g2.score-gain<x&&g2.score>=x) sfx.star(i); });
    g2Add(); g2Hud(); $('#g2Hint').classList.add('off');
    if(!g2CanMove()) g2End('stuck');
  },120);
  return true;
}
function g2CanMove(){
  const n=g2.n, grid=[...Array(n)].map(()=>Array(n).fill(0));
  if(g2.stone) grid[g2.stone[0]][g2.stone[1]]=-1;
  g2.tiles.forEach(t=>grid[t.r][t.c]=t.v);
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){ const v=grid[r][c]; if(v===0) return true; if(v<0) continue;
    if(c+1<n&&grid[r][c+1]===v) return true; if(r+1<n&&grid[r+1][c]===v) return true; }
  return false;
}
function g2End(why){
  if(g2.phase!=='play') return;
  g2.phase='end'; $('#g2End').hidden=true; bgmStop();
  if(why==='stuck'){ sfx.lose(); bigMsg('沒地方動了！',1500); } else { sfx.whistle(); bigMsg('結算！',1200); }
  later(()=>showResult('g2048',g2.score),1900);
}
(function(){
  const pane=$('#gPane');
  pane.addEventListener('pointerdown',e=>{ if(e.target.closest('#g2End')) return; e.preventDefault(); g2.sw={x:e.clientX,y:e.clientY,done:false}; try{ pane.setPointerCapture(e.pointerId); }catch(_){} });
  pane.addEventListener('pointermove',e=>{ const s=g2.sw; if(!s||s.done) return; const dx=e.clientX-s.x, dy=e.clientY-s.y;
    if(Math.max(Math.abs(dx),Math.abs(dy))>34){ s.done=true; g2Move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')); } });
  ['pointerup','pointercancel'].forEach(n=>pane.addEventListener(n,()=>{ g2.sw=null; }));
  $('#g2End').addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault(); g2End('quit'); });
  document.addEventListener('keydown',e=>{ if(!$('#game').classList.contains('on')||curGame!=='g2048') return;
    const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'}[e.key];
    if(m){ e.preventDefault(); g2Move(m); } });
})();

renderHome();
