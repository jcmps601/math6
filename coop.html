<script>
/* ═════════════ 601 雙人合作過關 ═════════════
   ・兩個人各用自己的平板連線（房間 rooms/房號）：p0＝紅色（開房間的人）、p1＝藍色
   ・每台平板只算「自己的角色」，位置每秒傳 12 次（rooms/房號/live/位置）；機關（按鈕、門）由兩個人的位置各自算，拉桿和寶石寫在 rooms/房號/w
   ・紅色牆只有紅色能過、藍色牆只有藍色能過；可以站在同學頭上跳得更高；碰到尖刺就回起點（不扣分、不會輸）
   ・兩個人都走到自己顏色的門 → 過關。開始時兩個人各用 1 張遊戲券，一張玩 10 分鐘；時間到再給 2 分鐘把這一關做完，想繼續玩兩個人各再用 1 張 */
const $=s=>document.querySelector(s);
const FIREBASE_CONFIG={apiKey:"AIzaSyD-frW7ISsXAHsv1DSZpGzvn_ok9t1NJ4U",authDomain:"quiz601.firebaseapp.com",databaseURL:"https://quiz601-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"quiz601"};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const Q=new URLSearchParams(location.search);
const myId=(()=>{let v=null;try{v=sessionStorage.getItem('co_id')}catch(e){}if(!v){v=Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('co_id',v)}catch(e){}}return v})();
const SLOTS=['p0','p1'],STALE_MS=3*60*60*1000,OFF_MS=20000;
const loadJS=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const timeout=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);
function localNet(){   // 測試用：網址加 ?local，同一台電腦兩個分頁互連
  const KEY='co601_localdb',read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}};
  const getP=(o,p)=>p.split('/').filter(Boolean).reduce((x,k)=>x==null?undefined:x[k],o);
  const setP=(o,p,v)=>{const ks=p.split('/').filter(Boolean);for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||!o[ks[i]])o[ks[i]]={};o=o[ks[i]]}const l=ks[ks.length-1];if(v==null)delete o[l];else o[l]=JSON.parse(JSON.stringify(v))};
  const L=new Set(),fire=()=>{const d=read();L.forEach(l=>l.cb(getP(d,l.p)??null))};
  addEventListener('storage',e=>{if(e.key===KEY)fire()});
  const write=f=>{const d=read();f(d);localStorage.setItem(KEY,JSON.stringify(d));fire()};
  return {mode:'local',off:0,get:async p=>getP(read(),p)??null,set:async(p,v)=>write(d=>setP(d,p,v)),
    update:async(p,v)=>write(d=>{for(const k in v)setP(d,p+'/'+k,v[k])}),remove:async p=>write(d=>setP(d,p,null)),
    on:(p,cb)=>{const l={p,cb};L.add(l);setTimeout(()=>cb(getP(read(),p)??null));return ()=>L.delete(l)},
    onDisc:()=>{},onDiscRm:()=>{},cancelDisc:()=>{},conn:cb=>{cb(true);return ()=>{}}};
}
let Net=null;
const netReady=(async()=>{
  if(Q.has('local'))return Net=localNet();
  try{
    await timeout(loadJS('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'),10000);
    await timeout(loadJS('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js'),10000);
    const app=firebase.apps.find(a=>a.name==='co')||firebase.initializeApp(FIREBASE_CONFIG,'co'),db=app.database();
    Net={mode:'firebase',off:0,get:async p=>(await timeout(db.ref(p).get(),8000)).val(),set:(p,v)=>db.ref(p).set(v),update:(p,v)=>db.ref(p).update(v),remove:p=>db.ref(p).remove(),
      on:(p,cb)=>{const r=db.ref(p),h=s=>cb(s.val());r.on('value',h);return ()=>r.off('value',h)},
      onDisc:p=>{try{db.ref(p).onDisconnect().set({'.sv':'timestamp'})}catch(e){}},
      onDiscRm:p=>{try{db.ref(p).onDisconnect().remove()}catch(e){}},cancelDisc:p=>{try{db.ref(p).onDisconnect().cancel()}catch(e){}},
      conn:cb=>{const r=db.ref('.info/connected'),h=s=>cb(!!s.val());r.on('value',h);return ()=>r.off('value',h)}};
    db.ref('.info/serverTimeOffset').on('value',s=>{Net.off=+s.val()||0});   // 兩台平板的時鐘對齊（電梯才會同步）
  }catch(e){Net=localNet()}
  return Net})();

/* ---- 我是誰（在學習平台裡用座號、寵物） ---- */
let P=null;try{P=window.parent!==window&&window.parent.__learn601}catch(e){}
const inPlat=()=>!!(P&&P.useTicket&&P.seat&&P.seat());

const hasTicket=()=>!inPlat()||isTestMe()||(P.tickets()||0)>0;

let AC=null;function tone(f,d,type='triangle',v=.07,at=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={jump(){tone(520,.12,'square',.03);tone(780,.08,'square',.02,.05)},gem(){[880,1175,1568].forEach((f,i)=>tone(f,.12,'triangle',.06,i*.06))},die(){tone(300,.25,'sawtooth',.05);tone(180,.3,'sawtooth',.04,.1)},
  click(){tone(660,.08,'square',.04)},clear(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.07,i*.1))},join(){tone(660,.1);tone(880,.14,'triangle',.07,.08)}};

/* ═════════════ 關卡 ═════════════

   x y z 踩著的按鈕 → X Y Z 門（有人踩著就打開）　u v 拉桿（碰一下切換）→ U V 門（拉桿打開時門打開）
   m n 踩著 x、y 按鈕才會出現的方塊（樓梯）　e 電梯（上下移動 3 格）　* 寶石　r 紅色的門（終點）　b 藍色的門　1 紅色起點　2 藍色起點 */

const LEVELS=[

/* ═════════════ 狀態 ═════════════ */
const G={mode:'',pin:'',slot:'',st:null,players:{},w:{},live:{},created:0,un:[],paid:'',inv:new Set(),lvPick:0};
const me=()=>G.slot==='p1'?1:0;   // 0 紅、1 藍
const isHost=()=>G.slot==='p0';
const plName=p=>p?(p.seat&&inPlat()&&P.seatName?P.seatName(p.seat):p.name||'同學'):'等待中…';
const best=()=>LS.get('co601_best',{});   // {關卡: 拿到幾顆寶石}
const progress=()=>{const b=best();let n=0;while(n<LEVELS.length-1&&b[n]!=null)n++;return n};   // 打到第幾關
const unlocked=()=>isTestMe()?LEVELS.length-1:progress();   // 能選到第幾關（測試帳號可以直接選任何一關）
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));if(id==='game')fit()}
const msg=t=>{$('#msg').textContent=t||''},lmsg=t=>{$('#lmsg').textContent=t||''};

/* ═════════════ 世界 ═════════════ */
let L=null;   // 目前的關卡：{grid, plates, doors, levers, gems, elev, spawn, exit}
function build(i){const m=LEVELS[i].m,g=m.map(r=>r.padEnd(COLS,'.').slice(0,COLS).split(''));
  const o={i,g,plates:[],levers:[],gems:[],elev:[],spawn:[[60,480],[100,480]],exit:[null,null]};
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const ch=g[r][c],x=c*TS,y=r*TS;
    if('xyz'.includes(ch)){o.plates.push({k:ch.toUpperCase(),c,r});g[r][c]='.'}
    else if('uv'.includes(ch)){o.levers.push({k:ch.toUpperCase(),c,r});g[r][c]='.'}
    else if(ch==='*'){o.gems.push({c,r});g[r][c]='.'}
    else if(ch==='1'||ch==='2'){o.spawn[+ch-1]=[x+TS/2,y+TS];g[r][c]='.'}
    else if(ch==='r'||ch==='b'){o.exit[ch==='r'?0:1]={c,r};g[r][c]='.'}
    else if(ch==='e'){const prev=o.elev.find(e=>e.r===r&&e.c+e.n===c);if(prev)prev.n++;else o.elev.push({c,r,n:1});g[r][c]='.'}}
  o.elev.forEach((e,k)=>{e.ph=k*.37});return o}
const ELEV_A=3*TS,ELEV_P=5200;
const elevY=e=>e.r*TS-ELEV_A*(.5-.5*Math.cos(((now()/ELEV_P)+e.ph)*Math.PI*2));
/* 機關：門開了沒 */
function pressed(k){if(!L)return false;
  for(const p of L.plates){if(p.k!==k)continue;const px=p.c*TS,py=p.r*TS+TS-10;for(const A of bodies())if(A.x+A.w/2>px+4&&A.x-A.w/2<px+TS-4&&A.y>py-2&&A.y<=p.r*TS+TS+2)return true}
  return false}
const leverOn=k=>!!(G.w&&G.w['L'+L.i+k]);
const doorOpen=ch=>'XYZ'.includes(ch)?pressed(ch):'UV'.includes(ch)?leverOn(ch):false;
function solidFor(ch,who){if(ch==='#')return true;if(ch==='m')return pressed('X');if(ch==='n')return pressed('Y');if(ch==='R')return who!==0;if(ch==='B')return who!==1;if('XYZUV'.includes(ch))return !doorOpen(ch);return false}
const tileAt=(c,r)=>c<0||c>=COLS||r<0||r>=ROWS?'#':L.g[r][c];
/* 兩個人的身體（自己用真的位置，同學用收到的位置） */
const PW=28,PH=34;
const bodies=()=>{const a=[];if(ME)a.push(ME);const o=other();if(o)a.push(o);return a};
let ME=null;
function other(){const v=G.live&&G.live[G.slot==='p0'?'p1':'p0'];if(!v||!L||v.l!==L.i)return null;const s=smooth(v);return {x:s.x,y:s.y,w:PW,h:PH,who:1-me(),f:v.f,a:v.a}}
/* 同學的位置：收到的是過去的，往前推一點點，再慢慢靠過去（看起來才順） */
const OS={x:0,y:0,t:0,k:''};
function smooth(v){const age=Math.min(.25,Math.max(0,(now()-v.t)/1000)),tx=v.x+(v.vx||0)*age,ty=v.y+(v.vy||0)*age*.5;
  if(OS.k!==v.k0||Math.hypot(tx-OS.x,ty-OS.y)>120){OS.x=tx;OS.y=ty;OS.k=v.k0}else{OS.x+=(tx-OS.x)*.35;OS.y+=(ty-OS.y)*.35}return {x:OS.x,y:OS.y}}

/* ═════════════ 自己的角色 ═════════════ */
const GRAV=2300,JUMP=700,SPEED=235;
const K={l:0,r:0,j:0,jp:0};
function spawnMe(){const [x,y]=L.spawn[me()];ME={x,y,w:PW,h:PH,vx:0,vy:0,on:0,who:me(),f:me()?-1:1,a:0,k0:Math.random().toString(36).slice(2,6),dead:0,ride:null}}
function rects(){   // 會擋住自己的東西（格子以外的）
  const out=[];const o=other();if(o)out.push({x:o.x-o.w/2,y:o.y-o.h,w:o.w,h:8,one:1,who:'p'});
  for(const e of L.elev){out.push({x:e.c*TS,y:elevY(e),w:e.n*TS,h:12,one:1,who:'e'})}
  return out}
function step(dt){const p=ME;if(!p||p.dead)return;
  const dir=(K.r?1:0)-(K.l?1:0);p.vx=dir*SPEED;if(dir)p.f=dir;
  /* 跳：・早一點按也算（落地前 0.15 秒內按的，一落地就跳）
        ・剛走出平台邊緣 0.1 秒內也能跳；站在同學頭上、電梯上晃動時也不會漏掉
        ・輕點一下也有基本高度（按住超過 0.15 秒才分「長按跳高、短按跳低」） */
  const tn=performance.now();if(p.on)p.lastOn=tn;
  if(K.jp){K.jt=tn;K.jp=0}
  if(K.jt&&tn-K.jt<150&&tn-(p.lastOn||-1e9)<100&&p.vy>-200){p.vy=-JUMP;p.on=0;p.lastOn=-1e9;p.jt=tn;K.jt=0;sfx.jump();fxAdd(p.x,p.y-4,'dust')}
  if(!K.j&&p.vy<-260&&tn-(p.jt||0)>150)p.vy=-260;   // 放開跳就跳低一點
  p.vy=Math.min(1100,p.vy+GRAV*dt);
  /* 站在電梯或同學頭上：跟著一起動 */
  if(p.ride){const R0=p.ride;const nr=rects().find(q=>q.who===R0.who&&Math.abs(q.x-R0.x)<60);if(nr){p.x+=nr.x-R0.x;p.y+=nr.y-R0.y}}
  moveX(p,p.vx*dt);const wasOn=p.on;p.on=0;p.ride=null;moveY(p,p.vy*dt);p.onP=!!(p.ride&&p.ride.who==='p');
  /* 尖刺、掉下去 */
  const c0=Math.floor((p.x-p.w/2+3)/TS),c1=Math.floor((p.x+p.w/2-3)/TS),r1=Math.floor((p.y-2)/TS);
  for(let c=c0;c<=c1;c++)if(tileAt(c,r1)==='^'&&p.y>r1*TS+TS*.45)return die();
  if(p.y>H+60)return die();
  /* 寶石、拉桿 */
  L.gems.forEach((g,i)=>{const key='G'+L.i+'_'+i;if(G.w[key])return;const gx=g.c*TS+TS/2,gy=g.r*TS+TS/2;if(Math.abs(p.x-gx)<26&&Math.abs(p.y-p.h/2-gy)<30){G.w[key]=1;wset(key,1);sfx.gem();fxAdd(gx,gy,'✨')}});
  L.levers.forEach((v,i)=>{const lx=v.c*TS+TS/2,ly=v.r*TS+TS,inside=Math.abs(p.x-lx)<22&&p.y>ly-TS&&p.y<=ly+4;const id='lv'+i;
    if(inside&&!p[id]){const key='L'+L.i+v.k,nv=G.w[key]?0:1;G.w[key]=nv;wset(key,nv);sfx.click()}p[id]=inside});
  p.a=p.on?(p.vx?1:0):2}
function hitTiles(p,x,y){const c0=Math.floor((x-p.w/2)/TS),c1=Math.floor((x+p.w/2-.01)/TS),r0=Math.floor((y-p.h)/TS),r1=Math.floor((y-.01)/TS),out=[];
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const ch=tileAt(c,r);if(solidFor(ch,p.who))out.push({c,r})}return out}
function moveX(p,dx){if(!dx)return;let x=p.x+dx;const hs=hitTiles(p,x,p.y).filter(t=>!overlapNow(p,t));
  if(hs.length){x=dx>0?Math.min(...hs.map(t=>t.c*TS))-p.w/2:Math.max(...hs.map(t=>t.c*TS+TS))+p.w/2}p.x=Math.max(p.w/2,Math.min(W-p.w/2,x))}
const overlapNow=(p,t)=>p.x+p.w/2>t.c*TS+.5&&p.x-p.w/2<t.c*TS+TS-.5&&p.y>t.r*TS+.5&&p.y-p.h<t.r*TS+TS-.5;   // 門關上時人在裡面：先讓他出來
function moveY(p,dy){let y=p.y+dy;
  const hs=hitTiles(p,p.x,y).filter(t=>!overlapNow(p,t));
  if(hs.length){if(dy>0){y=Math.min(...hs.map(t=>t.r*TS));p.on=1}else y=Math.max(...hs.map(t=>t.r*TS+TS))+p.h;p.vy=0}
  /* 單向平台：從上面掉下來才會站住 */
  if(dy>=0){const c0=Math.floor((p.x-p.w/2)/TS),c1=Math.floor((p.x+p.w/2-.01)/TS);
    for(let c=c0;c<=c1;c++){const r=Math.floor(y/TS);if(tileAt(c,r)==='-'&&p.y<=r*TS+1&&y>=r*TS){y=r*TS;p.vy=0;p.on=1}}
    for(const q of rects()){if(p.x+p.w/2>q.x+2&&p.x-p.w/2<q.x+q.w-2&&p.y<=q.y+6&&y>=q.y){y=q.y;p.vy=0;p.on=1;p.ride={who:q.who,x:q.x,y:q.y};if(q.who==='p'&&!p.onP)fxAdd(p.x,p.y-p.h-14,'💖')}}}
  p.y=y}

  Net.on(`rooms/${G.pin}/state`,v=>{if(!v){if(G.mode==='net'&&!G.leaving){closeRoom('房間關掉了')}return}G.st=v;onState()}),
  Net.on(`rooms/${G.pin}/players`,v=>{const before=SLOTS.filter(k=>G.players[k]).length;G.players=v||{};const after=SLOTS.filter(k=>G.players[k]).length;
    if(after>before&&before)sfx.join();if(G.st&&G.st.phase!=='wait'&&!G.players[G.slot==='p0'?'p1':'p0'])partnerLeft();if(G.st)onState()}),
  Net.on(`rooms/${G.pin}/live`,v=>{G.live=v||{}}),
  Net.on(`rooms/${G.pin}/w`,v=>{G.w=v||{}}),
  Net.on(`rooms/${G.pin}/dec`,v=>{if(!v||!inPlat()||Date.now()-(v.t||0)>60000)return;G.inv.delete(v.s);
    lmsg(P.decText(v))})];
  if(!G.unConn)G.unConn=Net.conn(on=>{if(on&&G.mode==='net')armPlay(1)})}
function armPlay(force){if(G.mode!=='net'||!G.slot)return;if(G.armed===G.pin&&!force)return;G.armed=G.pin;const p=`rooms/${G.pin}/players/${G.slot}`;Net.cancelDisc(p);Net.onDiscRm(p);Net.onDiscRm(`rooms/${G.pin}/live/${G.slot}`);
  Net.get(p).then(cur=>{if(!cur&&G.mode==='net')Net.set(p,meRec())}).catch(()=>{})}
function partnerLeft(){if(G.left===G.pin)return;G.left=G.pin;setTimeout(()=>{if(G.mode!=='net')return;if(!G.players[G.slot==='p0'?'p1':'p0']){
  if(isHost())Net.update(`rooms/${G.pin}/state`,{phase:'wait',t:Date.now()}).catch(()=>{});else closeRoom('開房間的同學離開了')}G.left=''},OFF_MS/4)}
const meRec=()=>({id:myId,name:myName(),seat:mySeat(),tk:hasTicket(),pet:myPet()||null});
async function needOK(){if(!hasTicket()){msg(NO_TK);return false}return true}
async function sweepRooms(){if(Net.mode!=='firebase'||sweepRooms.done)return;sweepRooms.done=1;
  try{const all=await Net.get('rooms')||{},t0=Date.now();for(const [p,r] of Object.entries(all)){if(!r||!r.meta||r.meta.game!=='co')continue;
    const t=Math.max(+(r.state&&r.state.t)||0,+r.meta.created||0);if(t&&(t0-t>STALE_MS||(!r.players&&t0-t>10*60*1000)))await Net.remove(`rooms/${p}`).catch(()=>{})}}catch(e){}}
async function create(){if(!(await needOK()))return false;msg('建立中…');await netReady;await sweepRooms();
  try{let pin='';for(let i=0;i<30&&!pin;i++){const p=String(1000+Math.random()*9000|0);if(!(await Net.get(`rooms/${p}/meta`)))pin=p}
    if(!pin){msg('房間滿了，等一下再試');return false}const created=Date.now();
    await Net.set(`rooms/${pin}`,{meta:{game:'co',created},state:{phase:'wait',lv:0,t:created},players:{p0:meRec()}});
    Object.assign(G,{mode:'net',pin,slot:'p0',st:null,players:{},created,armed:'',paid:''});G.lvPick=Math.min(progress(),LEVELS.length-1);msg('');listen();armPlay();return true
  }catch(e){msg('連不上網路，請檢查網路後再試一次');return false}}
async function join(pin){if(!/^\d{4}$/.test(pin))return msg('房號是 4 個數字');if(!(await needOK()))return;msg('加入中…');await netReady;
  try{const room=await Net.get(`rooms/${pin}`);if(!room||!room.meta)return msg('找不到這個房間，看看房號對不對');
    if(room.meta.game!=='co')return msg('這個房號是別的遊戲，請到那個遊戲加入');
    const pl=room.players||{};let slot=SLOTS.find(k=>pl[k]&&pl[k].id===myId);
    if(!slot){if(pl.p1)return msg('這個房間已經有 2 個人了');slot='p1';await Net.set(`rooms/${pin}/players/p1`,meRec());
      await new Promise(r=>setTimeout(r,350));const chk=await Net.get(`rooms/${pin}/players/p1`);if(!chk||chk.id!==myId)return msg('有人先加入了，請再試一次')}
    Object.assign(G,{mode:'net',pin,slot,st:room.state,players:{...pl,[slot]:meRec()},created:room.meta.created||0,armed:'',paid:''});msg('');listen();armPlay();onState()
  }catch(e){msg('連不上網路，請再試一次')}}
function closeRoom(t){G.un.forEach(f=>f());G.un=[];Object.assign(G,{mode:'',pin:'',slot:'',st:null,players:{},w:{},live:{}});L=null;ME=null;$('#over').classList.remove('on');show('home');paintMe();msg(t||'')}
async function leave(){$('#over').classList.remove('on');$('#pick').classList.remove('on');
  if(G.mode==='net'&&G.pin){G.leaving=true;const pin=G.pin,p=`rooms/${pin}/players/${G.slot}`;G.un.forEach(f=>f());G.un=[];Net.cancelDisc(p);
    try{await Net.remove(p);await Net.remove(`rooms/${pin}/live/${G.slot}`);const pl=await Net.get(`rooms/${pin}/players`);if(!pl||!Object.keys(pl).length)await Net.remove(`rooms/${pin}`)}catch(e){}G.leaving=false}
  closeRoom('')}
$('#bOut').onclick=leave;$('#bLLeave').onclick=leave;
$('#bNew').onclick=async()=>{if(await create())onState()};
$('#bJoin').onclick=()=>join($('#pinIn').value.trim());
$('#pinIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bJoin').onclick()});
/* 邀請同學（在學習平台裡） */
async function openPick(){if(!inPlat()||!P.seats)return;const Lp=$('#pickList');Lp.innerHTML='讀取中…';$('#pick').classList.add('on');
  let on={};try{on=await P.online()}catch(e){}
  Lp.innerHTML='';P.seats().filter(s=>s!==P.seat()).forEach(s=>{const b=document.createElement('button'),live=!!on[s];
    b.className=G.inv.has(s)?'sent':live?'on':'';b.textContent=s>=98?'🧪 測試'+(s===99?1:2):P.seatName(s);b.disabled=!live||G.inv.has(s);const cd=P.invCool(s);if(cd&&live&&!G.inv.has(s)){b.disabled=true;b.className='';b.textContent+='⏳';b.dataset.cd=cd;b.title='剛邀請過，等一下才能再邀請'}
    b.onclick=async()=>{b.disabled=true;try{await P.invite(s,G.pin,'pm');G.inv.add(s);b.className='sent';lmsg(`已經邀請 ${P.seatName(s)}，等他按「接受」…`);$('#pick').classList.remove('on')}catch(e){b.disabled=false;lmsg(P.invErr(e))}};Lp.appendChild(b)});
  P.invNote(Lp);if(!Lp.children.length)Lp.textContent='現在沒有其他同學在線上'}
$('#pickX').onclick=()=>$('#pick').classList.remove('on');
$('#bInv2').onclick=openPick;
$('#bInv').onclick=async()=>{if(await create()){onState();openPick()}};
addEventListener('pagehide',()=>{if(G.inv.size&&inPlat()&&P.uninvite)G.inv.forEach(s=>P.uninvite(s))});
/* 給平台用：合作遊戲沒有輸贏，離開不扣券 */
window.__xqBusy=()=>false;window.__xqQuit=()=>leave();
paintMe();if(inPlat()&&P.invite)$('#bInv').hidden=false;
(async()=>{await netReady;if(Q.get('join')){$('#pinIn').value=Q.get('join');join(Q.get('join'))}else if(Q.has('pick')&&inPlat())$('#bInv').onclick()})();
window.__co={G,get L(){return L},get ME(){return ME},LEVELS,build,solidFor,startLevel};
</script>
