<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>601 象棋對戰</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;color:#3b2a1a;background:radial-gradient(ellipse at 50% 20%,#fff4dc 0%,#f6dfb3 70%,#eccb8f 100%);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
.scr{display:none;height:100%}.scr.on{display:flex}
.btn{border:0;border-radius:20px;font-size:1.6rem;font-weight:900;padding:.7rem 1.6rem;color:#fff;background:#c0392b;box-shadow:0 5px 0 #8e2a20}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8e2a20}
.btn.b{background:#2f3640;box-shadow:0 5px 0 #11151a}.btn.g{background:#fff;color:#7a5a32;box-shadow:0 5px 0 #d9b97f}
/* 首頁 */
#home,#wait{flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:1rem;text-align:center}
.logo{font-size:clamp(2.4rem,6vw,4rem);font-weight:900;letter-spacing:.1em;color:#8e2a20;text-shadow:0 4px 0 #fff8}
/* 帥、將的圓圈:字縮小、拿掉字距,才會在圓圈正中間 */
.logo span{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;font-size:.72em;line-height:1;letter-spacing:0;width:1.75em;height:1.75em;border-radius:50%;background:#fffaf0;border:.1em solid #c0392b;color:#c0392b;margin:0 .25em;box-shadow:0 .1em 0 #d9b97f;text-shadow:none}
#me{font-size:1.3rem;font-weight:900;color:#7a5a32}#me button{border:0;background:none;color:#c0392b;font-size:1.1rem;font-weight:900;text-decoration:underline}
.menu{display:flex;flex-direction:column;gap:1rem;width:min(26rem,100%)}
.join{display:flex;gap:.6rem}
#pinIn{flex:1;min-width:0;font:900 2rem 'Avenir Next',Arial,sans-serif;text-align:center;letter-spacing:.3em;border:4px solid #d9b97f;border-radius:18px;padding:.4rem;background:#fffaf0;color:#3b2a1a}
#msg{min-height:1.5em;font-size:1.2rem;font-weight:900;color:#c0392b}
.note{font-size:1rem;color:#9a7a52;font-weight:800;max-width:30rem}
#pinBig{font:900 clamp(4rem,14vw,8rem) 'Avenir Next',Arial,sans-serif;letter-spacing:.15em;color:#c0392b;background:#fffaf0;border-radius:28px;padding:.2rem 1.5rem;box-shadow:0 6px 0 #d9b97f}
/* 對局 */
#game{align-items:stretch;justify-content:center;gap:1rem;padding:.8rem}
#boardWrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
#board{height:100%;max-height:100%;max-width:100%;aspect-ratio:920/1020;touch-action:manipulation}
#side{width:min(18rem,34vw);display:flex;flex-direction:column;gap:.8rem}
.pl{background:#fffaf0;border-radius:20px;padding:.6rem .9rem;box-shadow:0 4px 0 #d9b97f;display:flex;align-items:center;gap:.6rem;border:4px solid transparent}
.pl.turn{border-color:#f59f00;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 4px 0 #d9b97f,0 0 18px #ffd43b}}
.pl i{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:1.5rem;font-weight:900;background:#fffaf0;border:3px solid}
.pl.r i{color:#c0392b;border-color:#c0392b}.pl.b i{color:#222;border-color:#222}
.pl b{font-size:1.3rem;display:block}.pl small{font-size:.95rem;color:#9a7a52;font-weight:800}
#status{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:1.6rem;font-weight:900;color:#7a5a32;gap:.4rem}
#status .chk{color:#fff;background:#c0392b;border-radius:14px;padding:.2rem .9rem;font-size:2rem;animation:pop .4s}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
#acts{display:flex;flex-direction:column;gap:.6rem}#acts .btn{font-size:1.25rem;padding:.55rem}
#side .code{text-align:center;font-weight:900;color:#9a7a52;font-size:1rem}
/* 結束 */
#over{position:fixed;inset:0;background:rgba(40,25,10,.45);display:none;align-items:center;justify-content:center;z-index:9}
#over.on{display:flex}
#over .box{background:#fffaf0;border-radius:28px;padding:1.6rem 2.2rem;text-align:center;display:flex;flex-direction:column;gap:.8rem;animation:pop .3s;max-width:92vw}
#over .t{font-size:2.6rem;font-weight:900}#over .s{font-size:1.3rem;font-weight:800;color:#9a7a52}
#over .row{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
/* 棋盤 SVG */
.pc text{font-family:'Kaiti TC','BiauKai','DFKai-SB','STKaiti','PingFang TC',serif;font-weight:900;pointer-events:none}
@media (orientation:portrait),(max-width:760px){#game{flex-direction:column;padding:.5rem;gap:.5rem}#side{width:100%;flex-direction:row;flex-wrap:wrap;gap:.5rem}
 .pl{flex:1 1 40%}#status{flex:1 1 100%;order:3;font-size:1.3rem;min-height:2.6rem}#acts{flex:1 1 100%;flex-direction:row;order:4}#acts .btn{flex:1}#side .code{order:5;flex:1 1 100%}}

/* 邀請同學、戰績 */
#pick{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:1rem}
#pick.on{display:flex}
#pick .box{background:#fffaf0;border-radius:24px;padding:1rem 1.2rem;width:min(40rem,100%);max-height:100%;overflow:auto;text-align:center;border:5px solid #d9b97f}
#pick .t{font-size:1.6rem;font-weight:900;color:#8e2a20}#pick .s{color:#7a5a32;font-weight:800;margin:.2rem 0 .7rem}
#pickList{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.45rem;margin-bottom:.8rem}
#pickList button{border:3px solid #e9d5ae;background:#fff;border-radius:14px;font-size:1.25rem;font-weight:900;color:#aaa;padding:.45rem .2rem}
#pickList button.on{border-color:#2f9e44;background:#ebfbee;color:#2b8a3e}
#pickList button.on::before{content:'● ';color:#2f9e44}
#pickList button:disabled{opacity:.5}
#invMsg{font-size:1.4rem;font-weight:900;color:#8e2a20;min-height:1.6em}
#rec{font-size:1.15rem;font-weight:800;color:#7a5a32;margin-top:.3rem}
#rec b{color:#c0392b}

/* 象棋／暗棋切換 */
#types,.types{display:flex;justify-content:center;width:max-content;margin:0 auto .5rem;gap:.5rem;background:#f3e2c0;border-radius:999px;padding:.3rem}
#types button,.types button{border:0;border-radius:999px;font-size:1.3rem;font-weight:900;padding:.4rem 1.2rem;background:none;color:#9a7a52}
#types button.on,.types button.on{background:#fff;color:#8e2a20;box-shadow:0 3px 0 #d9b97f}
.logo em{font-style:normal}
#aqRule{background:#fffaf0;border-radius:16px;padding:.5rem .9rem;line-height:1.6;color:#7a5a32;font-size:1.05rem}#aqRule b{color:#c0392b}
#pickG{color:#c0392b}
/* 暗棋 */
.aq .pc.dn circle.f{fill:url(#aqBack)}
.pl.q i{color:#9a7a52;border-color:#d9b97f}
.capr{display:flex;flex-wrap:wrap;gap:.15rem;margin-top:.2rem}.capr span{font-size:.95rem;width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid;font-weight:900;font-family:'Kaiti TC','BiauKai','DFKai-SB',serif}
.capr span.r{color:#c0392b;border-color:#c0392b}.capr span.b{color:#222;border-color:#222}
/* 選同學：每一格一樣大 */
#pickList{grid-auto-rows:3.3rem}
#pickList button{height:3.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.2rem}

/* 直拿：棋盤縮到放得下，下面的玩家、按鈕一定看得到 */
#boardWrap{min-height:0;min-width:0}
@media (orientation:portrait),(max-width:760px){#boardWrap{flex:1 1 0;overflow:hidden}#board{height:100%;width:auto;max-width:100%}}

/* 手機橫拿（很矮）：右邊的玩家、按鈕縮小，全部放得下 */
@media (orientation:landscape) and (max-height:520px){
 #game{padding:.4rem;gap:.5rem}#side{gap:.35rem;overflow:auto}
 .pl{padding:.25rem .5rem;border-width:3px}.pl i{width:2rem;height:2rem;font-size:1.1rem}.pl b{font-size:1rem}.pl small{font-size:.8rem}
 #status{font-size:1.05rem;gap:.2rem}#status .chk{font-size:1.2rem}
 #acts{flex-direction:row;gap:.35rem}#acts .btn{font-size:.95rem;padding:.35rem .4rem;flex:1}
 #side .code{font-size:.8rem}.capr span{width:1.2rem;height:1.2rem;font-size:.75rem}
}
</style></head><body>

<section class="scr on" id="home">
  <div id="types"><button data-t="xq">♟️ 象棋</button><button data-t="aq">🀄 暗棋</button></div>
  <div class="logo"><span>帥</span><em id="logoT">象棋對戰</em><span>將</span></div>
  <div class="note" id="aqRule" hidden>32 顆棋全部蓋著：輪到你就<b>翻一顆</b>或<b>走一格</b>。第一顆翻到什麼顏色，你就是那一方。<br>大吃小（兵卒可以吃帥將）；炮要<b>隔一顆</b>才能吃。對方的棋被吃光就贏了！</div>
  <div id="me"></div>
  <div class="menu">
    <button class="btn" id="bNew">🏠 建立房間（我先下・紅方）</button>
    <div class="join"><input id="pinIn" inputmode="numeric" maxlength="4" placeholder="房號"><button class="btn b" id="bJoin">加入</button></div>
    <button class="btn g" id="bLocal">👥 同一台平板兩人輪流下</button>
    <button class="btn" id="bInv" hidden>📨 邀請同學對戰</button>
  </div>
  <div id="msg"></div>
  <div class="note" id="mode"></div>
  <div id="rec"></div>
</section>

<section class="scr" id="wait">
  <div class="logo" style="font-size:2rem">等同學加入…</div>
  <div id="pinBig">----</div>
  <div class="note" id="waitNote">把房號告訴要一起下的同學，他在「加入」輸入房號就可以開始。</div>
  <div id="invMsg"></div>
  <button class="btn g" id="bCancel">取消</button>
</section>

<section class="scr" id="game">
  <div id="boardWrap"><svg id="board" viewBox="-60 -60 920 1020"></svg></div>
  <aside id="side">
    <div class="pl b" id="plTop"><i>將</i><div><b id="nmTop"></b><small id="smTop"></small></div></div>
    <div id="status"></div>
    <div class="pl r" id="plBot"><i>帥</i><div><b id="nmBot"></b><small id="smBot"></small></div></div>
    <div id="acts"><button class="btn g" id="bUndo" hidden>↩ 悔棋</button><button class="btn b" id="bResign">🏳 認輸</button><button class="btn g" id="bLeave">離開</button></div>
    <div class="code" id="code"></div>
  </aside>
</section>

<div id="over"><div class="box"><div class="t" id="ovT"></div><div class="s" id="ovS"></div><div class="row"><button class="btn" id="bAgain">🔁 再來一局（換邊）</button><button class="btn g" id="bOut">離開</button></div></div></div>

<div id="pick"><div class="box"><div class="t">📨 邀請誰一起下<span id="pickG">象棋</span>？</div><div id="pickT" class="types"><button data-t="xq">♟️ 象棋</button><button data-t="aq">🀄 暗棋</button></div><div class="s">綠色的同學現在在平台上，按一下就會邀請他</div><div id="pickList"></div><button class="btn g" id="pickX">取消</button></div></div>
<script src="xq.js"></script><script src="aq.js"></script>
<script>
/* ═════════════ 601 象棋對戰 ═════════════
   兩台平板連線對下：建立房間的人拿紅方先下，另一人輸入 4 位數房號加入。
   連線用和「601 搶答王」同一個 Firebase（rooms/房號），每走一步就存一次棋譜，兩邊同步。
   連不上 Firebase 時改用本機模式：同一台電腦的兩個分頁可以互下（測試用）。
   也可以「同一台平板兩人輪流下」，不用連線。
   規則：在學習平台裡，每下一局要用 1 張遊戲券（兩個人各用自己的；再來一局也要再用一張），
   免得學生一直下棋不練習。直接開這個檔案（不在平台裡）就不用券。 */
const $=s=>document.querySelector(s);
/* 和學習平台、搶答王同一個 Firebase 專案 */
const FIREBASE_CONFIG={ apiKey:"AIzaSyD-frW7ISsXAHsv1DSZpGzvn_ok9t1NJ4U", authDomain:"quiz601.firebaseapp.com", databaseURL:"https://quiz601-default-rtdb.asia-southeast1.firebasedatabase.app", projectId:"quiz601", storageBucket:"quiz601.firebasestorage.app", messagingSenderId:"994429474121", appId:"1:994429474121:web:dc20be249385db6a60b698" };
const NAMES={K:'帥',A:'仕',B:'相',N:'傌',R:'俥',C:'炮',P:'兵',k:'將',a:'士',b:'象',n:'馬',r:'車',c:'砲',p:'卒'};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const myId=(()=>{let v=null;try{v=sessionStorage.getItem('xq_id')}catch(e){}if(!v){v=Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('xq_id',v)}catch(e){}}return v})();

/* ---- 連線：Firebase，或同一台電腦分頁間的本機模式 ---- */
const loadJS=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const timeout=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);
function localNet(){
  const KEY='xq601_localdb',read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}};
  const getP=(o,p)=>p.split('/').filter(Boolean).reduce((x,k)=>x==null?undefined:x[k],o);
  const setP=(o,p,v)=>{const ks=p.split('/').filter(Boolean);for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||!o[ks[i]])o[ks[i]]={};o=o[ks[i]]}const l=ks[ks.length-1];if(v==null)delete o[l];else o[l]=JSON.parse(JSON.stringify(v))};
  const L=new Set(),fire=()=>{const d=read();L.forEach(l=>l.cb(getP(d,l.p)??null))};
  addEventListener('storage',e=>{if(e.key===KEY)fire()});
  const write=f=>{const d=read();f(d);localStorage.setItem(KEY,JSON.stringify(d));fire()};
  return {mode:'local',get:async p=>getP(read(),p)??null,set:async(p,v)=>write(d=>setP(d,p,v)),
    update:async(p,v)=>write(d=>{for(const k in v)setP(d,p+'/'+k,v[k])}),remove:async p=>write(d=>setP(d,p,null)),
    on:(p,cb)=>{const l={p,cb};L.add(l);setTimeout(()=>cb(getP(read(),p)??null));return ()=>L.delete(l)}};
}
let Net=null;
const netReady=(async()=>{
  if(new URLSearchParams(location.search).has('local'))return Net=localNet();
  try{
    await timeout(loadJS('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'),10000);
    await timeout(loadJS('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js'),10000);
    const app=firebase.apps.find(a=>a.name==='xq')||firebase.initializeApp(FIREBASE_CONFIG,'xq'),db=app.database();
    Net={mode:'firebase',get:async p=>(await timeout(db.ref(p).get(),8000)).val(),set:(p,v)=>db.ref(p).set(v),update:(p,v)=>db.ref(p).update(v),remove:p=>db.ref(p).remove(),
      on:(p,cb)=>{const r=db.ref(p),h=s=>cb(s.val());r.on('value',h);return ()=>r.off('value',h)}};
  }catch(e){Net=localNet()}
  return Net})();

/* ---- 我是誰：在學習平台裡就用座號 ---- */
let P=null;try{P=window.parent!==window&&window.parent.__learn601}catch(e){}
function myName(){const s=P&&P.seat&&P.seat();if(s)return s>=98?'測試帳號 '+(s===99?1:2):s+' 號';return LS.get('xq_name','')}
/* 遊戲券:在平台裡一局用 1 張 */
const inPlat=()=>!!(P&&P.useTicket&&P.seat&&P.seat());
const hasTicket=()=>!inPlat()||(P.isTest&&P.isTest())||P.seat()===99||(P.tickets()||0)>0;
const payTicket=()=>!inPlat()||P.useTicket('xq');
const mySeat=()=>inPlat()?P.seat():0;
const NO_TK='遊戲券不夠：下一局象棋要用 1 張遊戲券，回平台練習 10 題答對 8 題就能拿到！';
function paintMe(){const n=myName();$('#me').innerHTML=(n?`我是 <b>${n}</b>`+(inPlat()?'':' <button id="bName">改名字</button>'):'<button id="bName">先輸入你的名字</button>')
    +(inPlat()?`<div style="margin-top:.3rem">🎟️ 遊戲券 × ${P.tickets()||0}　<small>（一局用 1 張）</small></div>`:'');
  const b=$('#bName');if(b)b.onclick=askName}
function askName(){const v=(prompt('你的名字或座號：',LS.get('xq_name',''))||'').trim().slice(0,10);if(v){LS.set('xq_name',v);paintMe()}return v}

/* ---- 音效 ---- */
let AC=null;function tone(f,d,type='triangle',v=.08,at=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={flip(){tone(300,.06,'triangle',.06);tone(620,.1,'triangle',.06,.05)},move(){tone(420,.08,'square',.05);tone(260,.12,'sine',.06,.03)},cap(){tone(180,.18,'sawtooth',.06);tone(520,.1,'triangle',.06,.05)},chk(){[880,660].forEach((f,i)=>tone(f,.18,'square',.05,i*.12))},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.07,i*.1))}};

/* ═════════════ 棋盤 ═════════════ */
const NS='http://www.w3.org/2000/svg',svg=$('#board');
const mk=(p,t,a={},txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e};
const G={mode:'',pin:'',me:'r',st:null,players:{},sel:-1,flip:false,un:[],lastLen:0,type:'xq'};
/* 遊戲種類:xq 象棋、aq 暗棋(網址 ?g=aq 或上次選的) */
const GNAME={xq:'象棋',aq:'暗棋'};
G.type=(q=>q==='aq'||q==='xq'?q:LS.get('xq_type','xq'))(new URLSearchParams(location.search).get('g'));
function setType(t){G.type=t;LS.set('xq_type',t);document.querySelectorAll('#types button,#pickT button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#logoT').textContent=GNAME[t]+'對戰';$('#aqRule').hidden=t!=='aq';document.title='601 '+GNAME[t]+'對戰';$('#pickG').textContent=GNAME[t];
  document.querySelectorAll('.logo span').forEach((s,i)=>s.textContent=t==='aq'?(i?'暗':'翻'):(i?'將':'帥'))}
document.querySelectorAll('#types button,#pickT button').forEach(b=>b.onclick=()=>{if(G.mode)return;setType(b.dataset.t);paintRec()});
const view=i=>{const c=i%9,r=(i/9)|0;return G.flip?[8-c,9-r]:[c,r]};
function drawGrid(){
  if(G.type==='aq')return aqGrid();
  svg.innerHTML='';svg.setAttribute('viewBox','-60 -60 920 1020');svg.style.aspectRatio='920/1020';svg.classList.remove('aq');
  mk(svg,'rect',{x:-55,y:-55,width:910,height:1010,rx:28,fill:'#e9c38a',stroke:'#a8743a','stroke-width':8});
  const g=mk(svg,'g',{stroke:'#6b4423','stroke-width':3,fill:'none'});
  mk(g,'rect',{x:0,y:0,width:800,height:900,'stroke-width':5});
  for(let r=1;r<9;r++)mk(g,'line',{x1:0,y1:r*100,x2:800,y2:r*100});
  for(let c=1;c<8;c++){mk(g,'line',{x1:c*100,y1:0,x2:c*100,y2:400});mk(g,'line',{x1:c*100,y1:500,x2:c*100,y2:900})}
  [[0,200],[700,900]].forEach(([a,b])=>{mk(g,'line',{x1:300,y1:a,x2:500,y2:b});mk(g,'line',{x1:500,y1:a,x2:300,y2:b})});
  const river=mk(svg,'g',{'font-size':54,'font-weight':900,fill:'#8a5a2b','text-anchor':'middle','font-family':"'Kaiti TC','BiauKai',serif"});

  if(!hasTicket()){alert(NO_TK);return leave()}
  if(G.mode==='solo'){G.st={phase:'play',moves:'',g:(G.st.g||1)+1,...(G.type==='aq'?{deck:AQ.deal()}:{})};G.lastLen=-1;onState();return}
  const pl=G.players;if(!pl.r||!pl.b){msg('');return leave()}
  try{await Net.set(`rooms/${G.pin}/players`,{r:pl.b,b:pl.r});await Net.update(`rooms/${G.pin}/state`,{phase:'play',moves:'',turn:'r',g:(G.st.g||1)+1,winner:null,reason:null,t:Date.now(),...(G.type==='aq'?{deck:AQ.deal()}:{})})}catch(e){}};

/* ═════════════ 邀請同學（在學習平台裡） ═════════════
   選同學 → 先開好房間 → 平台送出邀請；對方在平台按「接受」就會自動加入（chess.html?join=房號）。
   對方按「下次再說」或遊戲券不夠時，會在 rooms/房號/dec 留話，這邊的等待畫面看得到。 */
G.inv=0;
function uninvite(){if(G.inv&&inPlat()&&P.uninvite)P.uninvite(G.inv);G.inv=0}
async function openPick(){if(!inPlat()||!P.seats)return;if(!hasTicket())return msg(NO_TK);
  const L=$('#pickList');L.innerHTML='讀取中…';$('#pick').classList.add('on');
  let on={};try{on=await P.online()}catch(e){}
  L.innerHTML='';P.seats().filter(s=>s!==P.seat()).forEach(s=>{const b=document.createElement('button');const live=!!on[s];
    b.className=live?'on':'';b.textContent=s>=98?'🧪 測試'+(s===99?1:2):P.seatName(s);b.dataset.s=s;b.disabled=!live;b.title=live?'在線上':'不在線上';b.onclick=()=>invite(s);L.appendChild(b)});
  if(!L.children.length)L.textContent='現在沒有其他同學'}
$('#pickX').onclick=()=>$('#pick').classList.remove('on');
$('#bInv').onclick=openPick;
async function invite(s){$('#pick').classList.remove('on');await $('#bNew').onclick();if(!G.pin||G.mode!=='net')return;
  try{await P.invite(s,G.pin,G.type);G.inv=s;$('#waitNote').textContent=`已經邀請 ${P.seatName(s)}，等他按「接受」…`;$('#invMsg').textContent=''}catch(e){$('#invMsg').textContent='邀請送不出去，請檢查網路'}
  G.un.push(Net.on(`rooms/${G.pin}/dec`,v=>{if(!v||!$('#wait').classList.contains('on'))return;G.inv=0;
    $('#invMsg').textContent=v.why==='noticket'?`${P.seatName(v.s)} 的遊戲券用完了，請他先去練習`:`${P.seatName(v.s)} 說下次再玩`}))}
setType(G.type);paintMe();paintRec();if(inPlat()&&P.invite)$('#bInv').hidden=false;
(async()=>{const q=new URLSearchParams(location.search);await netReady;
  if(q.get('join')){$('#pinIn').value=q.get('join');$('#bJoin').onclick()}
  else if(q.has('pick'))openPick()})();
netReady.then(n=>{$('#mode').textContent=n.mode==='local'?'⚠ 連不上雲端：現在是本機模式，只能在同一台電腦的不同分頁之間對下。':''});
window.__xq=G;
</script>
