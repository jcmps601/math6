<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>601 軍棋對戰</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;color:#3b2a1a;background:radial-gradient(ellipse at 50% 20%,#fff4dc 0%,#f6dfb3 70%,#eccb8f 100%);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
.scr{display:none;height:100%}.scr.on{display:flex}
.btn{border:0;border-radius:20px;font-size:1.6rem;font-weight:900;padding:.7rem 1.6rem;color:#fff;background:#c0392b;box-shadow:0 5px 0 #8e2a20}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8e2a20}
.btn.b{background:#2f3640;box-shadow:0 5px 0 #11151a}.btn.g{background:#fff;color:#7a5a32;box-shadow:0 5px 0 #d9b97f}
/* 首頁 */
#home,#wait{flex-direction:column;align-items:center;justify-content:flex-start;gap:1.2rem;padding:1rem;text-align:center;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
/* 放得下就置中，放不下就從上面開始排、可以捲動（不會被切掉） */
#home>:first-child,#wait>:first-child{margin-top:auto}#home>:last-child,#wait>:last-child{margin-bottom:auto}
#home>*,#wait>*{flex:none;max-width:100%}
.logo{font-size:clamp(2.4rem,6vw,4rem);font-weight:900;letter-spacing:.1em;color:#8e2a20;text-shadow:0 4px 0 #fff8}
/* 帥、將的圓圈:字縮小、拿掉字距,才會在圓圈正中間 */
.logo span{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;font-size:.72em;line-height:1;letter-spacing:0;width:1.75em;height:1.75em;border-radius:50%;background:#fffaf0;border:.1em solid #c0392b;color:#c0392b;margin:0 .25em;box-shadow:0 .1em 0 #d9b97f;text-shadow:none}
#me{font-size:1.3rem;font-weight:900;color:#7a5a32}#me button{border:0;background:none;color:#c0392b;font-size:1.1rem;font-weight:900;text-decoration:underline}
.menu{display:flex;flex-direction:column;gap:1rem;width:min(26rem,100%)}
.join{display:flex;gap:.6rem}
#pinIn{flex:1;min-width:0;font:900 2rem 'Avenir Next',Arial,sans-serif;text-align:center;letter-spacing:.3em;border:4px solid #d9b97f;border-radius:18px;padding:.4rem;background:#fffaf0;color:#3b2a1a}
#msg{min-height:1.5em;font-size:1.2rem;font-weight:900;color:#c0392b}
.note{font-size:1rem;color:#9a7a52;font-weight:800;max-width:30rem}
#pinBig{font:900 clamp(4rem,14vw,8rem) 'Avenir Next',Arial,sans-serif;letter-spacing:.15em;color:#c0392b;background:#fffaf0;border-radius:28px;padding:.2rem 1.5rem;box-shadow:0 6px 0 #d9b97f}
/* 對局 */
#game{align-items:stretch;justify-content:center;gap:1rem;padding:.8rem}
#boardWrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
#board{height:100%;max-height:100%;max-width:100%;aspect-ratio:920/1020;touch-action:manipulation}
#side{width:min(18rem,34vw);display:flex;flex-direction:column;gap:.8rem}
.pl{background:#fffaf0;border-radius:20px;padding:.6rem .9rem;box-shadow:0 4px 0 #d9b97f;display:flex;align-items:center;gap:.6rem;border:4px solid transparent}
.pl.turn{border-color:#f59f00;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 4px 0 #d9b97f,0 0 18px #ffd43b}}
.pl i{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:1.5rem;font-weight:900;background:#fffaf0;border:3px solid}
.pl.r i{color:#c0392b;border-color:#c0392b}.pl.b i{color:#222;border-color:#222}
.pl b{font-size:1.3rem;display:block}.pl small{font-size:.95rem;color:#9a7a52;font-weight:800}
#status{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:1.6rem;font-weight:900;color:#7a5a32;gap:.4rem}
#status .chk{color:#fff;background:#c0392b;border-radius:14px;padding:.2rem .9rem;font-size:2rem;animation:pop .4s}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
#acts{display:flex;flex-direction:column;gap:.6rem}#acts .btn{font-size:1.25rem;padding:.55rem}
#side .code{text-align:center;font-weight:900;color:#9a7a52;font-size:1rem}
/* 結束 */
#over{position:fixed;inset:0;background:rgba(40,25,10,.45);display:none;align-items:center;justify-content:center;z-index:9}
#over.on{display:flex}
#over .box{background:#fffaf0;border-radius:28px;padding:1.6rem 2.2rem;text-align:center;display:flex;flex-direction:column;gap:.8rem;animation:pop .3s;max-width:92vw}
#over .t{font-size:2.6rem;font-weight:900}#over .s{font-size:1.3rem;font-weight:800;color:#9a7a52}
#ovN{color:#e8590c!important;font-size:1.15rem!important}#ovN:empty{display:none}#bAgain:disabled{opacity:.38;filter:grayscale(1);cursor:not-allowed;box-shadow:none}
#over .row{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
/* 棋盤 SVG */
.pc text{font-family:'Kaiti TC','BiauKai','DFKai-SB','STKaiti','PingFang TC',serif;font-weight:900;pointer-events:none}
@media (orientation:portrait),(max-width:760px){#game{flex-direction:column;padding:.5rem;gap:.5rem}#side{width:100%;flex-direction:row;flex-wrap:wrap;gap:.5rem}
 .pl{flex:1 1 40%}#status{flex:1 1 100%;order:3;font-size:1.3rem;min-height:2.6rem}#acts{flex:1 1 100%;flex-direction:row;order:4}#acts .btn{flex:1}#side .code{order:5;flex:1 1 100%}}

/* 邀請同學、戰績 */
#pick{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:1rem}
#pick.on{display:flex}
#pick .box{background:#fffaf0;border-radius:24px;padding:1rem 1.2rem;width:min(40rem,100%);max-height:100%;overflow:auto;text-align:center;border:5px solid #d9b97f}
#pick .t{font-size:1.6rem;font-weight:900;color:#8e2a20}#pick .s{color:#7a5a32;font-weight:800;margin:.2rem 0 .7rem}
#pickList{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.45rem;margin-bottom:.8rem}
#pickList button{border:3px solid #e9d5ae;background:#fff;border-radius:14px;font-size:1.25rem;font-weight:900;color:#aaa;padding:.45rem .2rem}
#pickList button.on{border-color:#2f9e44;background:#ebfbee;color:#2b8a3e}
#pickList button.on::before{content:'● ';color:#2f9e44}
#pickList button:disabled{opacity:.5}
#invMsg{font-size:1.4rem;font-weight:900;color:#8e2a20;min-height:1.6em}
#rec{font-size:1.15rem;font-weight:800;color:#7a5a32;margin-top:.3rem}
#rec b{color:#c0392b}

/* 象棋／暗棋切換 */
#types,.types{display:flex;justify-content:center;width:max-content;margin:0 auto .5rem;gap:.5rem;background:#f3e2c0;border-radius:999px;padding:.3rem}
#types button,.types button{border:0;border-radius:999px;font-size:1.3rem;font-weight:900;padding:.4rem 1.2rem;background:none;color:#9a7a52}
#types button.on,.types button.on{background:#fff;color:#8e2a20;box-shadow:0 3px 0 #d9b97f}
.logo em{font-style:normal}
#aqRule,#pdRule{background:#fffaf0;border-radius:16px;padding:.5rem .9rem;line-height:1.6;color:#7a5a32;font-size:1.05rem}#aqRule b,#pdRule b{color:#c0392b}
#pickG{color:#c0392b}
/* 暗棋 */
.aq .pc.dn circle.f{fill:url(#aqBack)}
.pl.q i{color:#9a7a52;border-color:#d9b97f}
.capr{display:flex;flex-wrap:wrap;gap:.15rem;margin-top:.2rem}.capr span{font-size:.95rem;width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid;font-weight:900;font-family:'Kaiti TC','BiauKai','DFKai-SB',serif}
.capr span.r{color:#c0392b;border-color:#c0392b}.capr span.b{color:#222;border-color:#222}
/* 選同學：每一格一樣大 */
#pickList{grid-auto-rows:3.3rem}
#pickList button{height:3.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.2rem}

/* 直拿：棋盤縮到放得下，下面的玩家、按鈕一定看得到 */
#boardWrap{min-height:0;min-width:0}
@media (orientation:portrait),(max-width:760px){#boardWrap{flex:1 1 0;overflow:hidden}#board{height:100%;width:auto;max-width:100%}}

/* 手機橫拿（很矮）：右邊的玩家、按鈕縮小，全部放得下 */
@media (orientation:landscape) and (max-height:520px){
 #game{padding:.4rem;gap:.5rem}#side{gap:.35rem;overflow:auto}
 .pl{padding:.25rem .5rem;border-width:3px}.pl i{width:2rem;height:2rem;font-size:1.1rem}.pl b{font-size:1rem}.pl small{font-size:.8rem}
 #status{font-size:1.05rem;gap:.2rem}#status .chk{font-size:1.2rem}
 #acts{flex-direction:row;gap:.35rem}#acts .btn{font-size:.95rem;padding:.35rem .4rem;flex:1}
 #side .code{font-size:.8rem}.capr span{width:1.2rem;height:1.2rem;font-size:.75rem}
}

/* ═══ 大砲對轟 ═══ */
#pdCv,#pdCtl{display:none}
#game.pd{flex-direction:column;padding:.5rem;gap:.5rem;background:linear-gradient(#cfeaff,#fdf2dc)}
#game.pd #board{display:none}#game.pd #pdCv{display:block;border-radius:18px;box-shadow:0 6px 18px rgba(30,60,90,.25);touch-action:none}
#game.pd #boardWrap{flex:1 1 0;min-height:0}
#game.pd #side{width:100%;flex-direction:row;align-items:stretch;gap:.5rem;flex:none}
#game.pd .pl{display:none}
#game.pd #status{display:none!important}
#game.pd #pdCtl{display:flex;flex:1;min-width:0;gap:.45rem;align-items:stretch;background:#fffaf0;border-radius:18px;box-shadow:0 4px 0 #d9b97f;padding:.45rem;position:relative}
#game.pd #acts{flex:0 0 auto;width:6.2rem;flex-direction:column;order:2;gap:.4rem}#game.pd #acts .btn{font-size:1rem;padding:.4rem .3rem;flex:1}
#game.pd #side .code{display:none}
#game.pd #offMsg{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:8;font-size:1.4rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pdw{display:flex;flex-direction:column;gap:.3rem;flex:0 0 auto}
.pdw button{display:flex;align-items:center;gap:.3rem;border:3px solid #e9d5ae;background:#fff;border-radius:12px;padding:.15rem .5rem;font-weight:900;color:#7a5a32;font-size:.95rem;min-width:7.6rem}
.pdw button span{font-size:1.2rem}.pdw button em{margin-left:auto;font-style:normal;font-size:.85rem;color:#9a7a52}
.pdw button.on{border-color:#f59f00;background:#fff3bf;color:#c2410c}
.pdw button:disabled{opacity:.4}
.pdk{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:.2rem;position:relative;padding:1.35rem .35rem .35rem;background:#f6ead3;border-radius:14px}
.pdk label{position:absolute;top:.15rem;left:0;right:0;text-align:center;font-weight:900;color:#9a7a52;font-size:.95rem}
.pdk{flex-direction:row;align-items:center}
.pdk button{flex:none;width:2.9rem;height:2.9rem;border:0;border-radius:14px;background:#2f3640;color:#fff;font-size:1.3rem;font-weight:900;box-shadow:0 4px 0 #11151a;touch-action:none}
.pdk button:active{transform:translateY(2px);box-shadow:0 2px 0 #11151a}
.pdk>b{flex:1;text-align:center;font-size:1.7rem;font-weight:900;color:#1f2937;font-family:'Avenir Next',Arial,sans-serif}
.pdbar{flex:1;min-width:2.5rem;height:2.2rem;margin:0 .35rem;background:#e5e7eb;border-radius:12px;position:relative;overflow:hidden;touch-action:none}
.pdbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#fde047,#f97316,#dc2626);border-radius:12px}
.pdbar.fuel i{background:linear-gradient(90deg,#86efac,#22c55e)}
.pdbar b{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:1.25rem;color:#111;text-shadow:0 0 4px #fff,0 0 4px #fff;font-family:'Avenir Next',Arial,sans-serif}
#pdFire{flex:0 0 auto;width:7.4rem;border:0;border-radius:18px;font-size:1.5rem;font-weight:900;color:#fff;background:linear-gradient(#ff8a3d,#e8590c);box-shadow:0 5px 0 #a0400a;touch-action:none}
#pdFire:active{transform:translateY(3px);box-shadow:0 2px 0 #a0400a}
#pdCtl[data-side="b"] #pdFire{background:linear-gradient(#60a5fa,#2563eb);box-shadow:0 5px 0 #1e40af}
#pdCtl.off .pdk,#pdCtl.off .pdw,#pdCtl.off #pdFire{opacity:.35;filter:grayscale(.6)}
#pdWait{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;color:#7a5a32;pointer-events:none;text-shadow:0 0 8px #fffaf0,0 0 8px #fffaf0,0 0 8px #fffaf0}
#pdCtl.off #pdWait:not(:empty){display:flex}
/* 直拿、窄：控制區分兩排；遊戲畫面貼著控制區，上面空的地方提醒轉橫的 */
@media (orientation:portrait),(max-width:860px) and (min-height:561px){
 #game.pd #boardWrap{flex-direction:column;justify-content:flex-end;align-items:center;gap:.6rem}
 #game.pd #boardWrap::before{content:'📱 把平板轉成橫的，畫面會更大';font-size:1.1rem;font-weight:900;color:#7a8ca0;margin-bottom:auto;padding-top:1rem}
 #game.pd #side{flex-wrap:wrap}#game.pd #pdCtl{flex:1 1 100%;flex-wrap:wrap;order:-1}
 .pdw{flex-direction:row;flex:1 1 100%}.pdw button{flex:1;min-width:0;justify-content:center}.pdw button b{font-size:.85rem}
 .pdk{flex:1 1 40%}#pdFire{flex:1 1 100%;height:3.2rem}
 #game.pd #acts{flex:1 1 100%;width:auto;flex-direction:row}}
/* 手機橫拿（很矮）：控制區放右邊 */
@media (orientation:landscape) and (max-height:560px){
 #game.pd{flex-direction:row;padding:.35rem;gap:.35rem}
 #game.pd #side{width:15.5rem;flex-direction:column;flex-wrap:nowrap;overflow:auto}
 #game.pd #pdCtl{flex-direction:column;flex:1 1 auto;padding:.35rem;gap:.3rem;order:0}
 .pdw{flex-direction:row}.pdw button{flex:1;min-width:0;padding:.1rem .2rem;justify-content:center}.pdw button b{display:none}
 .pdk{padding:.2rem .3rem}.pdk label{position:static;width:2.2rem;font-size:.8rem}.pdk button{width:2.3rem;height:2.3rem;font-size:1rem}.pdk>b{font-size:1.2rem}.pdbar{height:1.8rem}
 #pdFire{width:auto;height:2.6rem;font-size:1.2rem}
 #game.pd #acts{width:auto;flex-direction:row}#game.pd #acts .btn{font-size:.85rem;padding:.3rem}}
#offMsg{background:#fff3bf;border:3px solid #f59f00;border-radius:16px;padding:.4rem .8rem;font-size:1.15rem;font-weight:900;color:#e8590c;text-align:center}
#offMsg b{font-size:1.6rem;color:#c0392b}
/* ═══ 依螢幕大小調整首頁、等待畫面 ═══ */
.btn{font-size:clamp(1.1rem,min(4.6vw,3.6vh),1.6rem);padding:clamp(.45rem,1.6vh,.7rem) clamp(1rem,3vw,1.6rem)}
.logo{font-size:clamp(1.9rem,min(7vw,7.5vh),4rem)}
#pinIn{font-size:clamp(1.4rem,min(6vw,4.5vh),2rem)}
#types button,.types button{font-size:clamp(1rem,min(3.6vw,3vh),1.3rem);padding:.35rem clamp(.6rem,2.2vw,1.2rem)}
#aqRule,#pdRule{font-size:clamp(.9rem,min(3.4vw,2.6vh),1.05rem)}
#me{font-size:clamp(1rem,min(4vw,3vh),1.3rem)}
#pinBig{font-size:clamp(3rem,min(14vw,16vh),8rem)}
@media (max-height:760px){#home,#wait{gap:.7rem}.menu{gap:.6rem}}
@media (max-height:560px){#home,#wait{gap:.45rem;padding:.6rem}.menu{gap:.45rem}.logo span{display:none}}
/* 橫的但不高（筆電、平板橫拿、在平台裡）：分左右兩欄，一眼看完 */
@media (orientation:landscape) and (max-height:720px) and (min-width:700px){
 #home.scr.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-rows:min-content;align-content:safe center;justify-items:center;column-gap:clamp(1rem,4vw,3rem);row-gap:.6rem;padding:.8rem clamp(1rem,4vw,3rem)}
 #home>:first-child{margin-top:0}#home>:last-child{margin-bottom:0}
 #types{grid-column:1/-1;grid-row:1}
 #home .logo{grid-column:1;grid-row:2}#aqRule,#pdRule{grid-column:1;grid-row:3}#me{grid-column:1;grid-row:4}#mode{grid-column:1;grid-row:5}#rec{grid-column:1;grid-row:6}
 #home .menu{grid-column:2;grid-row:2/span 4;align-self:center;width:100%;max-width:26rem}#msg{grid-column:2;grid-row:6}}
#types button .ti,.types button .ti,.btn .ti,#me .ti{width:1.6em;height:1.6em;vertical-align:-.45em;margin-right:.3em;pointer-events:none}#pick .t .ti.big{width:1.5em;height:1.5em;vertical-align:-.35em;margin-right:.3em}
</style></head><body>

<section class="scr on" id="home">
  <div id="types"><button data-t="xq"><img class="ti" src="img/ui/vs-xq.webp" alt="" draggable="false">軍棋</button><button data-t="aq"><img class="ti" src="img/ui/vs-aq.webp" alt="" draggable="false">暗棋</button><button data-t="pd"><img class="ti" src="img/ui/vs-pd.webp" alt="" draggable="false">大砲對轟</button></div>
  <div class="logo"><span>帥</span><em id="logoT">軍棋對戰</em><span>將</span></div>
  <div class="note" id="aqRule" hidden>32 顆棋全部蓋著：輪到你就<b>翻一顆</b>或<b>走一格</b>。第一顆翻到什麼顏色，你就是那一方。<br>大吃小（兵卒可以吃帥將）；炮要<b>隔一顆</b>才能吃。對方的棋被吃光就贏了！</div>
  <div class="note" id="pdRule" hidden>輪到你：可以先<b>開車</b>移動一下，再調<b>角度</b>和<b>力道</b>發射砲彈（也可以直接在畫面上拖）。<br>注意上面的<b>風向</b>！先把對方的血打到 0 就贏了。</div>
  <div id="me"></div>
  <div class="menu">
    <button class="btn" id="bNew">🏠 建立房間（我先下・紅方）</button>
    <div class="join"><input id="pinIn" inputmode="numeric" maxlength="4" placeholder="房號"><button class="btn b" id="bJoin"><img class="ti" src="img/ui/ic-room-join.webp" alt="" draggable="false">加入</button></div>
    <button class="btn g" id="bLocal">👥 同一台平板兩人輪流下</button>
    <button class="btn" id="bInv" hidden><img class="ti" src="img/ui/vs-inv.webp" alt="">邀請同學對戰</button>
  </div>
  <div id="msg"></div>
  <div class="note" id="mode"></div>
  <div id="rec"></div>
</section>

<section class="scr" id="wait">
  <div class="logo" style="font-size:2rem">等同學加入…</div>
  <div id="pinBig">----</div>
  <div class="note" id="waitNote">把房號告訴要一起下的同學，他在「加入」輸入房號就可以開始。</div>
  <div id="invMsg"></div>
  <button class="btn g" id="bCancel">取消</button>
</section>

<section class="scr" id="game">
  <div id="boardWrap"><svg id="board" viewBox="-60 -60 920 1020"></svg><canvas id="pdCv"></canvas></div>
  <aside id="side">
    <div class="pl b" id="plTop"><i>將</i><div><b id="nmTop"></b><small id="smTop"></small></div></div>
    <div id="status"></div>
    <div class="pl r" id="plBot"><i>帥</i><div><b id="nmBot"></b><small id="smBot"></small></div></div>
    <div id="pdCtl" data-noico></div>
    <div id="acts"><button class="btn g" id="bUndo" hidden><img class="ti" src="img/ui/ic-undo.webp" alt="" draggable="false">悔棋</button><button class="btn b" id="bResign"><img class="ti" src="img/ui/ic-resign.webp" alt="" draggable="false">認輸</button><button class="btn g" id="bLeave">離開</button></div>
    <div class="code" id="code"></div>
  </aside>
</section>

<div id="over"><div class="box"><div class="t" id="ovT"></div><div class="s" id="ovS"></div><div class="s" id="ovN"></div><div class="row"><button class="btn" id="bAgain">🔁 再來一局（換邊）</button><button class="btn g" id="bOut">離開</button></div></div></div>

const FIREBASE_CONFIG={ apiKey:"AIzaSyD-frW7ISsXAHsv1DSZpGzvn_ok9t1NJ4U", authDomain:"quiz601.firebaseapp.com", databaseURL:"https://quiz601-default-rtdb.asia-southeast1.firebasedatabase.app", projectId:"quiz601", storageBucket:"quiz601.firebasestorage.app", messagingSenderId:"994429474121", appId:"1:994429474121:web:dc20be249385db6a60b698" };

/* ---- 連線：Firebase，或同一台電腦分頁間的本機模式 ---- */
const loadJS=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const timeout=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);
function localNet(){
  const KEY='xq601_localdb',read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}};
  const getP=(o,p)=>p.split('/').filter(Boolean).reduce((x,k)=>x==null?undefined:x[k],o);
  const setP=(o,p,v)=>{const ks=p.split('/').filter(Boolean);for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||!o[ks[i]])o[ks[i]]={};o=o[ks[i]]}const l=ks[ks.length-1];if(v==null)delete o[l];else o[l]=JSON.parse(JSON.stringify(v))};
  const L=new Set(),fire=()=>{const d=read();L.forEach(l=>l.cb(getP(d,l.p)??null))};
  addEventListener('storage',e=>{if(e.key===KEY)fire()});
  const write=f=>{const d=read();f(d);localStorage.setItem(KEY,JSON.stringify(d));fire()};
  return {mode:'local',get:async p=>getP(read(),p)??null,set:async(p,v)=>write(d=>setP(d,p,v)),
    update:async(p,v)=>write(d=>{for(const k in v)setP(d,p+'/'+k,v[k])}),remove:async p=>write(d=>setP(d,p,null)),
    on:(p,cb)=>{const l={p,cb};L.add(l);setTimeout(()=>cb(getP(read(),p)??null));return ()=>L.delete(l)},
    onDisc:()=>{},onDiscRm:()=>{},cancelDisc:()=>{},conn:cb=>{cb(true);return ()=>{}}};
}
let Net=null;

    await timeout(loadJS('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'),10000);
    await timeout(loadJS('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js'),10000);
    const app=firebase.apps.find(a=>a.name==='xq')||firebase.initializeApp(FIREBASE_CONFIG,'xq'),db=app.database();
    Net={mode:'firebase',get:async p=>(await timeout(db.ref(p).get(),8000)).val(),set:(p,v)=>db.ref(p).set(v),update:(p,v)=>db.ref(p).update(v),remove:p=>db.ref(p).remove(),
      on:(p,cb)=>{const r=db.ref(p),h=s=>cb(s.val());r.on('value',h);return ()=>r.off('value',h)},
      /* 斷線(關掉、上一頁、平板睡著)時,雲端自動幫我寫「我離線了」的時間 */

      /* 斷線時雲端自動刪掉(等人加入的房間用:開房的人關掉、回平台,房間就不會留著) */
      onDiscRm:p=>{try{db.ref(p).onDisconnect().remove()}catch(e){}},cancelDisc:p=>{try{db.ref(p).onDisconnect().cancel()}catch(e){}},
      conn:cb=>{const r=db.ref('.info/connected'),h=s=>cb(!!s.val());r.on('value',h);return ()=>r.off('value',h)}};
  }catch(e){Net=localNet()}
  return Net})();

function render(){

   4 × 8 格，棋放在格子正中間；平板直拿時把棋盤轉成 8 列 × 4 行，棋才不會太小 */
const sideName=s=>{if(G.type==='pd')return s==='r'?'紅隊':'藍隊';if(G.type!=='aq')return s==='r'?'紅方':'黑方';const c=G.R&&G.R.col&&G.R.col[s];return c?(c==='r'?'紅方':'黑方'):(s===G.me?'我':'對方')};
const AQV=()=>innerHeight>innerWidth*1.05;   // 直的
const aqXY=i=>{const r=(i/8)|0,c=i%8;return AQV()?[r,7-c]:[c,r]};
function aqGrid(){const v=AQV(),W=v?4:8,H=v?8:4,S=110;
  svg.innerHTML='';svg.classList.add('aq');svg.setAttribute('viewBox',`-20 -20 ${W*S+40} ${H*S+40}`);svg.style.aspectRatio=`${W*S+40}/${H*S+40}`;G.aqv=v;
  const defs=mk(svg,'defs');const pt=mk(defs,'pattern',{id:'aqBack',width:16,height:16,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'});

  for(let r=0;r<=H;r++)mk(g,'line',{x1:0,y1:r*S,x2:W*S,y2:r*S});for(let k=0;k<=W;k++)mk(g,'line',{x1:k*S,y1:0,x2:k*S,y2:H*S});
  G.layer=mk(svg,'g')}
function aqRender(){const st=G.st||{moves:''},R=AQ.replay(st.deck,st.moves||'');G.R=R;if(G.aqv!==AQV())aqGrid();
  const L=G.layer;L.innerHTML='';const S=110,ctr=i=>{const [x,y]=aqXY(i);return [x*S+S/2,y*S+S/2]};

    mk(g,'circle',{r:46,fill:'#7a4a1c',cy:5});

    const red=AQ.color(x.p)==='r';
    mk(g,'circle',{r:46,fill:i===G.sel?'#fff3bf':'#fff6e0',stroke:red?'#c0392b':'#222','stroke-width':5});

  /* 兩位玩家:上面是對方、下面是我(同一台時:上面後下的人、下面先下的人) */
  const top=G.mode==='net'&&G.me==='b'?'r':'b',bot=top==='r'?'b':'r';

  [['Top',top],['Bot',bot]].forEach(([k,s])=>{const col=R.col[s],el=$('#pl'+k);
    el.className='pl '+(col||'q')+(R.turn===s&&!R.over&&st.phase==='play'?' turn':'');el.querySelector('i').textContent=col?(col==='r'?'紅':'黑'):'？';

  $('#bUndo').hidden=G.mode!=='solo';

function aqTap(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
  const S=110,x=Math.floor(q.x/S),y=Math.floor(q.y/S),v=AQV();let c2,r2;if(v){r2=x;c2=7-y}else{c2=x;r2=y}if(c2<0||c2>7||r2<0||r2>3)return;

/* ═════════════ 大砲對轟（畫面在 pdv.js、規則在 pd.js） ═════════════ */
const pdHost={state:()=>G.st,canAct:()=>canMove(),solo:()=>G.mode==='solo',me:()=>G.mode==='net'?G.me:null,

async function pdPlay(tok){if(!canMove())return;const old={...G.st};
  const moves=(G.st.moves?G.st.moves+',':'')+tok,N=PD.replay(G.st.map,G.st.seed,moves),upd={moves,turn:N.turn,t:Date.now()};
  if(N.over){upd.phase='end';upd.winner=N.winner;upd.reason=N.reason}

  try{await Net.update(`rooms/${G.pin}/state`,upd)}catch(e){G.st=old;PDV.unlock();render();alert('連線失敗，這一發沒有送出，請再發射一次')}}
const canMove=()=>{const st=G.st;if(!st||st.phase!=='play'||!G.R||G.R.over)return false;return G.mode==='solo'||G.R.turn===G.me};
const replayNow=st=>G.type==='pd'?PD.replay(st.map,st.seed,st.moves||''):G.type==='aq'?AQ.replay(st.deck,st.moves||''):XQ.replay(st.moves||'');
/* 新的一局:暗棋要洗牌、大砲對轟要新地圖 */
const fresh=()=>G.type==='aq'?{deck:AQ.deal()}:G.type==='pd'?PD.newGame():{};
/* 點棋盤:先點自己的棋,再點綠點 */
svg.addEventListener('pointerdown',e=>{
  if(!canMove())return;e.preventDefault();if(G.type==='aq')return aqTap(e);
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
  let c=Math.round(q.x/100),r=Math.round(q.y/100);if(c<0||c>8||r<0||r>9)return;if(G.flip){c=8-c;r=9-r}
  const i=r*9+c,R=G.R,p=R.b[i];
  if(G.sel>=0&&R.legal.some(m=>m[0]===G.sel&&m[1]===i))return play([G.sel,i]);
  G.sel=p&&XQ.side(p)===R.turn?i:-1;if(G.sel>=0)tone(660,.05,'triangle',.04);render()});
async function play(m){
  if(G.type==='pd')return pdPlay(m);
  const R=G.R,aq=G.type==='aq',cap=aq?m[0]==='m'&&!!R.b[m[2]]:!!R.b[m[1]];G.sel=-1;
  const moves=(G.st.moves?G.st.moves+',':'')+(aq?AQ.enc(m):XQ.enc(m)),N=aq?AQ.replay(G.st.deck,moves):XQ.replay(moves);
  const upd={moves,turn:N.turn,t:Date.now()};
  if(aq){if(N.over){upd.phase='end';upd.winner=N.draw?'draw':N.winner;upd.reason=N.reason}}
  else if(N.over){upd.phase='end';upd.winner=XQ.other(N.turn);upd.reason=N.check?'將死':'困斃（沒有棋可以走）'}
  if(G.mode==='solo'){G.st={...G.st,...upd};onState()}
  else{G.st={...G.st,...upd};render();try{await Net.update(`rooms/${G.pin}/state`,upd)}catch(e){alert('連線失敗，這一步沒有送出，請再走一次');G.st.moves=R&&G.st.moves.split(',').slice(0,-1).join(',');render()}}

/* 收到棋局更新 */
function onState(){

  if(st.phase==='play'&&G.mode==='solo'&&(st.g||1)!==G.paid){if(payTicket())G.paid=st.g||1;else{alert(NO_TK);return leave()}}
  if(G.mode==='net')guard(st);const R=replayNow(st),len=(st.moves||'').split(',').filter(Boolean).length;
  if(len!==G.lastLen){if(len>G.lastLen&&R.check&&G.type==='xq')setTimeout(sfx.chk,150);G.lastLen=len;G.sel=-1}
  render();
  if(st.phase==='end'&&st.winner==='none'){$('#ovT').textContent='⏸️ 這局不算';$('#ovT').style.color='#7a5a32';$('#ovS').textContent=st.reason||'';$('#over').classList.add('on');if(inPlat()&&P.xqPending)P.xqPending(null);sendTk();paintAgain()}
  else if(st.phase==='end'){const w=st.winner,draw=w==='draw',mine=G.mode==='net'&&w===G.me;record(draw?2:w===G.me,st.reason,len);
    if(G.type==='pd'&&PDV.busy()){$('#over').classList.remove('on');return}   // 等砲彈、爆炸播完再跳結束畫面
    /* 暗棋:玩家是 r(先下)/b(後下),顏色要看翻到什麼 */
    const cw=G.type==='aq'&&!draw?(R.col&&R.col[w])||w:w,side=x=>G.type==='pd'?sideName(x):x==='r'?'紅方':'黑方';
    $('#ovT').textContent=draw?'🤝 和局':G.mode==='net'?(mine?'🎉 你贏了！':'再接再厲！'):(G.type==='pd'?(cw==='r'?'🔴 紅隊勝！':'🔵 藍隊勝！'):cw==='r'?'🔴 紅方勝！':'⚫ 黑方勝！');
    $('#ovT').style.color=draw?'#7a5a32':cw==='r'?'#c0392b':G.type==='pd'?'#2563eb':'#222';
    $('#ovS').textContent=(G.mode==='net'&&!draw?side(cw)+'勝・':'')+(st.reason||'')+(G.mode==='net'&&inPlat()&&!draw&&!mine&&!(P.isTest&&P.isTest())?'（用掉 1 張遊戲券）':'');
    if(!$('#over').classList.contains('on')){$('#over').classList.add('on');if(mine||G.mode==='solo')sfx.win()}paintAgain()}
  else $('#over').classList.remove('on');
}
/* 戰績:在平台裡、兩台連線下完一局,把勝負記到雲端(同一局只記一次;中途離開算輸) */
function record(win,reason,n){if(G.mode!=='net'||!inPlat()||!P.xqResult||!G.st)return;if(G.st.phase==='end'&&(!G.st.winner||G.st.winner==='none'))return;   // 還不知道誰贏就先不記
  const opp=G.players[XQ.other(G.me)];const k=`${gPre()}${G.pin}_${G.created||0}_${G.st.g||1}`;if(G.rec===k)return;G.rec=k;
  P.xqResult({k,o:opp&&opp.seat||0,w:win,r:reason||'',n:n||0,g:G.type});
  if(win===false&&G.charged!==k){G.charged=k;payTicket()}   // 連線對戰:輸的人才扣 1 張券(贏的、和局不扣)
  sendTk();

async function paintRec(){const e=$('#rec');if(!e)return;if(!inPlat()||!P.xqStats){e.textContent='';return}
  try{const s=await P.xqStats(G.type);e.innerHTML=s.n?`我的${GNAME[G.type]}戰績：<b>${s.w}</b> 勝 ${s.l} 敗${s.d?` ${s.d} 和`:''}（共 ${s.n} 局）`:`還沒有下過${GNAME[G.type]}對戰，快邀請同學吧！`}catch(x){}}

/* ═════════════ 中途跑掉怎麼辦 ═════════════
   ・對局中每個人在雲端都有「斷線就自動寫離線時間」(players/我/off)；按上一頁、關掉、平板睡著都算斷線。
   ・對方看到我離線：畫面倒數 20 秒，20 秒內沒回來就判對方贏（只是網路斷一下、馬上回來就可以繼續）。
   ・在平台裡按「回平台」或上一頁：平台會先問「現在離開算你輸」，確定就跟認輸一樣。
   ・跑掉的人：平台記得「有一局還沒下完」，下次登入時補記輸、補扣券。 */
const OFF_MS=20000;
const gameKey=()=>`${gPre()}${G.pin}_${G.created||0}_${(G.st&&G.st.g)||1}`;
function guard(st){
  const playing=st.phase==='play'&&!!(G.players.r&&G.players.b);
  /* 再來一局時我已經沒有遊戲券了：這局不算，回去練習 */
  if(playing&&G.armed!==gameKey()&&!st.moves&&!hasTicket()){Net.update(`rooms/${G.pin}/state`,{phase:'end',winner:'none',reason:`${inPlat()&&P.seatName?P.seatName(P.seat()):'對手'}的遊戲券用完了，這局不算`,t:Date.now()}).catch(()=>{});return}
  if(playing&&G.armed!==gameKey()){G.armed=gameKey();sendTk();
    const p=`rooms/${G.pin}/players/${G.me}/off`;Net.set(p,null).catch(()=>{});Net.onDisc(p);
    if(!G.unConn){G.unConn=Net.conn(on=>{if(on&&G.mode==='net'&&G.st&&G.st.phase==='play'){Net.set(`rooms/${G.pin}/players/${G.me}/off`,null).catch(()=>{});Net.onDisc(`rooms/${G.pin}/players/${G.me}/off`)}})}
    if(inPlat()&&P.xqPending){const opp=G.players[XQ.other(G.me)];P.xqPending({k:gameKey(),pin:G.pin,me:G.me,o:opp&&opp.seat||0,g:G.type,t:Date.now()})}}
  if(st.phase==='end'&&G.armed){Net.cancelDisc(`rooms/${G.pin}/players/${G.me}/off`);G.armed='';clearTimeout(G.offT);G.offT=0}
  watchOpp()}
function watchOpp(){const opp=G.players[XQ.other(G.me)],st=G.st,b=$('#offMsg');
  const off=G.mode==='net'&&st&&st.phase==='play'&&opp&&opp.off;
  if(!off){clearTimeout(G.offT);G.offT=0;if(b)b.remove();return}
  if(!b){const e=document.createElement('div');e.id='offMsg';$('#status').after(e)}
  if(G.offT)return;const t0=Date.now();
  const tick=()=>{const left=Math.ceil((OFF_MS-(Date.now()-t0))/1000),e=$('#offMsg');
    if(!G.offT)return;if(left<=0){G.offT=0;if(e)e.remove();
      if(G.st&&G.st.phase==='play')Net.update(`rooms/${G.pin}/state`,{phase:'end',winner:G.me,reason:'對手中途離開',t:Date.now()}).catch(()=>{});return}
    if(e)e.innerHTML=`📴 對手離線了<br><b>${left}</b> 秒內沒回來就算你贏`;G.offT=setTimeout(tick,250)};
  G.offT=setTimeout(tick,0)}
/* 再來一局：兩個人都要有遊戲券才能按。每個人把「我還有沒有券」寫在房間裡(players/我/tk)，對方看得到 */

  if(!pl[opp])return '對手已經離開了，不能再來一局';

/* 清掉沒下完、被丟著的對戰房間(兩個人都直接關掉平板時會留下來):

/* 再來一局：紅黑交換，紅方先下 */
$('#bAgain').onclick=async()=>{if(G.mode==='net'){try{const pl=await Net.get(`rooms/${G.pin}/players`);if(pl)G.players=pl}catch(e){}}
  if(againBlock())return paintAgain();   // 有人沒券(或對手走了)就不能再來一局
  $('#over').classList.remove('on');
  if(G.mode==='solo'){G.st={phase:'play',moves:'',g:(G.st.g||1)+1,...fresh()};G.lastLen=-1;onState();return}
  const pl=G.players;if(!pl.r||!pl.b){msg('');return leave()}
  try{await Net.set(`rooms/${G.pin}/players`,{r:pl.b,b:pl.r});await Net.update(`rooms/${G.pin}/state`,{phase:'play',moves:'',turn:'r',g:(G.st.g||1)+1,winner:null,reason:null,t:Date.now(),...fresh()})}catch(e){}};

/* ═════════════ 邀請同學（在學習平台裡） ═════════════
   選同學 → 先開好房間 → 平台送出邀請；對方在平台按「接受」就會自動加入（chess.html?join=房號）。
   對方按「下次再說」或遊戲券不夠時，會在 rooms/房號/dec 留話，這邊的等待畫面看得到。 */
G.inv=0;
function uninvite(){if(G.inv&&inPlat()&&P.uninvite)P.uninvite(G.inv);G.inv=0}
async function openPick(){if(!inPlat()||!P.seats)return;if(!hasTicket())return msg(NO_TK);
  const L=$('#pickList');L.innerHTML='讀取中…';$('#pick').classList.add('on');
  let on={};try{on=await P.online()}catch(e){}
  L.innerHTML='';P.seats().filter(s=>s!==P.seat()).forEach(s=>{const b=document.createElement('button');const live=!!on[s];
    b.className=live?'on':'';b.textContent=s>=98?'🧪 測試'+(s===99?1:2):P.seatName(s);b.dataset.s=s;b.disabled=!live;b.title=live?'在線上':'不在線上';b.onclick=()=>invite(s);L.appendChild(b)});
  if(!L.children.length)L.textContent='現在沒有其他同學'}
$('#pickX').onclick=()=>$('#pick').classList.remove('on');
$('#bInv').onclick=openPick;
async function invite(s){$('#pick').classList.remove('on');await $('#bNew').onclick();if(!G.pin||G.mode!=='net')return;
  try{await P.invite(s,G.pin,G.type);G.inv=s;$('#waitNote').textContent=`已經邀請 ${P.seatName(s)}，等他按「接受」…`;$('#invMsg').textContent=''}catch(e){$('#invMsg').textContent='邀請送不出去，請檢查網路'}
  G.un.push(Net.on(`rooms/${G.pin}/dec`,v=>{if(!v||!$('#wait').classList.contains('on'))return;G.inv=0;
    $('#invMsg').textContent=v.why==='noticket'?`${P.seatName(v.s)} 的遊戲券用完了，請他先去練習`:v.why==='busy'?`${P.seatName(v.s)} 正在跟別人下棋，等一下再邀請`:`${P.seatName(v.s)} 說下次再玩`}))}
setType(G.type);paintMe();paintRec();if(inPlat()&&P.invite)$('#bInv').hidden=false;
(async()=>{const q=new URLSearchParams(location.search);await netReady;
  if(q.get('join')){$('#pinIn').value=q.get('join');$('#bJoin').onclick()}
  else if(q.has('pick'))openPick()})();
netReady.then(n=>{$('#mode').textContent=n.mode==='local'?'⚠ 連不上雲端：現在是本機模式，只能在同一台電腦的不同分頁之間對下。':''});
window.__xq=G;
</script>
</body></html>
