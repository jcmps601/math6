<script>
/* ═════════════ 601 大砲混戰 ═════════════
   2～4 台平板連線一起打（rooms/房號，跟軍棋、大砲對轟同一個 Firebase）：
   ・建立房間的人先進來，其他人輸入房號（或在平台按「接受邀請」）加入，最多 4 個人。
   ・房間裡排最前面的人是房主，可以選「各自為戰」或「2 對 2」（要剛好 4 人），按開始。
   ・state.order＝這一局有誰（玩家 0～3 對應 p0～p3 哪個位置）；沒有遊戲券、離線的人這局先在旁邊看。
   ・輪到誰，誰的平板算好砲彈結果寫進棋譜，其他人照著播。
   ・有人離線：20 秒沒回來就出局（state.out）。按「離開」也是出局，算輸。
   ・在平台裡：輸的人用掉 1 張遊戲券（贏的、平手不用），戰績記在 learn/xq（g:'pm'）。
   ・同一台平板輪流打：一局用 1 張券，不記戰績。 */
const $=s=>document.querySelector(s);
const FIREBASE_CONFIG={ apiKey:"AIzaSyD-frW7ISsXAHsv1DSZpGzvn_ok9t1NJ4U", authDomain:"quiz601.firebaseapp.com", databaseURL:"https://quiz601-default-rtdb.asia-southeast1.firebasedatabase.app", projectId:"quiz601", storageBucket:"quiz601.firebasestorage.app", messagingSenderId:"994429474121", appId:"1:994429474121:web:dc20be249385db6a60b698" };
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const Q=new URLSearchParams(location.search);
const myId=(()=>{let v=null;try{v=sessionStorage.getItem('pm_id')}catch(e){}if(!v){v=Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('pm_id',v)}catch(e){}}return v})();
const SLOTS=['p0','p1','p2','p3'],OFF_MS=20000,TURN_MS=40000,STALE_MS=3*60*60*1000;

/* ---- 連線：Firebase，或同一台電腦分頁間的本機模式（網址加 ?local） ---- */
const loadJS=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const timeout=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);
function localNet(){
  const KEY='pm601_localdb',read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}};
  const getP=(o,p)=>p.split('/').filter(Boolean).reduce((x,k)=>x==null?undefined:x[k],o);
  const setP=(o,p,v)=>{const ks=p.split('/').filter(Boolean);for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||!o[ks[i]])o[ks[i]]={};o=o[ks[i]]}const l=ks[ks.length-1];if(v==null)delete o[l];else o[l]=JSON.parse(JSON.stringify(v))};
  const L=new Set(),fire=()=>{const d=read();L.forEach(l=>l.cb(getP(d,l.p)??null))};
  addEventListener('storage',e=>{if(e.key===KEY)fire()});
  const write=f=>{const d=read();f(d);localStorage.setItem(KEY,JSON.stringify(d));fire()};
  return {mode:'local',get:async p=>getP(read(),p)??null,set:async(p,v)=>write(d=>setP(d,p,v)),
    update:async(p,v)=>write(d=>{for(const k in v)setP(d,p+'/'+k,v[k])}),remove:async p=>write(d=>setP(d,p,null)),
    on:(p,cb)=>{const l={p,cb};L.add(l);setTimeout(()=>cb(getP(read(),p)??null));return ()=>L.delete(l)},
    onDisc:()=>{},onDiscRm:()=>{},cancelDisc:()=>{},conn:cb=>{cb(true);return ()=>{}}};
}
let Net=null;
const netReady=(async()=>{
  if(Q.has('local'))return Net=localNet();
  try{

    await timeout(loadJS('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js'),10000);

    lmsg(v.why==='noticket'?`${P.seatName(v.s)} 的遊戲券用完了，請他先去練習`:v.why==='busy'?`${P.seatName(v.s)} 正在跟別人玩，等一下再邀請`:`${P.seatName(v.s)} 說下次再玩`)})];
  if(!G.unConn)G.unConn=Net.conn(on=>{if(!on||G.mode!=='net')return;
    if(G.arm&&G.arm!=='lobby'){const p=`rooms/${G.pin}/players/${G.slot}`;Net.set(p+'/off',null).catch(()=>{});Net.onDisc(p+'/off')}
    else if(G.arm==='lobby'){Net.onDiscRm(`rooms/${G.pin}/players/${G.slot}`)}
    rejoinSelf()})}
async function needName(){if(!hasTicket()){msg(NO_TK);return null}let n=myName();if(!n)n=askName();if(!n){msg('先輸入名字');return null}return n}
async function sweepRooms(){if(Net.mode!=='firebase'||sweepRooms.done)return;sweepRooms.done=1;
  try{const all=await Net.get('rooms')||{},now=Date.now();
    for(const [p,r] of Object.entries(all)){if(!r||!r.meta||r.meta.game!=='pm')continue;
      const t=Math.max(+(r.state&&r.state.t)||0,+r.meta.created||0),empty=!r.players;
      if(t&&(now-t>STALE_MS||(empty&&now-t>10*60*1000)))await Net.remove(`rooms/${p}`).catch(()=>{})}}catch(e){}}
async function create(){const name=await needName();if(!name)return false;msg('建立中…');await netReady;await sweepRooms();
  try{let pin='';for(let i=0;i<30&&!pin;i++){const p=String(1000+Math.random()*9000|0);if(!(await Net.get(`rooms/${p}/meta`)))pin=p}
    if(!pin){msg('房間滿了，等一下再試');return false}
    const created=Date.now();
    await Net.set(`rooms/${pin}`,{meta:{game:'pm',created},state:{phase:'wait',mode:'ffa',g:0,t:created},players:{p0:{id:myId,name,seat:mySeat(),tk:hasTicket()}}});
    Object.assign(G,{mode:'net',pin,slot:'p0',st:null,players:{},created,arm:'',rec:'',ovHide:''});msg('');listen();armLobby();return true
  }catch(e){msg('連不上網路，請檢查網路後再試一次');return false}}
async function join(pin){if(!/^\d{4}$/.test(pin))return msg('房號是 4 個數字');const name=await needName();if(!name)return;
  msg('加入中…');await netReady;
  try{for(let tries=0;tries<4;tries++){
      const room=await Net.get(`rooms/${pin}`);
      if(!room||!room.meta)return msg('找不到這個房間，看看房號對不對');
      if(room.meta.game!=='pm')return msg('這個房號是別的遊戲（軍棋、暗棋或大砲對轟），請到「雙人對戰」加入');
      const pl=room.players||{};let slot=SLOTS.find(k=>pl[k]&&pl[k].id===myId);
      if(!slot){slot=SLOTS.find(k=>!pl[k]);if(!slot)return msg('這個房間已經有 4 個人了');
        await Net.set(`rooms/${pin}/players/${slot}`,{id:myId,name,seat:mySeat(),tk:hasTicket()});
        await new Promise(r=>setTimeout(r,350));const chk=await Net.get(`rooms/${pin}/players/${slot}`);if(!chk||chk.id!==myId)continue}   // 同時有人搶到同一個位置：換下一個
      Object.assign(G,{mode:'net',pin,slot,st:room.state,players:{...pl,[slot]:{id:myId,name,seat:mySeat()}},created:room.meta.created||0,arm:'',rec:'',ovHide:room.state&&room.state.phase==='end'?`pm${pin}_${room.meta.created||0}_${room.state.g||1}`:''});
      msg('');listen();onState();return}
    msg('人太多了，請再試一次')}catch(e){msg('連不上網路，請再試一次')}}
$('#bNew').onclick=async()=>{if(await create())onState()};
$('#bJoin').onclick=()=>join($('#pinIn').value.trim());
$('#pinIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bJoin').onclick()});

/* ═════════════ 同一台平板輪流打 ═════════════ */
let soloN=2,soloM='ffa';
function paintSolo(){document.querySelectorAll('#soloN button').forEach(b=>b.classList.toggle('on',+b.dataset.n===soloN));
  document.querySelectorAll('#soloM button').forEach(b=>{b.classList.toggle('on',b.dataset.m===soloM);b.disabled=b.dataset.m==='team'&&soloN!==4});
  if(soloN!==4)soloM='ffa';$('#soloTip').textContent=soloM==='team'?'玩家 1、3 是紅隊，玩家 2、4 是藍隊':'各自為戰：打到只剩最後一台就贏';
  document.querySelectorAll('#soloM button').forEach(b=>b.classList.toggle('on',b.dataset.m===soloM))}
document.querySelectorAll('#soloN button').forEach(b=>b.onclick=()=>{soloN=+b.dataset.n;paintSolo()});
document.querySelectorAll('#soloM button').forEach(b=>b.onclick=()=>{if(b.disabled)return;soloM=b.dataset.m;paintSolo()});
$('#bSolo').onclick=()=>{return;if(!hasTicket())return msg(NO_TK);paintSolo();$('#soloBox').classList.add('on')};
$('#soloX').onclick=()=>$('#soloBox').classList.remove('on');
$('#soloGo').onclick=()=>{$('#soloBox').classList.remove('on');soloStart(soloN,soloM)};
function soloStart(n,m){if(!hasTicket()){show('home');return msg(NO_TK)}const ng=PM.newGame(n,m),g=((G.st&&G.st.g)||0)+1;
  G.solo={n,m,paid:(G.solo&&G.solo.paid)||0};Object.assign(G,{mode:'solo',pin:'',slot:'',players:{}});
  G.st={phase:'play',order:[...Array(n).keys()].map(i=>'s'+i).join(','),mode:ng.mode,map:ng.map,seed:ng.seed,moves:'',g};onState()}

/* ═════════════ 邀請同學（在學習平台裡） ═════════════ */
async function openPick(){if(!inPlat()||!P.seats)return;
  const L=$('#pickList');L.innerHTML='讀取中…';$('#pick').classList.add('on');
  let on={};try{on=await P.online()}catch(e){}
  const inRoom=new Set(Object.values(G.players||{}).map(p=>p&&p.seat).filter(Boolean));
  L.innerHTML='';P.seats().filter(s=>s!==P.seat()&&!inRoom.has(s)).forEach(s=>{const b=document.createElement('button');const live=!!on[s];
    b.className=G.inv.has(s)?'sent':live?'on':'';b.textContent=s>=98?'🧪 測試'+(s===99?1:2):P.seatName(s);b.disabled=!live||G.inv.has(s);b.title=live?'在線上':'不在線上';
    b.onclick=async()=>{b.disabled=true;try{await P.invite(s,G.pin,'pm');G.inv.add(s);b.className='sent';lmsg(`已經邀請 ${P.seatName(s)}，等他按「接受」…`)}catch(e){b.disabled=false;lmsg('邀請送不出去，請檢查網路')}};L.appendChild(b)});
  if(!L.children.length)L.textContent='現在沒有其他同學'}
function closePick(){$('#pick').classList.remove('on')}
$('#pickX').onclick=closePick;
$('#bInv2').onclick=openPick;
$('#bInv').onclick=async()=>{if(await create()){onState();openPick()}};
window.addEventListener('pagehide',()=>{if(G.inv.size&&inPlat()&&P.uninvite)G.inv.forEach(s=>P.uninvite(s))});

/* ═════════════ 開始 ═════════════ */
paintMe();paintRec();if(inPlat()&&P.invite)$('#bInv').hidden=false;
addEventListener('resize',()=>{if($('#game').classList.contains('on'))PMV.fit()});
(async()=>{await netReady;
  if(Net.mode==='local'){$('#mode').hidden=false;$('#mode').textContent='⚠ 連不上雲端：現在是本機模式，只能在同一台電腦的不同分頁之間一起玩。'}
  if(Q.get('join')){$('#pinIn').value=Q.get('join');join(Q.get('join'))}
  else if(Q.has('pick')&&inPlat())$('#bInv').onclick()})();
window.__pm=G;
</script>
