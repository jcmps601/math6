<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#fff9f0">
<title>601 學習平台</title>
<style>
:root{--g:#22b573;--gd:#0c8a50;--o:#ff922b;--bg:#fff9f0;--line:#f1e3cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);font-family:'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;color:#333;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
.scr{display:none;height:100%}.scr.on{display:flex}
/* ===== 登入 ===== */
#login{flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:1rem}
#login h1{margin:0;font-size:3rem;color:var(--g);letter-spacing:.05em}
#login h1 small{display:block;font-size:1.3rem;color:#999;text-align:center;letter-spacing:.2em}
#seats{display:flex;flex-direction:column;gap:1rem;width:min(56rem,100%)}.sg{display:grid;grid-template-columns:repeat(8,1fr);gap:.55rem}
#seats button{aspect-ratio:1.25;border:0;border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--line);font:900 2rem 'Avenir Next','Helvetica Neue',Arial,sans-serif;color:#444}
#seats .girl button{color:#d6336c}
#seats .tbtn{align-self:center;border:3px dashed #ced4da;background:#fff;border-radius:16px;font-size:1.2rem;font-weight:900;color:#868e96;padding:.4rem 1.2rem}
#seats button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
#pinbox{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9;padding:1rem}
#pinbox.on{display:flex}
#pinbox .box{background:#fff;border-radius:28px;padding:1.2rem 1.4rem;width:min(24rem,100%);display:flex;flex-direction:column;gap:.7rem;align-items:center;animation:fade .25s}
#pinseat{font-size:2.2rem;font-weight:900;color:var(--g)}
#pindots{display:flex;gap:.8rem}#pindots i{width:1.5rem;height:1.5rem;border-radius:50%;border:4px solid #ced4da}#pindots i.f{background:var(--o);border-color:var(--o)}
#pindots.no{animation:shake .4s}
#pinmsg{min-height:1.6rem;font-size:1.25rem;font-weight:900;color:#e03131;text-align:center}
#pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;width:100%}
#pinpad button{border:0;border-radius:16px;background:#f1f3f5;box-shadow:0 4px 0 #dee2e6;font:900 2rem 'Avenir Next','Helvetica Neue',Arial,sans-serif;color:#444;padding:.5rem 0}
#pinpad .x{background:#fff0f0;color:#e03131;font-size:1.4rem}
/* ===== 首頁 ===== */
#home{display:none}#home.on{display:grid;grid-template-columns:13.5rem 1fr;width:100%}
#side{background:#fff;border-right:3px solid var(--line);display:flex;flex-direction:column;gap:.45rem;padding:.8rem .6rem;min-height:0;overflow:auto}
#me{display:flex;align-items:center;gap:.6rem;padding:.2rem .3rem .5rem}
#me .av{width:3.6rem;height:3.6rem;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font:900 1.9rem 'Avenir Next',Arial,sans-serif;flex:none}
#me .nm{font-size:1.35rem;font-weight:900;line-height:1.2}#me .nm small{display:block;font-size:.95rem;color:#999}
.nv{display:flex;align-items:center;gap:.5rem;border:4px solid transparent;border-radius:16px;padding:.45rem .55rem;background:#f8f9fa;text-align:left;font-size:1.2rem;font-weight:900;color:#555;line-height:1.2}
.nv b{flex:none;width:2.1rem;height:2.1rem;border-radius:12px;background:var(--c,#adb5bd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.nv.on{border-color:var(--c,#adb5bd);background:#fff}
.sp{flex:1}
#sync{font-size:.95rem;font-weight:800;color:#999;text-align:center;padding:.2rem}
#logout{border:3px solid #e9ecef;background:#fff;border-radius:14px;font-size:1rem;font-weight:900;color:#aaa;padding:.35rem}
#pane{min-width:0;min-height:0;overflow:auto;padding:1rem 1.2rem 1.5rem}
.h1{font-size:2.2rem;font-weight:900;margin:.1rem 0 .8rem;display:flex;align-items:center;gap:.6rem}
.h1 .tag{font-size:1.2rem;color:#fff;background:var(--c);border-radius:12px;padding:.15rem .6rem}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:1rem}
.cd{background:#fff;border-radius:24px;box-shadow:0 5px 0 var(--line);padding:1rem 1.2rem}
#today{display:flex;align-items:center;gap:1.2rem}
#ring{flex:none;width:9rem;height:9rem}
#today .t1{font-size:1.4rem;font-weight:900;color:#888}
#today .t2{font-size:2.6rem;font-weight:900;color:#333;line-height:1.2}#today .t2 small{font-size:1.4rem;color:#999}
.go{border:0;border-radius:20px;background:var(--o);color:#fff;box-shadow:0 5px 0 #e8590c;font-size:1.7rem;font-weight:900;padding:.6rem 1.3rem;margin-top:.5rem}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #e8590c}
#fire{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem}
#fire .n{font-size:3.6rem;font-weight:900;color:#f76707;line-height:1}#fire .l{font-size:1.25rem;font-weight:900;color:#999}
#week{display:flex;gap:.45rem;margin-top:.6rem}#week div{display:flex;flex-direction:column;align-items:center;gap:.2rem;font-size:1rem;font-weight:900;color:#aaa}
#week i{width:2.2rem;height:2.2rem;border-radius:50%;background:#f1f3f5;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:1.2rem}
#week i.y{background:var(--g)}#week i.p{background:#ffe8cc;color:#f76707}#week .td{color:#f76707}
.sec{font-size:1.5rem;font-weight:900;color:#888;margin:1.2rem 0 .6rem}
#ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.8rem}
.uc{border:0;text-align:left;background:#fff;border-radius:22px;box-shadow:0 5px 0 var(--line);padding:.8rem 1rem;border-top:.55rem solid var(--c)}
.uc .a{font-size:1.1rem;font-weight:900;color:var(--c)}.uc .b{font-size:1.45rem;font-weight:900;color:#333;line-height:1.3;margin:.1rem 0 .3rem}
.uc .s{font-size:1.15rem;color:#f59f00;font-weight:900;min-height:1.4em}
.stat{display:flex;gap:1.6rem;margin-top:.4rem;flex-wrap:wrap}.stat div{font-size:1.15rem;font-weight:900;color:#999}.stat b{display:block;font-size:2rem;color:#333}
/* 單元頁 */
#practice{display:flex;align-items:center;gap:1.2rem;border-left:.6rem solid var(--c)}
#practice .bi{font-size:3.6rem}
#practice .t{font-size:1.9rem;font-weight:900}#practice .s{font-size:1.25rem;color:#999;font-weight:800;margin-top:.2rem}
#practice .go{margin:0 0 0 auto}
#tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.8rem}
.tl{border:0;background:#fff;border-radius:20px;box-shadow:0 5px 0 var(--line);padding:.8rem 1rem;display:flex;align-items:center;gap:.8rem;text-align:left}
.tl .i{font-size:2.3rem;flex:none}.tl .k{font-size:1rem;font-weight:900;color:var(--c)}.tl .n{font-size:1.35rem;font-weight:900;color:#333;line-height:1.25}
.tl .v{margin-left:auto;font-size:.95rem;color:#2b8a3e;font-weight:900;flex:none}
.tl:active,.uc:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
/* ===== 教具檢視 ===== */
#viewer{flex-direction:column;position:fixed;inset:0;z-index:7;background:#fff}
#vbar{display:flex;align-items:center;gap:.8rem;padding:.35rem .6rem;background:#fff;border-bottom:3px solid var(--line)}
#vback{border:0;border-radius:14px;background:var(--o);color:#fff;font-size:1.3rem;font-weight:900;padding:.35rem 1rem;box-shadow:0 3px 0 #e8590c}
#vtitle{font-size:1.3rem;font-weight:900;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vframe{flex:1;border:0;width:100%}
/* ===== 練習 ===== */
#prac{display:none}#prac.on{display:grid;grid-template-columns:11rem 1fr;width:100%}
#pnav{background:#fff;border-right:3px solid var(--line);display:flex;flex-direction:column;gap:.7rem;padding:.8rem .6rem}
#pback{border:0;border-radius:16px;background:#f1f3f5;font-size:1.35rem;font-weight:900;color:#555;padding:.55rem .4rem;box-shadow:0 4px 0 #dee2e6}
#punit{border-radius:18px;padding:.6rem;background:var(--cb,#f8f9fa);border:4px solid var(--c)}
#punit .a{font-size:1.2rem;font-weight:900;color:var(--c)}#punit .b{font-size:1.3rem;font-weight:900;color:#333;line-height:1.3}
#pbar{height:.6rem;border-radius:9px;background:#e9ecef;overflow:hidden;margin-top:.4rem}#pbar i{display:block;height:100%;background:var(--c);width:0;transition:width .3s}
#pcnt{font-size:1.05rem;font-weight:900;color:#888;margin-top:.2rem}
main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:.6rem .8rem .7rem;gap:.55rem}
#top{display:flex;align-items:center;gap:.6rem}
#qno{flex:none;background:var(--g);color:#fff;font-weight:900;font-size:1.4rem;border-radius:14px;padding:.25rem .8rem}
#utag{flex:none;font-weight:900;font-size:1.1rem;border-radius:12px;padding:.2rem .6rem;border:3px solid currentColor}
#dots{display:flex;gap:.3rem;margin-left:auto}#dots i{width:1.1rem;height:1.1rem;border-radius:50%;background:#e9ecef}
#dots i.cur{outline:3px solid var(--o);outline-offset:2px}#dots i.ok{background:var(--g)}#dots i.ok2{background:#94d82d}#dots i.no{background:#ffa8a8}
#q{font-size:1.9rem;font-weight:900;line-height:1.5;background:#fff;border-radius:20px;padding:.45rem 1rem;box-shadow:0 4px 0 #f1e3cf}
#q .num{color:#1c7ed6}
#body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 24rem;gap:.7rem}
.card{background:#fff;border-radius:22px;box-shadow:0 4px 0 #f1e3cf;min-height:0}
#figc{display:flex;flex-direction:column;padding:.5rem;overflow:auto}
#fig{flex:1;min-height:0;width:100%}
#bigc{flex:1;min-height:5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem}
#figc.solv #bigc{flex:none;min-height:0;padding:.3rem 0}
#figc.solv .bx{font-size:2.6rem}#figc.solv .bx.s{font-size:1.7rem}
.bx{font-size:4.2rem;font-weight:900;color:#333;text-align:center;line-height:1.35}
.bx.s{font-size:2.3rem;color:#555}.bx:not(.s){white-space:nowrap}
.cq{color:var(--o)}
#steps{display:flex;flex-direction:column;gap:.25rem;padding:0 .6rem .3rem}
#steps>div{font-size:1.55rem;font-weight:900;animation:fade .3s;line-height:1.55}
#steps .fr{font-size:.92em}#steps .h{color:#7048e8}#steps .sol{color:#2b8a3e}
/* 直式分數 */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.1;font-size:.82em}
.fr i{font-style:normal;padding:0 .18em}.fr i:first-child{border-bottom:.09em solid currentColor}
/* 短除法 */
.sd{border-collapse:collapse;margin:.2rem 0 .2rem 1rem;font-size:1.55rem;font-weight:900;color:#333}
.sd td{padding:.05rem .55rem;text-align:center;min-width:2.2em}
.sd td.p{color:#e8590c;text-align:right;min-width:1.4em}
.sd tr:not(:last-child) td.p{border-right:3px solid #333}
.sd tr:not(:last-child) td.n{border-bottom:3px solid #333}
/* 作答 */
#ansc{display:flex;flex-direction:column;gap:.55rem;padding:.8rem;min-height:0}
#ansline{display:flex;align-items:center;gap:.5rem;font-size:1.7rem;font-weight:900;color:#555;justify-content:center;white-space:nowrap}
#unit{flex:none}#ansline .pre{color:#888}
.ib{min-width:0;height:1.8em;border:4px solid #dee2e6;border-radius:16px;background:#fff8ef;display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:#d9480f;font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif}
#box{flex:1;max-width:9em;border-color:var(--o)}
#fbx{display:none;align-items:center;gap:.4rem}
#fbx .ib{width:3.4em;height:1.45em;font-size:2rem;cursor:pointer}
#fbx .stk{display:flex;flex-direction:column;align-items:center;gap:.25rem}
#fbx .stk hr{width:100%;border:0;border-top:5px solid #555;margin:0}
#fbx .ib.act{border-color:var(--o);box-shadow:0 0 0 .25rem rgba(255,146,43,.25)}
#bw{width:2.4em!important}
.frmode #fbx{display:flex}.frmode #box{display:none}
.ib.ok{border-color:#37b24d!important;background:#d3f9d8;color:#2b8a3e}
.ib.no,#fbx.no .ib{border-color:#fa5252;background:#ffe3e3;animation:shake .4s}
#rev{display:none;font-size:2.4rem;font-weight:900;color:#2b8a3e;background:#d3f9d8;border:4px solid #37b24d;border-radius:16px;padding:.1rem .8rem}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
#fb{min-height:2.4rem;font-size:1.4rem;font-weight:900;text-align:center;line-height:1.3}
#fb.good{color:#2b8a3e}#fb.bad{color:#e03131}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;flex:1;min-height:0}
#pad button{border:0;border-radius:14px;background:#f1f3f5;font:900 1.9rem 'Avenir Next','Helvetica Neue',Arial,sans-serif;color:#444;box-shadow:0 4px 0 #dee2e6;min-height:2.6rem}
#pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #dee2e6}
#pad .del{background:#fff0f0;color:#e03131}
#pad .nx{background:#fff4e6;color:#e8590c;font-family:inherit;font-size:1.35rem}
#pad .ck{grid-column:span 2;background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd);font-family:inherit;font-size:1.7rem}
#opts{display:none;flex:1;min-height:0;flex-direction:column;gap:.6rem;justify-content:center}
#opts.row{flex-direction:row}
#opts button{flex:1;max-height:6rem;border:4px solid #e9ecef;background:#fff;border-radius:18px;font:900 2rem 'PingFang TC','Microsoft JhengHei',sans-serif;color:#444;box-shadow:0 4px 0 #dee2e6;padding:.3rem}
#opts.row{align-items:center}#opts.row button{font-size:3rem;max-height:9rem;height:100%;min-height:5rem}
#opts button.no{border-color:#ffa8a8;background:#fff5f5;color:#e03131;opacity:.6}
#opts button.ok{border-color:#37b24d;background:#d3f9d8;color:#2b8a3e}
.chmode #opts{display:flex}.chmode #pad,.chmode #ansline{display:none}
#acts{display:flex;gap:.5rem}
#acts button{flex:1;border:4px solid #e9ecef;background:#fff;border-radius:16px;font:900 1.4rem 'PingFang TC','Microsoft JhengHei',sans-serif;color:#666;padding:.35rem}
#acts .hint{border-color:#d0bfff;color:#7048e8}#acts .hint.pulse{animation:pl 1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 .4rem rgba(112,72,232,.25)}}
#acts .next{background:var(--o);border-color:var(--o);color:#fff;box-shadow:0 4px 0 #e8590c}
#acts button:disabled{opacity:.35}
#acts .hide{display:none}
/* 結算 */
#end{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:5;padding:1rem}
#end.on{display:flex}
#end .box{background:#fff;border-radius:28px;padding:1.4rem 2rem;text-align:center;min-width:min(26rem,100%);animation:fade .3s}
#end h2{margin:.2rem 0 .5rem;font-size:2.3rem}
#end .big{font-size:4rem;font-weight:900;color:var(--g)}
#end .st{font-size:2.6rem;color:#f59f00;letter-spacing:.15em}
#end .sub{font-size:1.35rem;color:#777;font-weight:800;margin:.3rem 0 1rem}
#end button{border:0;border-radius:18px;font:900 1.5rem 'PingFang TC','Microsoft JhengHei',sans-serif;padding:.5rem 1.2rem;margin:.3rem;background:#f1f3f5;color:#555}
#end button.go{background:var(--o);color:#fff;box-shadow:0 4px 0 #e8590c}
svg text{font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:8px;stroke-linejoin:round}

#seeTool{display:none;border:4px solid #ffd8a8;background:#fff4e6;color:#e8590c;border-radius:16px;font-size:1.25rem;font-weight:900;padding:.35rem}
#ptk{font-size:1.5rem;font-weight:900;color:#e8590c;background:#fff4e6;border:3px solid #ffd8a8;border-radius:16px;padding:.35rem .5rem;text-align:center}
#ptk small{display:block;font-size:1rem;color:#c2410c}
.tkc small{font-size:.95rem;color:#c2410c}
#toast{position:fixed;left:50%;top:18%;transform:translate(-50%,0);z-index:8;background:#fff;border:5px solid #ffd8a8;color:#e8590c;font-size:2.2rem;font-weight:900;border-radius:24px;padding:.6rem 1.6rem;box-shadow:0 8px 0 rgba(0,0,0,.12);opacity:0;pointer-events:none}
#toast.on{animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
/* ===== 老師設定 ===== */
#setup{flex-direction:column;gap:1rem;padding:1.2rem;overflow:auto;width:100%}
#setup h2{margin:0;font-size:2rem}
#setup .cd{display:flex;flex-direction:column;gap:.6rem;font-size:1.2rem;font-weight:800}
#setup button{border:0;border-radius:14px;background:var(--g);color:#fff;font-size:1.2rem;font-weight:900;padding:.5rem 1rem;align-self:flex-start}
#setup button.gray{background:#e9ecef;color:#555}
#rulemsg{font-size:1.3rem;font-weight:900;line-height:1.5}
#setmsg,#tabmsg,#hmsg{color:#1c7ed6;font-weight:900}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem}.hrow input{width:4em;font-size:1.2rem;padding:.2rem;border:2px solid #dee2e6;border-radius:8px}.hrow select{font-size:1.1rem;padding:.2rem}
#hout{font:1.1rem monospace;width:min(20rem,100%);border:2px solid #dee2e6;border-radius:10px;padding:.4rem}
/* 學習分析 */
#amsg{color:#1c7ed6;font-weight:900}
#aout h3{font-size:1.45rem;margin:1rem 0 .4rem;color:#333}#aout h3 small{font-size:1rem;color:#999;font-weight:800;margin-left:.5rem}
.at{border-collapse:collapse;font-size:1.1rem;font-weight:800}
.at th,.at td{padding:.35rem .55rem;text-align:center;border-bottom:2px solid #f1f3f5}.at th{color:#888;font-size:1rem}
.at td.c{min-width:5.2rem}.at td.c b{display:block;font-size:1.3rem}.at td.c small{color:#888;font-size:.85rem}
.at td.g{background:#d3f9d8}.at td.y{background:#fff3bf}.at td.r{background:#ffe3e3}.at td.n{color:#ccc}
.at tr.st{cursor:pointer}.at tr.st:hover td{outline:2px solid #ffd8a8}.at tr.sel td{box-shadow:inset 0 0 0 3px #ff922b}
.at td.l{text-align:left}.ubadge{font-size:.85rem;color:#fff;border-radius:8px;padding:.05rem .45rem;margin-right:.4rem}
.abar{display:inline-block;height:.7rem;border-radius:6px;background:#ff8787;vertical-align:middle;margin-left:.4rem}
#adet{margin-top:.6rem;padding:.8rem;border:3px solid #ffd8a8;border-radius:16px;background:#fff9f0}
/* 錯題本 */
#wblist{display:flex;flex-direction:column;gap:.45rem}
.wbi{display:flex;align-items:center;gap:.7rem;font-size:1.25rem;font-weight:800;padding:.35rem .2rem;border-bottom:2px dashed #f1f3f5}
.wbi .wu{flex:none;font-size:1rem;font-weight:900;color:#fff;background:var(--c);border-radius:10px;padding:.1rem .5rem}
.wbi .wq{flex:1;min-width:0;line-height:1.5}.wbi .wn{flex:none;color:#c92a2a;font-size:1.05rem}
/* 遊戲 */
.tkc{display:block;margin-top:.6rem;border:3px solid #ffd8a8;background:#fff4e6;color:#e8590c;border-radius:14px;font-size:1.2rem;font-weight:900;padding:.3rem .8rem}
.tkget{margin-top:.6rem;font-size:1.5rem;color:#e8590c;font-weight:900}
#tkcard{display:flex;align-items:center;gap:1.2rem;border-left:.6rem solid #e8590c;flex-wrap:wrap}
#tkcard .tkn{font-size:3rem;display:flex;align-items:center;gap:.3rem}#tkcard .tkn b{font-size:3.4rem;color:#e8590c}
#tkcard .t{font-size:1.6rem;font-weight:900}#tkcard .s{font-size:1.15rem;color:#999;font-weight:800;margin-top:.2rem}#tkcard .go{margin:0 0 0 auto}
#bgames,#bdiffs{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.6rem}

function enterHome(){show$('home');const isT=user.seat===TEST_SEAT;document.getElementById('meav').textContent=isT?'🧪':user.seat;document.getElementById('menm').innerHTML=isT?'測試<small>不上排行榜</small>':`${user.seat} 號<small>601</small>`;paintNavs();render();paintSync();
  verify(user.seat,user.pin).then(r=>{if(r.ok){resetIfCleared(r.val);mergeSum(r.val);saveSum(true);render();ensureBind().then(()=>flush())}else if(r.why==='bad'){LS.del('learn601_user');user=null;show$('login')}})}
function paintNavs(){const N2=document.getElementById('navs');N2.innerHTML='';
  const items=[{key:'home',no:'🏠',nav:'首頁',c:'#495057'},...UN.filter(u=>u.g),MIX,WB,GM];
  items.forEach(u=>{const b=el('button','nv'+(view===u.key?' on':''),`<b>${u.no}</b><span>${u.nav}</span>`);b.style.setProperty('--c',u.c);tap(b,()=>{view=u.key;paintNavs();render()});N2.appendChild(b)});
  N2.style.display='contents'}
function todayN(){return sum.days[dkey()]||0}
function streak(){let n=0;const d=new Date();if((sum.days[dkey(d)]||0)<GOAL)d.setDate(d.getDate()-1);
  while((sum.days[dkey(d)]||0)>=GOAL){n++;d.setDate(d.getDate()-1)}return n}
function stars(b){return b>=9?'⭐⭐⭐':b>=7?'⭐⭐':b>=5?'⭐':''}
function ringSVG(p){const r=52,C=2*Math.PI*r;return `<svg id="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#f1f3f5" stroke-width="14"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${p>=1?'#22b573':'#ff922b'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C*Math.min(p,1)} ${C}" transform="rotate(-90 60 60)"/><text x="60" y="${p>=1?72:70}" text-anchor="middle" font-size="${p>=1?40:30}" font-weight="900" fill="#333" style="stroke:none">${p>=1?'✔':Math.round(p*100)+'%'}</text></svg>`}
function render(){const P=document.getElementById('pane');P.innerHTML='';
  if(view==='home')return renderHome(P);
  if(view==='mix')return renderUnit(P,MIX,null);
  if(view==='wb')return renderWB(P);
  if(view==='game')return renderGame(P);
  const u=UN.find(x=>x.key===view);renderUnit(P,u,UN.indexOf(u))}
function renderHome(P){const n=todayN(),done=n>=GOAL;
  P.appendChild(el('div','h1',`👋 ${user.seat===TEST_SEAT?'測試帳號':user.seat+' 號'}，${done?'今天的任務完成了！':'今天也來練習吧'}`));

  const t=el('div','cd');t.id='today';t.innerHTML=ringSVG(n/GOAL)+`<div><div class="t1">今天的任務</div><div class="t2">${Math.min(n,999)} <small>/ ${GOAL} 題</small></div></div>`;
  const gb=el('button','go',done?'再練一回 ▶':'開始練習 ▶');tap(gb,()=>startPractice('mix'));t.lastChild.appendChild(gb);
  const tk=el('button','tkc',`🎟️ 遊戲券 × ${sum.tk||0}　<small>${tkInfo()}</small>`);tap(tk,()=>{view='game';paintNavs();render()});t.lastChild.appendChild(tk);g.appendChild(t);
  const f=el('div','cd');f.id='fire';const st=streak();f.innerHTML=`<div class="n">🔥 ${st}</div><div class="l">連續完成天數</div>`;
  const W=el('div');W.id='week';const now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  '一二三四五六日'.split('').forEach((c,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);const k=dkey(d),v=sum.days[k]||0;
    W.appendChild(el('div',k===dkey()?'td':'',`<i class="${v>=GOAL?'y':v>0?'p':''}">${v>=GOAL?'✔':v>0?v:''}</i>${c}`))});
  f.appendChild(W);g.appendChild(f);P.appendChild(g);
  P.appendChild(el('div','sec','各單元'));const G=el('div');G.id='ucards';
  [...UN.filter(u=>u.g),MIX,...(wbLoad().length?[WB]:[])].forEach(u=>{const b=el('button','uc',`<div class="a">${u===MIX?'★':u===WB?'📕':'單元 '+u.no}</div><div class="b">${u.name}</div><div class="s">${u===WB?`<span style="color:#c92a2a">${wbLoad().length} 題待練</span>`:u.g||u===MIX?(stars(sum.best[u.key]||0)||'　'):'📺 教具'}</div>`);
    b.style.setProperty('--c',u.c);tap(b,()=>{view=u.key;paintNavs();render()});G.appendChild(b)});P.appendChild(G);
  const rate=sum.total?Math.round(sum.first/sum.total*100):0;
  const S=el('div','stat',`<div>累計練習<b>${sum.total} 題</b></div><div>一次就答對<b>${rate}%</b></div><div>練習天數<b>${Object.values(sum.days).filter(v=>v>0).length} 天</b></div>`);
  const c=el('div','cd');c.style.marginTop='1rem';c.appendChild(S);P.appendChild(c)}
function renderUnit(P,u,ui){const h=el('div','h1',`<span class="tag">${u===MIX?'★':'單元 '+u.no}</span>${u.name}`);h.style.setProperty('--c',u.c);P.appendChild(h);
  if(u.g||u===MIX){const c=el('div','cd');c.id='practice';c.style.setProperty('--c',u.c);const b=sum.best[u.key]||0;
    c.innerHTML=`<div class="bi">✏️</div><div><div class="t">練習 ${N} 題</div><div class="s">${b?`最佳 ${b} / ${N}　${stars(b)}`:'還沒練習過'}</div></div>`;
    const g=el('button','go','開始 ▶');tap(g,()=>startPractice(u===MIX?'mix':ui));c.appendChild(g);P.appendChild(c)}
  return;   // 教具先不放
  const tools=u===MIX?[]:u.tools;if(!tools.length)return;
  const SH=el('div','sec','📺 教具');P.appendChild(SH);const G=el('div');G.id='tools';
  tools.forEach(t=>{const v=sum.tv[t.id]||0;const b=el('button','tl',`<span class="i">${t.i}</span><span><div class="k">${t.k}</div><div class="n">${t.n}</div></span>${v?`<span class="v">✔ ${v}</span>`:''}`);
    b.style.setProperty('--c',u.c);tap(b,()=>openTool(t));G.appendChild(b);toolExists(t.f).then(ok=>{if(!ok){b.remove();if(!G.children.length)SH.remove()}})});P.appendChild(G)}
/* 教具檔案還沒上傳(404)就先不顯示;離線時照常顯示 */
const TX={};function toolExists(f){if(location.protocol==='file:')return Promise.resolve(true);if(!(f in TX))TX[f]=fetch(f,{method:'HEAD',cache:'no-store'}).then(r=>r.status!==404).catch(()=>true);return TX[f]}

/* ===================== 錯題本 =====================
   答錯(看解答)或第二次才答對的題目會存起來;在「錯題再練」一次就答對,才會從錯題本拿掉。 */
const wbKey=()=>'learn601_wb_'+user.seat;
function wbLoad(){return user?LS.get(wbKey(),[]):[]}
function wbSave(W){LS.set(wbKey(),W);enqueue(`${base()}/wb`,W.map(x=>({k:x.k,u:x.q.u,t:x.q.t,n:x.n,d:x.d})),true)}
function wbUpdate(q,res){if(!user)return;let W=wbLoad();const k=qKey(q),i=W.findIndex(x=>x.k===k);
  if(res==='ok'){if(i>=0){W.splice(i,1);wbSave(W);if(pu==='wb')toast('📕 這題練會了！')}return}
  if(i>=0){const x=W.splice(i,1)[0];x.n++;x.d=dkey();W.push(x)}
  else{const c=JSON.parse(JSON.stringify(q));W.push({k,q:c,n:1,d:dkey()})}
  if(W.length>WB_MAX)W=W.slice(-WB_MAX);wbSave(W)}
function renderWB(P){const h=el('div','h1',`<span class="tag">📕</span>錯題再練`);h.style.setProperty('--c',WB.c);P.appendChild(h);
  const W=wbLoad();const c=el('div','cd');c.id='practice';c.style.setProperty('--c',WB.c);
  c.innerHTML=W.length?`<div class="bi">📕</div><div><div class="t">錯題本有 ${W.length} 題</div><div class="s">一次就答對，就會從錯題本拿掉</div></div>`:`<div class="bi">🎉</div><div><div class="t">錯題本是空的</div><div class="s">答錯的題目會自動存到這裡</div></div>`;
  if(W.length){const g=el('button','go',`再練 ${Math.min(10,W.length)} 題 ▶`);tap(g,()=>startPractice('wb'));c.appendChild(g)}P.appendChild(c);
  if(!W.length)return;P.appendChild(el('div','sec','錯過的題目'));const L=el('div','cd');L.id='wblist';
  W.slice().reverse().forEach(x=>{const U=UN[x.q.u];L.appendChild(el('div','wbi',`<span class="wu" style="--c:${U.c}">單元${U.no}</span><span class="wq">${x.q.text}</span><span class="wn">錯 ${x.n} 次</span>`))});P.appendChild(L)}

/* ===================== 遊戲＋排行榜 ===================== */
let bg='tower';
const gOf=g=>GLIST.find(x=>x[0]===g);
const playLeft=()=>sum&&sum.se?Math.max(0,sum.se-Date.now()):0;
const mmss=ms=>{const t=Math.ceil(ms/1000);return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`};
const DIDX={easy:0,normal:1,hard:2,boss:3};
/* 一個遊戲只有一個榜:先比難度(魔王最高),同難度再比分數 */
function gBetter(g,a,b){if(!a)return false;if(!b)return true;if(a.d!==b.d)return a.d>b.d;const lo=!!(gOf(g)||[])[4];return lo?a.s<b.s:a.s>b.s}
const gFmt=(g,v)=>{const G=gOf(g);if(g==='num')return `${(+v).toFixed(1)} 秒`;if(g==='cups')return `${v} / 5`;if(g==='hunt')return `${v} ★`;return `${v} ${G[3]}`};
const dTxt=d=>`${GDIFF[d][1]} ${GDIFF[d][2]}`;
function renderGame(P){const h=el('div','h1',`<span class="tag">🎮</span>601 挑戰樂園`);h.style.setProperty('--c',GM.c);P.appendChild(h);
  const c=el('div','cd');c.id='tkcard';
  const left=playLeft();c.innerHTML=`<div class="tkn">🎟️<b>${sum.tk||0}</b></div><div><div class="t">遊戲券（一張玩 5 分鐘）</div><div class="s">${left>0?`⏱ 現在還可以玩 ${mmss(left)}`:`每 10 題答對 8 題拿 1 張　${tkInfo()}`}</div></div>`;
  const can=left>0||(sum.tk||0)>0;const b=el('button','go',left>0?'繼續玩 ▶':can?'進入樂園 ▶':'先去練習 ▶');tap(b,()=>can?openTool(GAME_TOOL):startPractice('mix'));c.appendChild(b);P.appendChild(c);
  P.appendChild(el('div','sec','🏆 全班排行榜（先比難度，再比成績）'));
  const gc=el('div');gc.id='bgames';GLIST.forEach(([k,ic,nm])=>{const x=el('button','bgb'+(bg===k?' on':''),`${ic} ${nm}`);tap(x,()=>{bg=k;render()});gc.appendChild(x)});P.appendChild(gc);
  const L=el('div','cd');L.id='board';L.innerHTML='<div class="ld">讀取中…</div>';P.appendChild(L);loadBoard(L)}
/* 讀全班排行:回傳 {g:[{seat,d,s,rank}]} 已排好 */
async function lbAll(){await fbReady;if(!db||!online)return null;const v=(await timeout(db.ref(`${ROOT}/lb`).get(),8000)).val()||{};const out={};
  for(const g in v){const arr=Object.entries(v[g]||{}).filter(([,o])=>o&&typeof o.s==='number'&&typeof o.d==='number').map(([s,o])=>({seat:+s,d:o.d,s:o.s})).filter(r=>r.seat!==TEST_SEAT);
    arr.sort((a,b)=>gBetter(g,a,b)?-1:gBetter(g,b,a)?1:0);arr.forEach(r=>{r.rank=1+arr.filter(x=>gBetter(g,x,r)).length});out[g]=arr}return out}
async function loadBoard(L){const g=bg;let all;
  try{all=await lbAll()}catch(e){L.innerHTML='<div class="ld">讀取失敗，等一下再試</div>';return}
  if(g!==bg)return;if(!all){L.innerHTML='<div class="ld">📴 連上網路才看得到排行榜</div>';return}
  const arr=all[g]||[];if(!arr.length){L.innerHTML='<div class="ld">還沒有人上榜，搶第一名！</div>';return}
  let h='';arr.forEach((r,i)=>{const me=r.seat===user.seat;if(i>=10&&!me)return;
    h+=`<div class="br${me?' me':''}"><b>${r.rank<=3?['🥇','🥈','🥉'][r.rank-1]:r.rank}</b><span>${r.seat} 號${me?'（我）':''}</span><em>${dTxt(r.d)}</em><i>${gFmt(g,r.s)}</i></div>`});
  L.innerHTML=h}
/* game.html 在平台裡開啟時會呼叫這些(同一個網站,可以直接呼叫) */
window.__learn601={
  seat:()=>user?user.seat:null,
  tickets:()=>sum?(sum.tk||0):0,
  left:()=>playLeft(),
  /* 開一局:5 分鐘還沒用完就直接玩;用完了才扣 1 張券、重新給 5 分鐘 */
  startPlay(g,d){if(!user||!sum)return {ok:false};if(playLeft()>0)return {ok:true};
    if(!((sum.tk||0)>0))return {ok:false};sum.tk--;sum.se=Date.now()+PLAY_MS;saveSum(true);logPush({k:'g',game:g,diff:d});return {ok:true,fresh:true}},
  board:()=>lbAll().catch(()=>null),
  async score(g,dk,s){if(!user||!sum||typeof s!=='number'||!isFinite(s)||!(dk in DIDX))return null;
    const cand={d:DIDX[dk],s};logPush({k:'gs',game:g,diff:dk,score:s});sum.gb2=sum.gb2||{};
    let all=null;try{all=await lbAll()}catch(e){}
    /* 先以雲端上自己的紀錄為準(換平板、清過資料時不會用比較差的成績蓋掉) */
    const rm=all&&(all[g]||[]).find(r=>r.seat===user.seat);if(rm&&gBetter(g,{d:rm.d,s:rm.s},sum.gb2[g]))sum.gb2[g]={d:rm.d,s:rm.s};
    if(s>0&&gBetter(g,cand,sum.gb2[g])){sum.gb2[g]=cand;saveSum(true);if(user.seat!==TEST_SEAT)enqueue(`${ROOT}/lb/${g}/${user.seat}`,{d:cand.d,s,t:Date.now()},true)}
    const mine=sum.gb2[g];if(!mine)return null;if(!all)return {best:mine};
    const others=(all[g]||[]).filter(r=>r.seat!==user.seat);return {rank:1+others.filter(x=>gBetter(g,x,mine)).length,best:mine}}
};

/* ===================== 練習 ===================== */
let pu=0,round=null,cur=0,tries=0,solved=false,hintK=0,qStart=0;
let val='',fv={w:'',n:'',d:''},act='n';
const unitOf=k=>k==='mix'?MIX:k==='wb'?WB:UN[k];
function mkQ(u,t){const q=UN[u].g[t]();q.u=u;q.t=t;if(!q.type)q.type='num';if(q.type==='cmp'){q.type='mc';q.opts=['＞','＜','＝'];q.row=true}
  if(q.pre==null)q.pre=q.fig?'約':'';if(q.unit==null)q.unit='';return q}
/* 題目指紋:同一題(數字、圖都一樣)會得到一樣的指紋 */
const qKey=q=>{const s=q.text+'|'+(q.big||'')+'|'+JSON.stringify(q.fig||'')+'|'+JSON.stringify(q.opts||'');let h=5381;for(let i=0;i<s.length;i++)h=(h*33+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
/* 出題:最近 100 題出過的盡量不再出;例題(ex)不記錄 */
let SEEN=LS.get('learn601_seen',[]);
function genQ(u,t,ex){let q;for(let i=0;i<20;i++){q=mkQ(u,t);if(ex||!SEEN.includes(qKey(q)))break}
  if(!ex){SEEN.push(qKey(q));if(SEEN.length>100)SEEN=SEEN.slice(-100);LS.set('learn601_seen',SEEN)}return q}
function listFor(types,n){let L=[];while(L.length<n)L.push(...shuf(types));L=shuf(L.slice(0,n));
  for(let i=1;i<L.length;i++)if(L[i]===L[i-1]){const j=L.findIndex((t,k)=>k>i&&t!==L[i]&&t!==L[i-1]);if(j>0)[L[i],L[j]]=[L[j],L[i]]}return L}
function startPractice(k){pu=k;const U=unitOf(k);const PN=document.getElementById('prac');PN.style.setProperty('--c',U.c);PN.style.setProperty('--cb',U.cb);
  document.getElementById('pua').textContent=k==='mix'?'★ 綜合':k==='wb'?'📕 錯題':'單元 '+U.no;document.getElementById('pub').textContent=U.name;
  show$('prac');history.pushState({p:1},'');newRound()}
function newRound(){let qs;
  if(pu==='mix'){const cnt=shuf([3,3,2,2]);let items=[];cnt.forEach((c,u)=>shuf([...new Set(UN[u].types)]).slice(0,c).forEach(t=>items.push([u,t])));
    items=shuf(items);for(let i=1;i<items.length;i++)if(items[i][0]===items[i-1][0]){const j=items.findIndex((x,k)=>k>i&&x[0]!==items[i-1][0]);if(j>0)[items[i],items[j]]=[items[j],items[i]]}
    qs=items.map(([u,t])=>genQ(u,t))}
  else if(pu==='wb'){const W=wbLoad();qs=W.slice(0,10).map(x=>JSON.parse(JSON.stringify(x.q)))}
  else qs=listFor(UN[pu].types,10).map(t=>genQ(pu,t));
  N=qs.length;
  round={qs,res:Array(N).fill(null),det:qs.map(q=>({u:q.u,t:q.t,w:[],h:0,s:0})),t0:Date.now(),logged:false};cur=0;showQ()}
function paintP(){const done=round.res.filter(x=>x).length;document.querySelector('#pbar i').style.width=done/N*100+'%';document.getElementById('pcnt').textContent=`${done} / ${N}`;
  const t=document.getElementById('ptk');if(t)t.innerHTML=`🎟️ × ${sum.tk||0}<small>這輪 ${sum.tc||0}/10・答對 ${sum.tco||0}</small>`}
const tkLeft=()=>TK_EVERY-(sum.tc||0);
const tkInfo=()=>`這輪做了 ${sum.tc||0}/10 題，答對 ${sum.tco||0} 題`;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('on');void e.offsetWidth;e.classList.add('on')}
function paintDots(){const D=document.getElementById('dots');D.innerHTML='';round.res.forEach((r,i)=>{const e=el('i',r||'');if(i===cur)e.classList.add('cur');D.appendChild(e)})}
function logRound(partial){if(!round||round.logged)return;const n=round.res.filter(x=>x).length;if(!n)return;round.logged=true;
  const first=round.res.filter(x=>x==='ok').length,all=round.res.filter(x=>x==='ok'||x==='ok2').length;
  logPush({k:'p',unit:pu==='mix'||pu==='wb'?pu:UN[pu].key,n,first,all,sec:Math.round((Date.now()-round.t0)/1000),part:partial?1:0,q:round.det.filter((d,i)=>round.res[i]).map((d,i)=>Object.assign({r:round.res[i]},d))});
  saveSum(true)}
function leavePractice(){$('#teach').classList.remove('on');logRound(true);if(!user)return show$('login');document.getElementById('end').classList.remove('on');enterHome()}
tap(document.getElementById('pback'),()=>history.back());

const pad=$('#pad');
function buildPad(fracMode){pad.innerHTML='';['7','8','9','⌫','4','5','6','C','1','2','3',fracMode?'下一格':'.','0','檢查'].forEach(k=>{const b=el('button',k==='⌫'||k==='C'?'del':k==='檢查'?'ck':k==='下一格'?'nx':'',k);tap(b,()=>key(k));pad.appendChild(b)})}
['bw','bn','bd'].forEach(id=>tap($('#'+id),e=>{if(solved)return;act=e.currentTarget.dataset.k;paintF()}));
function paintF(){['w','n','d'].forEach(k=>{const e=$('#b'+k);e.textContent=fv[k];e.classList.toggle('act',k===act&&!solved)})}
function key(k){if(solved||!round)return;const q=round.qs[cur];if(q.type==='mc')return;if(k==='檢查')return check();
  if(q.type==='frac'){$('#fbx').classList.remove('no');
    if(k==='下一格'){act={w:'n',n:'d',d:'w'}[act];return paintF()}
    let v=fv[act];if(k==='⌫')v=v.slice(0,-1);else if(k==='C')v='';else if(/\d/.test(k)&&v.length<4)v=(v==='0'?'':v)+k;fv[act]=v;paintF();return}

  h+=E.slice(0,12).map(x=>`<tr><td class="l">${x.m}</td><td class="l">${uBadge(x.u)}${tName(x.u,x.t)}</td><td>${x.n}</td><td class="l">${[...x.who].sort((a,b)=>a-b).join('、')}</td></tr>`).join('')||'<tr><td colspan="4">還沒有錯誤紀錄</td></tr>';
  h+='</table>';
  O.innerHTML=h;O.querySelectorAll('tr.st').forEach(tr=>tr.addEventListener('click',()=>renderAna(sel===tr.dataset.s?null:tr.dataset.s)))}
tap($('#hcalc'),async()=>{const rows=await fetchAll($('#hmsg'));if(!rows)return;const per=+$('#hpd').value||0,cap=+$('#hcap').value||0,wk=weekKeys(+$('#hwk').value);
  const out=rows.map(([s,v])=>{const days=v&&v!=='err'?wk.filter(k=>((v.days||{})[k]||0)>=GOAL).length:0;return [s,Math.min(cap,days*per),days]});
  $('#hout').value=out.map(([s,p])=>`${s}\t${p}`).join('\n');
  $('#hmsg').textContent=`${wk[0].slice(5)}～${wk[6].slice(5)}：共 ${out.filter(x=>x[1]>0).length} 人加點`+(rows.some(r=>r[1]==='err')?'（有人讀取失敗）':'')});
tap($('#hcopy'),async()=>{const t=$('#hout');try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand('copy')}$('#hmsg').textContent='✅ 已複製，可以貼到榮譽卡系統'});
tap($('#tabload'),async()=>{const pins=LS.get('learn601_pins',null);if(!pins){$('#tabmsg').textContent='請先在 ① 選擇 pins.json';return}
  $('#tabmsg').textContent='讀取中…';await fbReady;if(!db){$('#tabmsg').textContent='連不上 Firebase';return}
  const today=dkey(),mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7));const wk=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);wk.push(dkey(d))}
  const rows=await Promise.all(Object.keys(pins).sort((a,b)=>a-b).map(async s=>{try{const v=(await timeout(db.ref(`${ROOT}/u/${s}/${pins[s]}/sum`).get(),10000)).val();return [s,v]}catch(e){return [s,'err']}}));
  let h='<tr><th>座號</th><th>今天</th><th>本週完成天數</th><th>累計題數</th><th>一次答對率</th><th>最近練習</th></tr>';
  rows.forEach(([s,v])=>{if(!v||v==='err'){h+=`<tr class="none"><td>${s}</td><td colspan="5">${v==='err'?'讀取失敗':'還沒練習'}</td></tr>`;return}
    const L=v.last?new Date(v.last):null;h+=`<tr><td>${s}</td><td>${(v.days||{})[today]||0}</td><td>${wk.filter(k=>((v.days||{})[k]||0)>=GOAL).length}</td><td>${v.total||0}</td><td>${v.total?Math.round(v.first/v.total*100):0}%</td><td>${L?`${L.getMonth()+1}/${L.getDate()} ${pad2(L.getHours())}:${pad2(L.getMinutes())}`:''}</td></tr>`});
  $('#tab').innerHTML=h;$('#tabmsg').textContent=`更新時間 ${new Date().toLocaleTimeString()}`});
